<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@800;900&display=swap">
<style>
:root{--creme:#FFF6D9;--verde:#1B4A3F;--folha:#2A8F63;--sol:#F2B33D;--amarelo:#F2CB25;--toldo:#E4573D;--tinta:#16322B}
*{box-sizing:border-box;margin:0;padding:0} body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Nunito,sans-serif}
.cena{position:absolute;inset:0;overflow:hidden;opacity:0}
.d{font-family:"Baloo 2",sans-serif;font-weight:800;line-height:.92}
.toldo{position:absolute;left:-20px;right:-20px;top:0;height:130px;background:repeating-linear-gradient(90deg,var(--toldo) 0 90px,#FFF7EA 90px 180px);mask:radial-gradient(48px at 45px 130px,#0000 98%,#000) -45px 0/90px 100% repeat-x}
.st{position:absolute;filter:drop-shadow(0 18px 22px rgba(0,0,0,.28))} .st img{width:100%;display:block}
.leg{position:absolute;left:60px;right:60px;bottom:400px;text-align:center;opacity:0}
.leg span{display:inline;background:rgba(22,50,43,.88);color:#fff;font:900 54px/1.45 Nunito;padding:6px 20px;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.chip{display:inline-flex;align-items:center;gap:14px;background:var(--verde);color:#fff;border-radius:999px;padding:14px 34px;font:900 40px Nunito}
.gp{display:inline-flex;align-items:center;gap:18px;background:#111;color:#fff;border-radius:24px;padding:18px 34px 18px 24px;font:800 28px Nunito;line-height:1.05;text-align:left}
.gp b{display:block;font:800 48px "Baloo 2";line-height:.9} .gp svg{width:64px;height:64px}
.celular{position:absolute;border-radius:70px;background:#111;padding:20px;box-shadow:0 50px 90px rgba(0,0,0,.45)} .celular video{display:block;width:100%;border-radius:52px}
</style></head><body>
<div class="cena" id="abre" style="background:radial-gradient(circle at 50% 42%,#FFE89A,var(--creme) 62%)">
  <img id="ave" src="assets/bentevi-galho.png" style="position:absolute;left:190px;top:380px;width:700px">
  <img id="marca" src="assets/bentevi-marca.png" style="position:absolute;left:290px;top:1020px;width:500px">
  <div id="apres" style="position:absolute;left:0;right:0;top:1190px;text-align:center;font:900 50px Nunito;color:var(--verde)"></div></div>
<div class="cena" id="palavras"></div>
<div class="cena" id="jogo"><img id="fundo" style="position:absolute;inset:-60px;width:1200px;height:2040px;object-fit:cover;filter:blur(18px) brightness(.75)">
  <div class="celular" id="cel" style="left:150px;top:150px;width:780px"><video id="vid" muted preload="auto"></video></div></div>
<div class="cena" id="mercados"></div>
<div class="cena" id="fim" style="background:var(--creme)"></div>
<div class="leg" id="leg"><span id="legt"></span></div>
<script>
const q=new URLSearchParams(location.search), TIPO=q.get('tipo'), LG=q.get('l'), L=(pt,en)=>LG==='en'?en:pt, $=id=>document.getElementById(id);
const I=c=>`assets/i/${c}.png`;
const MK=[['mercado-01-ver-o-peso-belem','Ver-o-Peso','Belém · PA'],['mercado-02-adolpho-lisboa-manaus','Mercado Adolpho Lisboa','Manaus · AM'],['mercado-03-sao-joaquim-salvador','Feira de São Joaquim','Salvador · BA'],
 ['mercado-04-sao-jose-recife','Mercado de São José','Recife · PE'],['mercado-05-fortaleza','Mercado Central','Fortaleza · CE'],['mercado-06-feira-central-campo-grande','Feira Central','Campo Grande · MS'],
 ['mercado-07-mercadao-sp-interior','Mercadão','São Paulo · SP'],['mercado-08-belo-horizonte-aerea','Mercado Central','Belo Horizonte · MG'],['mercado-09-sao-cristovao-aerea','Feira de São Cristóvão','Rio de Janeiro · RJ'],
 ['mercado-10-porto-alegre','Mercado Público','Porto Alegre · RS'],['mercado-11-florianopolis','Mercado Público','Florianópolis · SC'],['mercado-12-curitiba','Mercado Municipal','Curitiba · PR']];
// legendas: [início, fim, texto] em segundos do vídeo (narração começa em OFF)
const OFF=TIPO==='jogo'?1.3:1.25;
const LEG={jogo:{pt:[[0.06,1.6,'Junte, entregue e viaje!'],[2.7,4.6,'Na Quitanda Zen, você cuida da sua banca'],[4.6,6.5,'e roda o Brasil de feira em feira.'],[7.1,8.7,'Sem pressa e sem derrota.'],[9.3,11.2,'Baixe grátis no Google Play!']],
              en:[[0.14,1.8,'Merge, deliver, travel!'],[2.86,4.9,'In Quitanda, you run your own market stall'],[4.9,6.95,'and tour Brazil, one market at a time.'],[7.94,9.4,'No rush, no losing.'],[10.46,12.1,'Get it free on Google Play!']]},
         mercados:{pt:[[0.06,1.9,'Do Ver-o-Peso, em Belém,'],[2.0,3.5,'ao Mercadão de São Paulo.'],[4.0,5.6,'Doze mercados do Brasil,'],[5.6,6.9,'cada um com o seu sabor.'],[7.5,8.5,'Quitanda Zen:'],[8.5,10.3,'o Brasil inteiro numa banca.']],
                   en:[[0.18,1.6,'From Ver-o-Peso in Belém'],[1.6,3.1,'to São Paulo’s Mercadão.'],[4.2,5.6,'Twelve real Brazilian markets,'],[5.6,7.2,'each with its own flavor.'],[8.34,8.9,'Quitanda:'],[8.9,11.0,'all of Brazil in one market stall.']]}}[TIPO][LG];
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), pop=x=>{ x=Math.max(0,Math.min(1,x)); const c1=1.7,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }, cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const gp=`<div class="gp"><svg viewBox="0 0 48 48"><path fill="#34A853" d="M6 4l23 20L6 44c-1-.5-1.6-1.5-1.6-2.8V6.8C4.4 5.5 5 4.5 6 4z"/><path fill="#FBBC04" d="M29 24l7 6-25 14c-1 .5-2 .6-3 .3L29 24z"/><path fill="#4285F4" d="M36 18l6 3.4c2.4 1.4 2.4 3.8 0 5.2L36 30l-7-6 7-6z"/><path fill="#EA4335" d="M8 3.7c1-.3 2-.2 3 .3l25 14-7 6L8 3.7z"/></svg><span>${L('DISPONÍVEL NO','GET IT ON')}<b>Google Play</b></span></div>`;
$('apres').textContent=L('apresenta','presents');
// cena "palavras" (só no reel do jogo)
const PAL=[[L('Junte','Merge'),'var(--folha)','fr-2',0.1],[L('Entregue','Deliver'),'var(--sol)','pe-3',0.65],[L('Viaje!','Travel!'),'var(--toldo)','fr-8',1.25]];
$('palavras').innerHTML=PAL.map((p,k)=>`<div id="pw${k}" style="position:absolute;inset:0;background:${p[1]};opacity:0"><div class="toldo"></div>
  <img src="${I(p[2])}" id="pi${k}" style="position:absolute;left:290px;top:520px;width:500px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.3))">
  <div class="d" id="pt${k}" style="position:absolute;left:0;right:0;top:1120px;text-align:center;font-size:${k===2?230:200}px;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.15)">${p[0]}</div></div>`).join('');
// cena mercados
$('mercados').innerHTML=MK.map((m,k)=>`<div id="mk${k}" style="position:absolute;inset:0;opacity:0"><img src="assets/m/${m[0]}.jpg" id="mi${k}" style="position:absolute;left:50%;top:50%;height:1920px;transform:translate(-50%,-50%)">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 55%,rgba(0,0,0,.55))"></div>
  <div id="ml${k}" style="position:absolute;left:60px;top:150px"><div class="chip" style="background:var(--toldo);font-size:34px">${String(k+1).padStart(2,'0')} / 12</div>
   <div class="d" style="font-size:96px;color:#fff;margin-top:22px;text-shadow:0 6px 18px rgba(0,0,0,.5)">${m[1]}</div><div style="font:900 46px Nunito;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.6)">📍 ${m[2]}</div></div></div>`).join('');
// cena final
$('fim').innerHTML=`<div class="toldo"></div>
  <div class="st" id="f1" style="left:60px;top:300px;width:230px"><img src="${I('fr-5')}"></div><div class="st" id="f2" style="left:800px;top:330px;width:230px"><img src="${I('pe-6')}"></div>
  <div class="st" id="f3" style="left:70px;top:1330px;width:200px"><img src="${I('be-7')}"></div><div class="st" id="f4" style="left:820px;top:1330px;width:200px"><img src="${I('ve-8')}"></div>
  <div id="ic" style="position:absolute;left:250px;top:330px;width:580px;height:580px;border-radius:140px;overflow:hidden;box-shadow:0 40px 80px rgba(27,74,63,.35),0 0 0 16px #fff"><img src="assets/quitanda-icone.png" style="width:100%"></div>
  <div id="ft" style="position:absolute;left:0;right:0;top:990px;text-align:center"><div class="d" style="font-size:150px;color:var(--verde)">${L('Quitanda Zen','Quitanda')}</div>
   <div style="font:900 50px Nunito;color:var(--toldo);margin-top:14px">${L('Grátis no Google Play','Free on Google Play')}</div><div style="margin-top:40px">${gp}</div></div>
  <div id="fa" style="position:absolute;left:0;right:0;top:1560px;display:flex;justify-content:center;align-items:center;gap:16px;font:900 40px Nunito;color:var(--verde)"><img src="assets/bentevi-passaro.png" style="height:80px">${L('um jogo Bentevi','a Bentevi game')}</div>`;
if(TIPO==='jogo'){ $('vid').src=`video/gameplay-${LG}.webm`; $('fundo').src='assets/m/mercado-01-ver-o-peso-belem.jpg'; }
const show=(id,o)=>{ $(id).style.opacity=o; };
const T={jogo:{abre:[0,1.35],pal:[1.35,4.3],jogo:[4.3,11.7],fim:[11.7,15]},mercados:{abre:[0,1.25],merc:[1.25,12.05],fim:[12.05,15]}}[TIPO];
const VID0=1.0;
async function setT(t){
  // abertura: bem-te-vi cai e balança
  const a=T.abre; show('abre', t<a[1]?1:(t<a[1]+.2?1-(t-a[1])/.2:0));
  if(t<a[1]+.2){ const k=pop(t/0.55); $('ave').style.transform=`translateY(${(1-k)*-260}px) scale(${.7+.3*k})`; $('ave').style.opacity=cl(t/.2,0,1);
    const m=ease((t-.35)/.4); $('marca').style.opacity=m; $('marca').style.transform=`translateY(${(1-m)*40}px)`; $('apres').style.opacity=ease((t-.6)/.3); }
  if(T.pal){ const [p0,p1]=T.pal, on=t>=p0&&t<p1+.15; show('palavras',on?1:0);
    if(on){ const r=t-p0; PAL.forEach((p,k)=>{ const s=p[3], e=k<2?PAL[k+1][3]:9, vis=r>=s&&r<e; $('pw'+k).style.opacity=vis?1:0;
      if(vis){ const x=r-s; $('pt'+k).style.transform=`scale(${pop(x/.35)})`; $('pi'+k).style.transform=`translateY(${(1-pop(x/.45))*300 + Math.sin(x*6)*10}px) rotate(${Math.sin(x*4)*6}deg)`; } }); } }
  if(T.jogo){ const [j0,j1]=T.jogo, on=t>=j0-.2&&t<j1+.2; show('jogo',on?cl(Math.min((t-j0+.2)/.25,(j1+.2-t)/.25),0,1):0);
    if(on){ const r=t-j0, s=.92+.08*pop((r+.2)/.5); $('cel').style.transform=`scale(${s}) rotate(${(1-pop((r+.2)/.6))*-6}deg)`;
      const v=$('vid'), want=cl(VID0+r,0,v.duration-0.05); if(Math.abs(v.currentTime-want)>.001){ await new Promise(res=>{ v.onseeked=res; v.currentTime=want; }); } } }
  if(T.merc){ const [m0,m1]=T.merc, on=t>=m0&&t<m1+.2; show('mercados',on?1:0);
    if(on){ const d=(m1-m0)/12, r=t-m0; MK.forEach((_,k)=>{ const s=k*d, x=r-s, vis=x>=-.12&&x<d; $('mk'+k).style.opacity=vis?(x<0?1+x/.12:1):0;
      if(vis){ $('mi'+k).style.transform=`translate(-50%,-50%) translateX(${(k%2?1:-1)*(60-120*cl(x/d,0,1))}px) scale(${1.04+.08*cl(x/d,0,1)})`; const l=pop((x-.05)/.3); $('ml'+k).style.transform=`translateX(${(1-l)*-500}px)`; } }); } }
  const [f0]=T.fim, fo=t>=f0; show('fim',fo?cl((t-f0)/.2,0,1):0);
  if(fo){ const r=t-f0; $('ic').style.transform=`scale(${pop(r/.5)}) rotate(${(1-pop(r/.5))*-12}deg)`; const ft=ease((r-.25)/.4); $('ft').style.opacity=ft; $('ft').style.transform=`translateY(${(1-ft)*60}px)`;
    ['f1','f2','f3','f4'].forEach((id,k)=>{ const x=r-.1*k; $(id).style.transform=`scale(${pop(x/.4)}) translateY(${Math.sin(x*3+k)*14}px)`; }); $('fa').style.opacity=ease((r-.7)/.4); }
  // legendas
  const lt=t-OFF, cur=LEG.find(([a,b])=>lt>=a-.05&&lt<b+.1); $('leg').style.opacity=cur&&!(fo&&t-f0>.3)?1:0; if(cur) $('legt').textContent=cur[2];
}
window.setT=setT;
document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(o=>{i.onload=i.onerror=o;})))).then(()=>{
  const v=$('vid'); if(TIPO!=='jogo'||v.readyState>=2) return 1; return new Promise(o=>{ v.oncanplay=o; v.load(); }); }).then(()=>{ document.body.dataset.pronto=1; });
</script></body></html>
