<!doctype html>
<html><head><meta charset="utf-8">
<!-- Peças de Instagram da Bentevi Apps. Abrir com ?p=<id>. Gerar: node render.js pecas.html SAIDA 1080 1350 1 id=p=id -->
<style>
@font-face{font-family:Baloo;src:url(assets/fontes/baloo-2-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Baloo;src:url(assets/fontes/baloo-2-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Baloo;src:url(assets/fontes/baloo-2-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Andika;src:url(assets/fontes/andika-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:SG;src:url(assets/fontes/space_grotesk.ttf);font-weight:300 700}
:root{--creme:#FFF6D9;--verde:#1D4A3F;--ouro:#E0A800;--amarelo:#F7C51E;--musgo:#557A6E;--branco:#FFFDF6;
 --qz:#2A8F63;--qz2:#DCEFE4;--toldo:#E4573D;--lb:#3A6DF0;--lbceu:#7FD6F5;--lbareia:#FFE8A3;--tt:#1B6E4F;--tt2:#CDEBDD;--moeda:#F2A900;--rt:#0F7A73;--rt2:#E2F0EE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Baloo,system-ui,sans-serif;color:var(--verde);background:#fff}
#peca{position:relative;overflow:hidden;width:1080px;height:1350px;background:var(--creme)}
#peca.story{height:1920px}#peca.quad{height:1080px}
.abs{position:absolute}
.d{font-weight:800;line-height:.95;letter-spacing:-.01em}
.wm{font:800 150px/1 Baloo;letter-spacing:-3px;color:var(--verde);position:relative;display:inline-block}
.wm .y{color:var(--ouro)}
.wm i{position:absolute;left:4%;right:4%;bottom:-6px;height:16px;border-radius:16px;background:var(--amarelo)}
.wsub{font:800 34px Baloo;letter-spacing:16px;text-transform:uppercase;color:var(--musgo);margin-top:30px;padding-left:16px}
.centro{display:flex;flex-direction:column;align-items:center;text-align:center}
.cartao{background:var(--branco);border-radius:44px;box-shadow:0 24px 50px rgba(29,74,63,.16)}
.ic{border-radius:22%;box-shadow:0 18px 34px rgba(0,0,0,.22);display:block}
.cel{border-radius:58px;background:#111;padding:16px;box-shadow:0 40px 70px rgba(0,0,0,.28)}
.cel img{display:block;width:100%;border-radius:44px}
.chip{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:12px 30px;font:800 30px Baloo;background:var(--verde);color:#fff}
.chip.cl{background:#fff;color:var(--verde)}
.chip.am{background:var(--amarelo);color:var(--verde)}
.assin{position:absolute;display:flex;align-items:center;gap:12px;font:800 28px Baloo;color:var(--verde)}
.assin img{height:58px}
.dots{position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(29,74,63,.25)}.dots i.on{background:var(--verde)}
.b-claro .dots i{background:rgba(255,255,255,.4)}.b-claro .dots i.on{background:#fff}
.lista{display:flex;flex-direction:column;gap:18px;text-align:left}
.lista div{display:flex;gap:18px;align-items:flex-start;font:700 34px/1.15 Baloo}
.lista b{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 26px Baloo;color:#fff;margin-top:-2px}
.slot{border:4px dashed rgba(29,74,63,.35);border-radius:36px;display:grid;place-items:center;font:700 28px Baloo;color:rgba(29,74,63,.55);text-align:center}
.n{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;color:#fff;font:800 50px Baloo}
.galho{position:absolute}
</style></head>
<body><div id="peca"></div>
<script>
const P=new URLSearchParams(location.search).get('p');
const el=document.getElementById('peca');
const A=n=>'assets/'+n;
const MARCA=(c='#1B6E4F',s=60)=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120"><path d="M10,64 H26 L60,28 L94,64 H110" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="80" r="18" fill="#F2A900"/><circle cx="60" cy="80" r="12" fill="none" stroke="#C98200" stroke-width="3"/></svg>`;
const ICTETO=s=>`<div class="ic" style="width:${s}px;height:${s}px;background:#1B6E4F;display:grid;place-items:center">${MARCA('#fff',s*.74)}</div>`;
const IC={qz:s=>`<img class="ic" src="${A('quitanda-512.png')}" style="width:${s}px">`,lb:s=>`<img class="ic" src="${A('lerbrincando-512.png')}" style="width:${s}px">`,
 rt:s=>`<img class="ic" src="${A('rota-512.png')}" style="width:${s}px">`,tt:ICTETO};
const WM=(sz=150)=>`<div class="centro"><div class="wm" style="font-size:${sz}px">Ben<span class="y">te</span>vi<i style="height:${sz*.1}px"></i></div><div class="wsub" style="font-size:${sz*.22}px;letter-spacing:${sz*.1}px;margin-top:${sz*.2}px">apps</div></div>`;
const ASSIN=(x,y,cor)=>`<div class="assin" style="left:${x}px;top:${y}px;${cor?'color:'+cor:''}"><img src="${A('pousado-limpo.png')}">Bentevi Apps</div>`;
const DOTS=(n,i)=>`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k==i?'on':''}"></i>`).join('')}</div>`;
const CEL=(img,w,x,y,rot=0)=>`<div class="abs cel" style="width:${w}px;left:${x}px;top:${y}px;transform:rotate(${rot}deg)"><img src="${A(img)}"></div>`;
const LISTA=(itens,cor)=>`<div class="lista">${itens.map((t,i)=>`<div><b style="background:${cor}">${i+1}</b><span>${t}</span></div>`).join('')}</div>`;

const APPS={
 qz:{nome:'Quitanda Zen',cor:'#2A8F63',fundo:'#DCEFE4',tela:'1-tabuleiro.png',tela2:'3-map.png',status:'Grátis no Google Play',
   frase:'Junte, entregue e viaje pelos mercados do Brasil.',itens:['Junte itens iguais e crie coisas melhores','Atenda a turma da feira','12 mercados de verdade, sem pressa e sem derrota']},
 lb:{nome:'Ler Brincando',cor:'#3A6DF0',fundo:'#E5F4FB',tela:'celular-3-mapa.png',tela2:'celular-5-trem-das-silabas.png',status:'Em breve',
   frase:'Aprender a ler pelo som das letras, com a corujinha Lili.',itens:['Para crianças de 5 a 7 anos','93 fases e 11 historinhas','Sem anúncios e funciona sem internet']},
 tt:{nome:'Teto',cor:'#1B6E4F',fundo:'#E9F2EC',tela:'teto-1-hoje.png',tela2:'teto-2-explica.png',status:'Em breve',
   frase:'Quanto posso gastar hoje sem faltar dinheiro até a próxima entrada?',itens:['Um número por dia: o teto de hoje','Feito para quem tem renda que varia','Mostra a conta, passo a passo']},
 rt:{nome:'Rota das Feiras',cor:'#0F7A73',fundo:'#E2F0EE',tela:'rota-4.png',tela2:'rota-2.png',status:'Em breve',
   frase:'Puzzle de fusão com turnos contados, fases e chefes.',itens:['Fases com 1 a 3 estrelas','Do Ver-o-Peso a Porto Alegre','Diário de viagem com histórias reais']}};

const F={
// ---------- PERFIL ----------
'perfil':()=>{el.className='quad';el.style.background='#F7C51E';return `
 <img class="abs" src="${A('bentevi-no-galho.png')}" style="width:1250px;left:-250px;top:-60px">`},
'perfil-creme':()=>{el.className='quad';return `

 <img src="${A('bentevi-no-galho.png')}" style="width:470px;margin-left:60px">${WM(110)}</div>`},

'01-prazer-bentevi-apps':()=>`
 <img class="abs" src="${A('bentevi-no-galho.png')}" style="width:540px;left:520px;top:0px">

  <div style="font:700 42px Baloo;color:var(--musgo);margin-top:30px">Conheça tudo o que sai do nosso ninho 👉</div></div>

  <span class="chip" style="background:${a.status=='Em breve'?'var(--amarelo)':a.cor};color:${a.status=='Em breve'?'var(--verde)':'#fff'};font-size:26px;padding:6px 22px;margin-top:10px">${a.status}</span></div></div>

 <div class="abs" style="left:70px;top:${k=='tt'?660:620}px;width:440px">${LISTA(a.itens,a.cor)}</div>

 <div class="abs" style="left:70px;top:90px;display:flex;align-items:center;gap:18px">${MARCA('#fff',90)}<span style="font:700 70px SG;color:#fff;letter-spacing:-2px">teto</span></div>
 <div class="abs" style="left:70px;top:240px;width:520px;font:700 76px/1.02 SG;color:#fff;letter-spacing:-2px">Quanto posso gastar <span style="color:#F2A900">hoje</span>?</div>
 <div class="abs" style="left:70px;top:620px;width:470px;font:500 36px/1.3 Baloo;color:#CDEBDD">Um número por dia. Ele já desconta as contas, a fatura e as parcelas até a próxima entrada de dinheiro.</div>
 <div class="abs" style="left:70px;top:930px"><span class="chip am">Em breve no Android</span></div>
 ${CEL('teto-1-hoje.png',430,590,250,3)}
 ${ASSIN(70,1200,'#fff')}`},

'04-teto-como-funciona-1':()=>{el.style.background='#E9F2EC';return `
 <div class="abs" style="left:70px;top:90px;display:flex;align-items:center;gap:16px">${MARCA('#1B6E4F',80)}<span style="font:700 60px SG;color:#1B6E4F">teto</span></div>
 <div class="abs" style="left:70px;top:230px;width:940px;font:700 92px/1 SG;letter-spacing:-3px;color:#0B2E21">Renda que varia?<br>O Teto foi feito<br>pra você.</div>
 <div class="abs" style="left:70px;top:600px;width:900px;font:700 40px/1.3 Baloo;color:#4C6358">Uber, 99, iFood, autônomo, MEI, comissão. Mês bom e mês fraco. A gente faz a conta pelo mês mais fraco, e se vier mais, sobra.</div>
 <div class="abs" style="left:70px;top:900px;display:flex;gap:20px;flex-wrap:wrap;width:940px">${['🛵 Entregador','🚗 Motorista','🧰 Autônomo','📈 Comissão','💼 CLT no aperto'].map(t=>`<span class="chip cl" style="font-size:32px;box-shadow:0 8px 20px rgba(27,110,79,.15)">${t}</span>`).join('')}</div>
 <div class="abs" style="right:70px;bottom:110px;font:800 36px Baloo;color:#1B6E4F">Arraste 👉</div>${DOTS(5,0)}`},
...Object.fromEntries([
 ['teto-1-hoje.png','Um número por dia','O teto de hoje é quanto dá para gastar sem faltar para as contas até a próxima entrada. O que sobrar hoje aumenta o teto de amanhã.'],
 ['teto-2-explica.png','Sem caixa-preta','Toque em “De onde vem?” e veja a conta inteira: saldo, entradas, contas, fatura, parcelas e o colchão.'],
 ['teto-3-ganha.png','Pelo pior mês','A renda variável entra no ritmo do mês mais fraco, só nos dias em que você trabalha. Mês bom vira folga, não susto.'],
 ['teto-4-avisos.png','Ele lê os avisos','Repasse do app, Pix e compra no cartão aparecem sozinhos para você confirmar. Menos digitação, mais controle.']
].map(([img,t,d],i)=>['04-teto-como-funciona-'+(i+2),()=>{el.style.background='#E9F2EC';return `
 <div class="abs" style="left:70px;top:90px;display:flex;align-items:center;gap:22px"><span class="n" style="background:#1B6E4F">${i+1}</span><span style="font:700 66px SG;color:#0B2E21;letter-spacing:-2px">${t}</span></div>
 ${CEL(img,470,70,250,-2)}
 <div class="abs" style="left:590px;top:330px;width:420px;font:700 40px/1.3 Baloo;color:#0B2E21">${d}</div>
 <div class="abs" style="left:590px;top:1010px;display:flex;align-items:center;gap:12px;font:700 30px SG;color:#1B6E4F">${MARCA('#1B6E4F',50)}teto</div>
 ${DOTS(5,i+1)}`}])),

'05-rota-das-feiras-em-breve':()=>{el.style.background='#E2F0EE';return `
 <div class="abs" style="left:0;right:0;top:0;height:120px;background:repeating-linear-gradient(90deg,#0F7A73 0 90px,#FFF7EA 90px 180px);-webkit-mask:radial-gradient(48px at 45px 120px,#0000 98%,#000) -45px 0/90px 100% repeat-x"></div>
 <div class="abs" style="left:70px;top:190px">${IC.rt(150)}</div>
 <div class="abs d" style="left:250px;top:190px;font-size:96px;color:#0E3F44">Rota das<br>Feiras</div>
 <div class="abs" style="left:70px;top:400px;width:470px;font:800 46px/1.12 Baloo;color:#0E3F44">Gosta de desafio? Cada toque conta.</div>
 <div class="abs" style="left:70px;top:560px;width:450px">${LISTA(['Turnos contados e 1 a 3 estrelas','Chefe no fim de cada mercado','Começa no Ver-o-Peso, em Belém'],'#0F7A73')}</div>
 <div class="abs" style="left:70px;top:960px"><span class="chip am">Em breve</span></div>
 ${CEL('rota-4.png',420,600,250,3)}
 ${ASSIN(70,1200)}`},

'06-qual-app-e-pra-voce':()=>`
 <div class="abs centro" style="left:0;right:0;top:90px"><div class="d" style="font-size:96px">Qual app Bentevi<br>é a sua cara?</div></div>
 <div class="abs" style="left:70px;right:70px;top:380px;display:flex;flex-direction:column;gap:30px">
 ${[['qz','Quer relaxar depois de um dia puxado'],['lb','Tem criança de 5 a 7 anos aprendendo a ler'],['tt','Tem renda que varia e quer saber quanto pode gastar'],['rt','Gosta de quebra-cabeça com desafio']].map(([k,t])=>`
  <div class="cartao" style="display:flex;align-items:center;gap:34px;padding:26px 34px">${IC[k](130)}<div><div style="font:700 34px/1.15 Baloo">${t}</div><div style="font:800 40px Baloo;color:${APPS[k].cor};margin-top:6px">→ ${APPS[k].nome}</div></div></div>`).join('')}</div>
 <div class="abs" style="left:0;right:0;bottom:56px;text-align:center;font:800 32px Baloo;color:var(--musgo)">Marque quem precisa conhecer 👇</div>`,

 <div class="abs slot" style="left:220px;right:220px;top:1600px;height:200px">(adesivo de contagem regressiva)</div>`},

// ---------- DESTAQUES ----------
...Object.fromEntries([['d-teto','#1B6E4F',()=>MARCA('#fff',560)],['d-rota','#0F7A73',()=>`<img src="${A('rota-512.png')}" style="width:560px;border-radius:50%">`],['d-apps','#F7C51E',()=>`<img src="${A('bentevi-no-galho.png')}" style="position:absolute;width:1100px;left:-155px;top:415px">`],['d-lerbrincando','#7FD6F5',()=>`<img src="${A('lerbrincando-512.png')}" style="width:560px;border-radius:50%">`]].map(([id,cor,f])=>[id,()=>{el.className='story';el.style.background=cor;return `<div class="abs" style="inset:0;display:grid;place-items:center">${f()}</div>`}])),

...Object.fromEntries(['qz','lb','tt','rt'].map(k=>['r-'+k,()=>{const a=APPS[k];el.className='story';el.style.background=a.fundo;return `
 <div class="abs centro" style="left:0;right:0;top:170px;gap:20px">${IC[k](190)}<div class="d" style="font-size:110px;color:${a.cor}">${a.nome}</div>
 <div style="font:800 48px/1.15 Baloo;width:860px">${a.frase}</div></div>
 ${CEL(a.tela,520,280,780,0)}`}])),
'r-fim':()=>{el.className='story';return `
 <div class="abs centro" style="left:0;right:0;top:300px;gap:40px"><img src="${A('bentevi-no-galho.png')}" style="width:560px;margin-left:60px">${WM(170)}
 <div style="font:800 52px Baloo;margin-top:40px">Jogos e apps com cara de Brasil</div>
 <div style="display:flex;gap:30px;margin-top:20px">${['qz','lb','tt','rt'].map(k=>IC[k](150)).join('')}</div>

el.innerHTML=(F[P]||(()=>'?'))();
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>document.body.dataset.pronto='1');
