<g clip-path="url(#c)"><rect width="360" height="720" fill="url(#g)"/><text x="24" y="48" font-size="15" font-weight="800" fill="#fff" text-anchor="start">‹ Diário</text><text x="336" y="48" font-size="13" font-weight="700" fill="#CFEFEA" text-anchor="end">Norte · 1/7</text><rect x="24" y="70" width="312" height="590" rx="28" fill="#fff" /><rect x="40" y="86" width="280" height="190" rx="20" fill="#3B1E63" /><circle cx="180" cy="180" r="62" fill="#5B2A86"/><text x="180" y="205" font-size="72" font-weight="700" fill="#000" text-anchor="middle">🍇</text><text x="40" y="312" font-size="26" font-weight="800" fill="#0E4D52" text-anchor="start">Açaí</text><text x="40" y="336" font-size="13" font-weight="700" fill="#4A6A6D" text-anchor="start">Ver-o-Peso · Belém (PA)</text><text x="40" y="372" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">Fruto de uma palmeira amazônica, o açaí é</text><text x="40" y="394" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">base da alimentação em boa parte do Norte.</text><text x="40" y="416" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">No Ver-o-Peso, chega cedo nos barcos e é</text><text x="40" y="438" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">vendido ainda fresco, direto da região.</text><rect x="40" y="500" width="280" height="46" rx="23" fill="#5B2A86" /><text x="180" y="530" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Saiba mais</text><text x="180" y="600" font-size="12" font-weight="700" fill="#7A9094" text-anchor="middle">Cartão 1 de 7 · Ver-o-Peso</text></g></svg>