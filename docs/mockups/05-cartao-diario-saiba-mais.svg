<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="Nunito,'Trebuchet MS','Segoe UI',sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F5257"/><stop offset="1" stop-color="#0A3A40"/></linearGradient><clipPath id="c"><rect width="360" height="720" rx="28"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="360" height="720" fill="url(#g)"/><text x="24" y="48" font-size="15" font-weight="800" fill="#fff" text-anchor="start">‹ Diário</text><text x="336" y="48" font-size="13" font-weight="700" fill="#CFEFEA" text-anchor="end">Norte · 1/7</text><rect x="24" y="70" width="312" height="590" rx="28" fill="#fff" /><rect x="40" y="86" width="280" height="190" rx="20" fill="#3B1E63" /><circle cx="180" cy="180" r="62" fill="#5B2A86"/><text x="180" y="205" font-size="72" font-weight="700" fill="#000" text-anchor="middle">🍇</text><text x="40" y="312" font-size="26" font-weight="800" fill="#0E4D52" text-anchor="start">Açaí</text><text x="40" y="336" font-size="13" font-weight="700" fill="#4A6A6D" text-anchor="start">Ver-o-Peso · Belém (PA)</text><text x="40" y="372" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">No Pará, o açaí costuma ser servido como</text><text x="40" y="394" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">acompanhamento salgado, junto de peixe e</text><text x="40" y="416" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">farinha, e não só como sobremesa gelada,</text><text x="40" y="438" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">como ficou conhecido fora da região.</text><text x="40" y="460" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start"></text><text x="40" y="482" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">Os nomes dos produtos seguem no original,</text><text x="40" y="504" font-size="13" font-weight="600" fill="#2A3F41" text-anchor="start">sem tradução, em qualquer idioma do jogo.</text><rect x="40" y="570" width="280" height="40" rx="20" fill="#F3ECFA" /><text x="180" y="595" font-size="15" font-weight="800" fill="#5B2A86" text-anchor="middle">Fechar</text><text x="180" y="634" font-size="11" font-weight="700" fill="#7A9094" text-anchor="middle">Conteúdo a validar com fontes locais</text></g></svg>