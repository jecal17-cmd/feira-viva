<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rota das Feiras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Versão A · Rota das Feiras (protótipo de teste). Telas: inicial, mapa, mercado, fase; folhas (Diário, Selos, Ajustes) e cartões modais. */
:root{
  --bg:#E2F0EE; --panel:#F6FBFA; --cell:#FFFFFF; --hole:#C7E0DC; --ink:#0E3F44; --muted:#4D7276; --accent:#0F7A73; --on-accent:#FFFFFF;
  --gold:#B87A00; --star:#F2B33D; --line:#B1D4CF; --warn:#B4472E; --scrim:rgba(8,32,34,.84); --lvl:#5B2A86;
  --crate:#C99A63; --crate2:#8A5A33; --mold:#7FA65A; --water:#4F9FD0;
  --r0:#9FD5B4; --r1:#F4C98E; --r2:#E6DA86; --r3:#A9C8EC; --r4:#C9B5E6;
  --introbg:#FFF6D9; --introedge:transparent;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E2224; --panel:#16312F; --cell:#21423F; --hole:#132B2A; --ink:#E1F2EF; --muted:#97B9B4; --accent:#3FC2B4; --on-accent:#06201D;
  --gold:#F0C04A; --star:#F5C451; --line:#2C5250; --warn:#F08A6E; --scrim:rgba(3,12,12,.88); --lvl:#A87BD6;
  --crate:#8C6A44; --crate2:#5E4127; --mold:#5E8443; --water:#2F6F98;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E2224; --panel:#16312F; --cell:#21423F; --hole:#132B2A; --ink:#E1F2EF; --muted:#97B9B4; --accent:#3FC2B4; --on-accent:#06201D;
  --gold:#F0C04A; --star:#F5C451; --line:#2C5250; --warn:#F08A6E; --scrim:rgba(3,12,12,.88); --lvl:#A87BD6;
  --crate:#8C6A44; --crate2:#5E4127; --mold:#5E8443; --water:#2F6F98;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-weight:600;font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.1} h2{font-size:18px}
.main{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow:auto}
.main.game{overflow:hidden;gap:6px;padding-block:8px}
.bar{height:10px;border-radius:5px;background:var(--hole);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.btn{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:99px;padding:9px 16px;white-space:nowrap}
.btn.ghosty{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{font-family:var(--display);font-size:24px;padding:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.icon{background:var(--panel);border-radius:12px;width:38px;height:38px;font-size:18px;flex:0 0 auto}
.head{display:flex;align-items:center;gap:8px}
.head .t{flex:1;min-width:0}
.head .t b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t small{color:var(--muted);font-size:12px}
.pill{background:var(--panel);border-radius:99px;padding:6px 10px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.row{background:var(--panel);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.row>div{flex:1;min-width:0}
.row p{margin:2px 0 0;color:var(--muted);font-size:13px}
.row b{font-weight:800}
.row.lock{opacity:.6}
.row.cur{box-shadow:inset 0 0 0 2px var(--star)}
.row .face{font-size:30px;line-height:1;flex:0 0 auto;width:44px;text-align:center}
.note{color:var(--muted);font-size:13px;margin:0;max-width:60ch}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--hole)}
/* inicial */
.homein{margin:auto;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo{font-family:var(--display);font-weight:800;line-height:.95}
.logo b{display:block;font-size:46px;color:var(--accent)}
.logo small{display:block;font-family:var(--text);font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.hero{background:var(--panel);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:40px;letter-spacing:6px}
.hgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ii{width:1.12em;height:1.12em;object-fit:contain;vertical-align:-.2em;pointer-events:none;-webkit-user-drag:none}
.mbanner{flex:0 0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg)} .mbanner img{width:100%;height:100%;object-fit:cover;display:block}
.mtile{flex:0 0 auto;width:52px;height:52px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:28px;line-height:1;background:var(--bg);position:relative}
.mtile img{width:100%;height:100%;object-fit:cover;display:block} .mtile.lock img{filter:grayscale(1) blur(1px);opacity:.6} .mtile.lock::after{content:'🔒';position:absolute;font-size:20px}
.node.lock image{filter:grayscale(1);opacity:.75} .node .nlock{font-size:12px;transform:translate(11px,11px)}
.albl{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;font-size:14px} .albl span{color:var(--muted);font-size:12px;font-weight:800}
.alb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ing{background:var(--panel);border-radius:12px;padding:6px 2px 5px;text-align:center;position:relative;box-shadow:inset 0 -3px 0 var(--lc);min-width:0}
.ing .e{display:block;font-size:28px;line-height:1.15;height:34px} .ing .e .ii{vertical-align:0}
.ing small{display:block;font-size:10px;line-height:1.2;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing i{position:absolute;top:3px;left:5px;font:800 10px var(--text);font-style:normal;color:var(--muted)}
.ing em{position:absolute;top:-5px;right:-3px;background:var(--star);color:#3a2a00;font:800 9px var(--text);font-style:normal;border-radius:99px;padding:1px 5px}
.ing.no{opacity:.55} .ing.no .e{filter:grayscale(1)} .ing.new{box-shadow:inset 0 -3px 0 var(--lc),0 0 0 2px var(--star)}
.xcode{width:100%;font:12px/1.35 ui-monospace,monospace;border-radius:10px;border:2px solid var(--line);padding:8px;background:var(--cell);color:var(--ink);resize:none;word-break:break-all}
.card h3{margin:4px 0 0;font-size:14px}
.hgrid button{background:var(--panel);border-radius:14px;padding:10px 4px;font-weight:800;font-size:12.5px;position:relative}
.hgrid span{display:block;font-size:22px}
.dot{position:absolute;top:6px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
/* mapa */
.map{background:var(--panel);border-radius:20px;padding:8px}
.map svg{display:block;width:100%;height:auto;max-height:50vh}
.uf{stroke:var(--panel);stroke-width:1.6;stroke-linejoin:round}
.r0{fill:var(--r0)} .r1{fill:var(--r1)} .r2{fill:var(--r2)} .r3{fill:var(--r3)} .r4{fill:var(--r4)}
.uflab{font:800 13px var(--text);fill:var(--ink);opacity:.45;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.uflab.s{font-size:9px}
.route{fill:none;stroke:var(--ink);opacity:.3;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
.node{cursor:pointer}
.node circle{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.node text{text-anchor:middle;dominant-baseline:central;font-size:20px}
.node.open circle{stroke:var(--star);stroke-width:4}
.node.lock{opacity:.55}
.node .ring{fill:none;stroke:var(--star);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);padding:6px 0 2px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* fase */
.turns{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:4px 12px;text-align:center;line-height:1;flex:0 0 auto}
.turns b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.turns small{font-size:11px;font-weight:800}
.turns.low{background:var(--warn)}
.win{background:var(--panel);border:2.5px solid var(--star);border-radius:16px;padding:5px 8px 7px;display:flex;flex-direction:column;gap:5px}
.win h3{margin:0;font:800 11.5px var(--text);letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
.goals{display:flex;gap:6px;flex-wrap:wrap}
.goal{flex:1 1 0;min-width:130px;background:var(--bg);border-radius:12px;padding:5px 8px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.goal.ok{opacity:.6}
.goal .e{font-size:24px;line-height:1}
.goal div{flex:1;min-width:0}
.goal .bar{height:7px;margin-top:3px}
.goal .bar i{background:var(--star)}
.goal .cnt{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.olab{font-size:12px;color:var(--muted);margin-bottom:-3px}
.olab.key{color:var(--gold);font-weight:800}
.orders.extra .order[data-order]{opacity:.8;border-style:dotted}
.orders.key .order[data-order]{border-color:var(--star)}
.cell.key{animation:key 1.3s ease-in-out infinite}
@keyframes key{50%{box-shadow:0 0 0 3px var(--star)}}
.basket{position:relative}
.basket .tgt{position:absolute;top:-7px;right:-3px;font-style:normal;font-size:14px}
.tag{display:inline-block;background:var(--star);color:#3A2A00;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:800}
.thumb{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:28px;line-height:1;position:relative}
.thumb b{position:absolute;right:-5px;bottom:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:800 12px var(--text);display:grid;place-items:center}
button.pill{cursor:pointer}
.sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sub .tide{color:var(--water);font-weight:800}
.orders{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.order{min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.order.ready{border-color:var(--accent);background:var(--cell)}
.order.want{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.order .who{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.need{display:flex;gap:9px;font-size:24px;line-height:1.1}
.need span{position:relative}
.need sub{position:absolute;right:-7px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:99px;background:var(--lc,var(--lvl));color:#fff;font:800 11px/17px var(--text);text-align:center;box-shadow:0 0 0 1.5px var(--panel)}
.need .ok{opacity:.3}
.order.seal{border-style:dashed}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.cell{width:var(--cs);height:var(--cs);border-radius:22%;background:var(--hole);position:relative;display:grid;place-items:center;overflow:hidden}
.cell.has{background:var(--cell);box-shadow:0 3px 0 var(--lc,var(--line))}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px;overflow:visible}
.cell.drag{opacity:.3}
.cell.trail{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.08);overflow:visible}
.cell.hint{animation:hint .9s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.1)}}
.cell .em{font-size:calc(var(--cs)*.54);line-height:1}
.cell .lv{position:absolute;right:4%;bottom:4%;min-width:calc(var(--cs)*.34);height:calc(var(--cs)*.34);border-radius:99px;background:var(--lc,var(--lvl));color:#fff;font-size:calc(var(--cs)*.22);font-weight:800;display:grid;place-items:center}
.cell.crate{background:repeating-linear-gradient(90deg,var(--crate) 0 22%,var(--crate2) 22% 26%);box-shadow:inset 0 0 0 3px var(--crate2)}
.cell.mold{background:radial-gradient(circle at 30% 30%,var(--mold) 0 18%,transparent 19%),radial-gradient(circle at 70% 60%,var(--mold) 0 22%,transparent 23%),radial-gradient(circle at 35% 75%,var(--mold) 0 14%,transparent 15%),var(--hole)}
.cell.moldy{background:color-mix(in srgb,var(--mold) 35%,var(--cell))}
.cell.moldy::after{content:"🦠";position:absolute;left:4%;top:2%;font-size:calc(var(--cs)*.26)}
.cell.moldy .em{filter:grayscale(.7) opacity(.7)}
.cell.flood::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--water) 55%,transparent);z-index:1;pointer-events:none}
.cell.flood::after{content:"🌊";position:absolute;left:4%;top:2%;font-size:calc(var(--cs)*.26);z-index:2}
.cell.armed{cursor:crosshair}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ghost{position:fixed;z-index:15;pointer-events:none;font-size:40px;line-height:1;transform:translate(-50%,-70%)}
.info{min-height:42px;background:var(--panel);border-radius:14px;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.info p{margin:0;flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.info.armed{box-shadow:inset 0 0 0 2px var(--gold)}
.dock{display:flex;gap:5px}
.basket{flex:1 1 0;min-width:0;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--lc,var(--line));border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.basket:active{transform:translateY(2px)}
.basket .em{font-size:22px;line-height:1.15}
.basket b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.basket small{font-size:10px;color:var(--muted)}
.basket.tool{flex:.8 1 0}
.basket.tool.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
@media (prefers-reduced-motion: reduce){.cell.pop,.cell.hint,.cell.key,.node .ring{animation:none!important}}
/* folhas, cartões, diário */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet>div{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.over{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border-radius:20px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90vh;overflow:auto}
.card p{margin:0}
.card .big{font-size:48px;line-height:1}
.card .bigstars{font-size:40px;letter-spacing:6px}
.card .bigstars span{display:inline-block;animation:starin .4s cubic-bezier(.3,1.6,.5,1) both}
.card .bigstars span:nth-child(2){animation-delay:.25s} .card .bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.card ul{margin:0;padding-left:18px;text-align:left}
.card .btn{white-space:normal}
.card .more{text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.card .place{color:var(--muted);font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dcard{background:var(--panel);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:120px;justify-content:center}
.dcard .em{font-size:40px;line-height:1}
.dcard small{color:var(--muted);font-size:12px}
.dcard.lock .em{filter:brightness(0) opacity(.25)}
.chk{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);border-radius:12px;padding:10px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
table.met{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums;font-size:13px}
.met th,.met td{padding:7px 6px;text-align:right}
.met th:first-child,.met td:first-child{text-align:left}
.met thead{color:var(--muted)}
.met tr+tr td{border-top:1px solid var(--line)}
.met .alert{color:var(--warn);font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-weight:800;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.fxe{position:fixed;left:0;top:0;z-index:17;pointer-events:none;transform:translate(-50%,-50%);line-height:1;will-change:transform,opacity}
.fxe.chip{width:8px;height:8px;border-radius:2px}
.fxe.bub{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px #7FB9E6}
.fxe.ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--gold)}
.fxe.txt{font:800 22px var(--display);color:var(--gold);text-shadow:0 2px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);white-space:nowrap}
.warn{color:var(--warn)}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{background:var(--panel);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.logo .say{font-family:var(--text);font-weight:600;font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.3}
.info i{color:var(--muted);font-size:12px}
.intro{position:fixed;inset:0;z-index:40;background:var(--introbg);display:grid;place-items:center;cursor:pointer;transition:opacity .5s}
.headc{stroke:var(--introedge);stroke-width:2}
.intro.out{opacity:0;pointer-events:none}
.introin{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.introin svg{width:min(70vw,300px);height:auto;overflow:visible}
.intro g{transform-origin:0 0}
.bdx{animation:bdx 1.9s cubic-bezier(.25,.55,.3,1) both}
.bdy{animation:bdy 1.9s cubic-bezier(.45,0,.25,1) both}
.btilt{animation:btilt 1.9s ease-in-out both}
@keyframes bdx{from{transform:translateX(-150px)}}
@keyframes bdy{from{transform:translateY(-120px);opacity:0}15%{opacity:1}}

const b64u={ enc:u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },

async function saveCode(){ save(); const u=new TextEncoder().encode(JSON.stringify(S)); let v='RF0', d=u;
  if(window.CompressionStream){ try{ d=await pipe(u,new CompressionStream('deflate-raw')); v='RF1'; }catch(e){ d=u; v='RF0'; } }
  const body=b64u.enc(d); return `${v}-${body}-${soma(body)}`; }
async function readCode(txt){ const m=String(txt).replace(/\s+/g,'').match(/^(RF[01])-([A-Za-z0-9_-]+)-([a-z0-9]{1,4})$/); if(!m||soma(m[2])!==m[3]) throw 0;
  let u=b64u.dec(m[2]); if(m[1]==='RF1') u=await pipe(u,new DecompressionStream('deflate-raw'));
  const d=JSON.parse(new TextDecoder().decode(u)); if(!d||d.v!==1||!d.tools) throw 0; return d; }

function newOrder(){

  for(let j=0;j<k;j++) o.items.push({l:pick(c.lines),n:rint(c.lv[0],c.lv[1]),done:false});

}
function startPhase(i){
  const c=PHASES[i], b=Array(COLS*ROWS).fill(null), free=()=>{ const e=[]; b.forEach((x,k)=>{ if(!x) e.push(k); }); return e; };
  for(let k=0;k<c.crate;k++) b[pick(free())]={o:'crate'};
  for(let k=0;k<c.mold;k++){ const e=free().filter(x=>x<COLS*(ROWS-1)); b[pick(e)]={o:'mold'}; }
  for(let k=0;k<c.items;k++) b[pick(free())]={l:pick(c.lines),n:Math.random()<.65?1:2};
  const seal=S.selos.includes(0)&&S.sealOn;
  P={i,cfg:c,board:b,turns:c.turns+(seal?3:0),seal,used:0,goals:c.goals.map(g=>({...g,p:0})),orders:[],nextId:1,tide:0,toolsUsed:0,cont:0,earned:0,armed:null,over:null};
  while(P.orders.length<3) P.orders.push(newOrder());
  phStat(i).tries++; save(); sel=null; screen='game';
  if(!quiet&&c.tut&&!S.seen[c.tut]){ S.seen[c.tut]=1; const T=TUT[c.tut]; render(); modal(`<div class="big">${T[0]}</div><h2>${tx(T[1])}</h2><p>${tx(T[2])}</p><button class="btn" data-act="mclose">${tr('Entendi','Got it')}</button>`); return; }

}
const flooded=i=>P.tide>0&&i>=COLS*(ROWS-1);
const isItem=x=>x&&x.l;
const free=i=>!P.board[i]&&!flooded(i);
const canMerge=(a,b)=>isItem(a)&&isItem(b)&&a!==b&&a.l===b.l&&a.n===b.n&&a.n<MAX&&!a.m&&!b.m;
const goalDone=g=>g.p>=g.n;
function progress(t,extra){ for(const g of P.goals) if(g.t===t&&(!extra||extra(g))) g.p++; }
function merge(from,to,via){
  if(P.over||from===to||flooded(from)||flooded(to)) return false;
  const a=P.board[from], b=P.board[to]; if(!canMerge(a,b)) return false;
  let n=a.n+1;
  if(via!=null&&via>=0&&via!==from&&via!==to&&a.n+2<=MAX&&isAdj(via,to)&&!flooded(via)&&canMerge(a,P.board[via])){ P.board[via]=null; n=a.n+2; }
  P.board[from]=null; P.board[to]={l:a.l,n};
  for(const k of nbrs(to)){ const x=P.board[k]; if(!x) continue;
    if(x.o){ P.board[k]=null; progress('clear'); beep(330); }
    else if(x.m){ x.m=false; } }
  progress('make',g=>g.l===a.l&&n>=g.lv);
  popAt=to; beep(n-a.n>1?780:620); checkEnd(); return true;
}
function spawn(l){
  if(P.over) return; const e=[]; P.board.forEach((x,i)=>{ if(free(i)) e.push(i); });
  if(!e.length){ toast(tr('Sem espaço: junte, entregue ou use uma ferramenta.','No space: merge, deliver or use a tool.')); return; }
  P.used++; const i=pick(e); P.board[i]={l,n:1}; popAt=i; beep(520);
  if(P.used%MOLD_EVERY===0){ const c=[]; P.board.forEach((x,k)=>{ if(x&&x.o==='mold') for(const j of nbrs(k)){ const y=P.board[j]; if(isItem(y)&&!y.m&&!c.includes(j)) c.push(j); } });
    if(c.length){ P.board[pick(c)].m=true; toast(tr('Um item ficou mofado 🦠','An item got moldy 🦠')); } }
  if(P.cfg.boss==='tide'){ if(P.tide>0) P.tide--; else if(P.used%TIDE_EVERY===0){ P.tide=TIDE_LEN; toast(tr('A maré subiu! 🌊','The tide is in! 🌊')); } }
  sel=null; checkEnd();
}
const matches=(o,it)=>o.items.find(x=>!x.done&&x.l===it.l&&x.n===it.n);
function deliver(i,id){
  if(P.over) return; const it=P.board[i]; if(!isItem(it)) return;
  if(flooded(i)){ toast(tr('A maré está prendendo esse item.','The tide is holding that item.')); return; }
  if(it.m){ toast(tr('Ninguém compra item mofado. Faça uma fusão ao lado para limpar.','Nobody buys moldy items. Merge next to it to clean it.')); return; }
  const o=id!=null?P.orders.find(x=>x.id===id):P.orders.find(x=>matches(x,it)), nd=o&&matches(o,it);
  if(!nd){ toast(tr('Esse cliente não pediu esse item.','This customer didn’t order that.')); return; }
  nd.done=true; P.board[i]=null; sel=null; beep(700);
  if(o.items.every(x=>x.done)){ progress('orders'); const co=o.items.reduce((a,x)=>a+ORDER_COIN*x.n,0); S.coins+=co; P.earned+=co; P.orders[P.orders.indexOf(o)]=newOrder(); beep(940,.1); toast(`${o.face} ${o.who}: +${co} 🪙`); }
  checkEnd();
}
function deliverSeal(i){

}

function useTool(k,i){
  const x=P.board[i]; if(P.over||!x) return false;
  if(P.toolsUsed>=MAX_TOOLS||!(S.tools[k]>0)){ toast(tr('Sem ferramentas disponíveis nesta fase.','No tools left for this level.')); P.armed=null; return false; }
  if(k==='turns') return false;
  if(k==='hammer'){ if(x.o) progress('clear'); P.board[i]=null; }
  else { if(!isItem(x)||x.n>4||flooded(i)){ toast(tr('O Caldeirão funciona em itens até o nível 4.','The Cauldron works on items up to level 4.')); return false; } x.n++; progress('make',g=>g.l===x.l&&x.n>=g.lv); popAt=i; }
  S.tools[k]--; P.toolsUsed++; P.armed=null; beep(700); checkEnd(); return true;
}
function hasMove(){
  const b=P.board; if(b.some((x,i)=>free(i))) return true;
  for(let i=0;i<b.length;i++){ const x=b[i]; if(!isItem(x)||flooded(i)) continue;
    if(!x.m&&P.orders.some(o=>matches(o,x))) return true;
    if(x.n===MAX&&!x.m) return true;
    for(let j=i+1;j<b.length;j++) if(!flooded(j)&&canMerge(x,b[j])) return true; }
  return P.toolsUsed<MAX_TOOLS&&(S.tools.hammer>0||S.tools.pot>0)&&P.board.some(x=>x);
}
function checkEnd(){
  if(P.over) return;

}

   ${seal?`<p><b>${tr('🏅 Selo de Domínio conquistado: Força do Açaí!','🏅 Mastery Seal earned: Açaí Power!')}</b><br>${tr('+3 turnos em toda fase. Ele fica na sua Mochila de Selos.','+3 turns on every level. It goes into your Seal Bag.')}</p>`:''}
   ${i<PHASES.length-1?`<button class="btn" data-act="phase:${i+1}">${tr('Próxima fase','Next level')}</button>`:''}<button class="btn ghosty" data-act="go:market">${tr('Voltar ao mercado','Back to the market')}</button>

/* ===================== ANIMAÇÕES DAS FERRAMENTAS ===================== */
// Camada de efeitos por cima do jogo (Web Animations API). Com "reduzir movimento" ligado, os efeitos são pulados.
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=(x,y,s,r)=>`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})${r!=null?` rotate(${r}deg)`:''}`;
const ctr=r=>[r.left+r.width/2,r.top+r.height/2];
const cellEl=i=>$('board')&&$('board').querySelector(`[data-cell="${i}"]`);
function fxEl(html,x,y,cls,size){ const d=document.createElement('div'); d.className='fxe'+(cls?' '+cls:''); d.innerHTML=html; d.style.left=x+'px'; d.style.top=y+'px'; if(size) d.style.fontSize=size+'px'; document.body.appendChild(d); return d; }
function anim(el,kf,dur,ease,delay){ const a=el.animate(kf,{duration:dur,easing:ease||'ease-out',delay:delay||0,fill:'both'}); a.onfinish=()=>el.remove(); return a; }
function bump(el,kf,dur,delay){ if(el) el.animate(kf,{duration:dur,delay:delay||0,easing:'ease-out'}); }
function floatTxt(t,x,y,delay){ anim(fxEl(t,x,y,'txt'),[{transform:T(0,0,.6),opacity:0},{transform:T(0,-12,1.15),opacity:1,offset:.25},{transform:T(0,-56,1),opacity:0}],1000,'ease-out',delay); }
function shake(el,amp){ bump(el,[0,1,2,3,4,5].map(k=>({transform:`translate(${k===5?0:(k%2?-1:1)*(amp||4)*(1-k/5)}px,0)`})),300); }
// Martelo: desce sobre a casa, o item estala e se desfaz em lascas.
function fxHammer(r,em,color){
  if(RM()) return; const [cx,cy]=ctr(r), s=r.width;
  if(em) anim(fxEl(em,cx,cy,'',s*.54),[{transform:T(0,0,1)},{transform:T(0,0,1),offset:.42},{transform:T(0,0,1.18),opacity:1,offset:.48},{transform:T(0,0,.2),opacity:0}],650);
  const h=fxEl('🔨',cx+s*.5,cy-s*.6,'',s*.85); h.style.transformOrigin='75% 75%';
  anim(h,[{transform:T(s*.2,-s*.2,.6,-40),opacity:0},{transform:T(0,0,1,-75),opacity:1,offset:.3},{transform:T(-s*.3,s*.3,1,20),offset:.48},{transform:T(-s*.24,s*.22,1,5),opacity:1,offset:.62},{transform:T(-s*.1,0,.9,-35),opacity:0}],720,'cubic-bezier(.5,0,.3,1)');
  setTimeout(()=>{ shake($('board'),5); beep(180);
    anim(fxEl('💥',cx,cy,'',s*.7),[{transform:T(0,0,.3),opacity:1},{transform:T(0,0,1.3),opacity:.9,offset:.4},{transform:T(0,0,1.6),opacity:0}],420);
    for(let k=0;k<12;k++){ const a=Math.random()*Math.PI*2, d=s*(.55+Math.random()*.8), p=fxEl('',cx,cy,'chip'); p.style.background=k%3?color:'#fff';
      anim(p,[{transform:T(0,0,1,0)},{transform:T(Math.cos(a)*d,Math.sin(a)*d*.7+s*.5,.5,rint(-200,200)),opacity:0}],650,'cubic-bezier(.2,.6,.4,1)'); } },340);
}
// Caldeirão: sobe por baixo da casa, borbulha, e o item sai brilhando um nível acima.
function fxPot(i){
  const c=cellEl(i); if(!c||RM()) return; const r=c.getBoundingClientRect(), [cx,cy]=ctr(r), s=r.width;
  anim(fxEl('🫕',cx,cy+s*.55,'',s*.75),[{transform:T(0,s*.4,.3),opacity:0},{transform:T(0,0,1.05),opacity:1,offset:.22},{transform:T(0,0,1),opacity:1,offset:.7},{transform:T(0,s*.3,.6),opacity:0}],1150);
  for(let k=0;k<8;k++) anim(fxEl('',cx+rint(-s*.25,s*.25),cy+s*.35,'bub'),[{transform:T(0,0,.4),opacity:0},{transform:T(0,-s*.2,1),opacity:1,offset:.3},{transform:T(rint(-8,8),-s*.85,1.2),opacity:0}],700,'ease-out',180+k*70);
  bump(c,[{transform:'scale(1)',filter:'none'},{transform:'scale(.7)',offset:.35},{transform:'scale(1.28)',filter:'brightness(1.5) drop-shadow(0 0 10px #F7C51E)',offset:.62},{transform:'scale(1)',filter:'none'}],950,250);
  setTimeout(()=>{ beep(990); anim(fxEl('✨',cx+s*.3,cy-s*.3,'',s*.45),[{transform:T(0,0,.3,0),opacity:0},{transform:T(0,0,1.2,40),opacity:1,offset:.4},{transform:T(6,-10,.8,90),opacity:0}],700); floatTxt('+1',cx,cy-s*.35); },780);
}
// +3 Turnos: a ampulheta gira e voa até o contador, que pulsa.
function fxTurns(r){
  const tc=document.querySelector('.turns'); if(!tc||RM()) return; const [x0,y0]=r?ctr(r):[innerWidth/2,innerHeight/2], [x1,y1]=ctr(tc.getBoundingClientRect());
  anim(fxEl('⏳',x0,y0,'',42),[{transform:T(0,0,.6,0),opacity:0},{transform:T(0,-40,1.3,180),opacity:1,offset:.3},{transform:T((x1-x0)*.6,(y1-y0)*.6-60,1.1,360),offset:.65},{transform:T(x1-x0,y1-y0,.4,540),opacity:.2}],900,'ease-in-out');
  setTimeout(()=>{ bump(tc,[{transform:'scale(1)'},{transform:'scale(1.35)',filter:'brightness(1.4)',offset:.4},{transform:'scale(1)'}],500); floatTxt('+3',x1,y1+34); },860);
}

document.addEventListener('pointerdown',e=>{ lastAct=Date.now(); const c=e.target.closest('#board [data-cell]'); if(!c||!P||P.over||P.armed) return; const i=+c.dataset.cell;
  if(!isItem(P.board[i])||flooded(i)) return; drag={i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,g:null,cur:-1,prev:-1}; });
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){ drag.on=true; const it=P.board[drag.i]; drag.g=document.createElement('div'); drag.g.className='ghost'; drag.g.innerHTML=item(it.l,it.n)[0]; document.body.appendChild(drag.g);
    const c=$('board').querySelector(`[data-cell="${drag.i}"]`); if(c)c.classList.add('drag'); }
  if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px';
    // Guarda o último item igual por onde o dedo passou; ele só entra na fusão (tripla) se for vizinho do destino.
    const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('#board [data-cell]'), k=c?+c.dataset.cell:-1;
    if(k>=0&&k!==drag.cur){ const it=P.board[drag.i], same=j=>j>=0&&j!==drag.i&&!flooded(j)&&canMerge(it,P.board[j]);
      drag.prev=same(k)&&same(drag.cur)?drag.cur:same(k)&&same(drag.prev)&&isAdj(k,drag.prev)?drag.prev:-1; drag.cur=k;
      $('board').querySelectorAll('.trail').forEach(x=>x.classList.remove('trail'));
      if(drag.prev>=0&&it.n+2<=MAX&&isAdj(k,drag.prev)) [k,drag.prev].forEach(j=>$('board').querySelector(`[data-cell="${j}"]`).classList.add('trail')); } }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; if(!d.on) return;
  d.g.remove(); noClick=true; setTimeout(()=>noClick=false,60); lastAct=Date.now();
  const el=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest('#board [data-cell]'), o=el&&el.closest('[data-order]'), sl=el&&el.closest('[data-seal]');
  if(c){ const to=+c.dataset.cell; if(free(to)){ P.board[to]=P.board[d.i]; P.board[d.i]=null; } else merge(d.i,to,d.prev); }
  else if(o) deliver(d.i,+o.dataset.order); else if(sl) deliverSeal(d.i);
  sel=null; render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));

let cantoBuf=null, cantoP=null;
function loadCanto(){ if(cantoP||!audio) return cantoP; try{ const s=atob(CANTO), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
  cantoP=new Promise((ok,no)=>audio.decodeAudioData(u.buffer,ok,no)).then(b=>(cantoBuf=b)).catch(()=>null); }catch(e){ cantoP=Promise.resolve(null); } return cantoP; }
function birdCall(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const toca=b=>{ if(!b) return birdSynth(); const s=audio.createBufferSource(), g=audio.createGain(); g.gain.value=.6; s.buffer=b; s.connect(g); g.connect(audio.destination); s.start(audio.currentTime+.01); };
  if(cantoBuf) toca(cantoBuf); else { const p=loadCanto(); if(p) p.then(toca); else birdSynth(); }
}
function birdSynth(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const c=audio, t0=c.currentTime+.04;
    const out=c.createGain(); out.gain.value=.3; out.connect(c.destination);
    CALL.forEach(([at,d,fr],n)=>{ const g=c.createGain(), t=t0+at; g.connect(out);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.035); g.gain.setValueAtTime(1,t+d*.6); g.gain.exponentialRampToValueAtTime(.001,t+d);
      [[1,.8],[2,.16],[3,.05]].forEach(([h,v])=>{ const o=c.createOscillator(), og=c.createGain(); o.type='sine'; og.gain.value=v;
        o.frequency.setValueCurveAtTime(new Float32Array(fr.map(f=>f*h)),t,d);
        if(n===2){ const lf=c.createOscillator(), lg=c.createGain(); lf.frequency.value=26; lg.gain.value=22*h; lf.connect(lg); lg.connect(o.frequency); lf.start(t); lf.stop(t+d); }
        o.connect(og); og.connect(g); o.start(t); o.stop(t+d+.02); }); });
  }catch(e){}
}
function sing(){
  if(!introState) return; const sp=[...$('wm').querySelectorAll('span')], bill=$('bill');
  CALL.forEach(([at,d],i)=>{ introState.tms.push(setTimeout(()=>{ sp[i].classList.add('on'); bill.classList.add('open'); },at*1000), setTimeout(()=>bill.classList.remove('open'),(at+d*.8)*1000)); });
  introState.tms.push(setTimeout(()=>{ $('wm').classList.add('done'); $('wsub').classList.add('on'); },1750), setTimeout(endIntro,3300));
  if(!S.opts.sound) return;
  if(audio&&audio.state==='running') birdCall();
  else { const late=()=>{ if(introState){ try{ audio.resume().then(birdCall); }catch(e){} } }; window.addEventListener('pointerdown',late,{once:true,capture:true}); }   // navegador bloqueou o som: canta no primeiro toque
}
function endIntro(){
  if(!introState) return; introState.tms.forEach(clearTimeout); introState=null;
  $('intro').classList.add('out'); setTimeout(()=>{ $('intro').hidden=true; },520);
}
function intro(){
  $('intro').hidden=false; introState={t0:Date.now(),tms:[]};
  if(S.opts.sound){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); loadCanto(); }catch(e){} }
  introState.tms.push(setTimeout(sing,matchMedia('(prefers-reduced-motion: reduce)').matches?300:2050));   // pousou, cantou
}
function introTap(){ endIntro(); }

function start(){
  LANG=detectLang(); S=load(); S.alb=S.alb||{}; S.albDone=S.albDone||[]; S.opts=S.opts||{sound:true,test:false}; S.iap=S.iap||{n:0,usd:0,once:[]}; S.tools.turns=S.tools.turns||0;
  let ql=null; try{ ql=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(ql==='en'||ql==='pt') S.opts.lang=ql; LANG=S.opts.lang||LANG; S.opts.lang=LANG; applyLang(); render();
  let q=null; try{ q=new URLSearchParams(location.search).get('intro'); }catch(e){} if(q!=='0') intro();
}
start();
