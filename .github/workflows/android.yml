# Compila o app Android (APK de teste, com anúncios de teste do AdMob) e o deixa para download na aba Actions.
name: App Android (APK de teste)

on:
  push:
    paths:
      - 'versao-b-quitanda-zen/**'
      - 'app-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm ci
      - name: Copiar o jogo para o app
        run: npm run sync
      - name: Compilar o APK
        working-directory: app-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: quitanda-apk-teste
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
