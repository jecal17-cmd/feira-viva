# Compila os apps Android de teste e os deixa para download na aba Actions:
# - Versão B (Quitanda), com anúncios de teste do AdMob
# - Versão A (Rota das Feiras), sem monetização
name: Apps Android (APKs de teste)

on:
  push:
    paths:
      - 'versao-a-rota-das-feiras/**'
      - 'versao-b-quitanda-zen/**'
      - 'app-android/**'
      - 'app-android-rota/**'
      - 'chave-teste/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: app-android
            artifact: quitanda-apk-teste
          - dir: app-android-rota
            artifact: rota-das-feiras-apk-teste
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        # npm ci exige a lista travada (package-lock.json) em dia; se um plugin novo ainda não estiver nela, instala normalmente
        run: npm ci || npm install --no-audit --no-fund
      - name: Copiar o jogo para o app
        run: npm run sync
      - name: Compilar o APK
        working-directory: ${{ matrix.dir }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Conferir a chave fixa de teste
        # Todo APK de teste precisa sair com a mesma chave (chave-teste/); assim o celular aceita atualizar por cima
        run: |
          saida=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$saida" | grep -q "BF:0A:A4:C4:77:9C:DA:A0:60:6C:87:5B:5C:83:10:80:D4:DC:93:5C:81:B2:5D:27:63:74:3F:30:04:F0:88:BB" \
            || { echo "$saida"; echo "::error::O APK não saiu com a chave fixa de teste."; exit 1; }
          echo "Chave fixa de teste conferida"
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
