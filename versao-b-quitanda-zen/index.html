<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quitanda Zen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Telas: inicial (home), jogo (app), folhas (mapa, turma, missões, receitas, melhorias, ajustes) e cartões modais. */
:root{
  --introbg:#FFF6D9; --introedge:transparent;
  --r0:#9FD5B4; --r1:#F4C98E; --r2:#E6DA86; --r3:#A9C8EC; --r4:#C9B5E6;
  --bg:#DCEFE4; --panel:#F6FBF8; --cell:#FFFFFF; --hole:#C6E2D3; --ink:#1D4A3F; --muted:#557A6E;
  --accent:#2A8F63; --on-accent:#FFFFFF; --gold:#B87A00; --line:#B5D6C5; --scrim:rgba(16,40,33,.82); --warn:#B4472E;
  --sun:#F2B33D; --land:#BFE3CF; --stripe:#E4573D;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350 } }
:root[data-theme="dark"]{
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350 }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-weight:600;font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px}
.icon{background:var(--panel);border-radius:12px;width:38px;height:38px;font-size:18px;flex:0 0 auto}
.lvl{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 10px;white-space:nowrap}
.xp{flex:1;min-width:0}
.xp small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:5px;background:var(--hole);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.coins{font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--panel);border-radius:12px;padding:6px 8px}
.coins b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 14px/1 var(--text);margin-left:4px;vertical-align:1px}
.orders{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:4px}
.order{min-width:0;background:var(--cell);border:2.5px solid var(--line);border-radius:16px;padding:5px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;box-shadow:0 3px 0 var(--line);position:relative}
.order.ready{border-color:var(--accent);box-shadow:0 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--cell))}
.order.ready::after{content:"✓";position:absolute;top:-8px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 12px/20px var(--text);text-align:center}
.order.rush{border-color:var(--warn)}
.order.want,.order.osel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.order .who{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:3px;line-height:1.2}
.order .rtag{position:absolute;top:-8px;left:-5px;width:20px;height:20px;border-radius:50%;background:var(--gold);font-size:11px;line-height:20px;text-align:center;box-shadow:0 1px 0 var(--line)}
.order .pay{font:800 11px/1 var(--text);color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:99px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.order .pay.x2{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.order .who i{font-style:normal;font-size:17px;line-height:1}
.order.rush .who{color:var(--warn)}
.need{display:flex;gap:9px;font-size:26px;line-height:1.1}
.need span{position:relative}
.need sub{position:absolute;right:-7px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:99px;background:var(--lc,var(--accent));color:#fff;font:800 11px/17px var(--text);text-align:center;box-shadow:0 0 0 1.5px var(--cell)}
.need .ok{opacity:.3}
.striprow{display:flex;gap:6px}
.striprow .strip{flex:1;min-width:0}
.encb{flex:0 0 auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:3px 8px;font-size:12px;white-space:nowrap;font-weight:800}
.encb small{color:var(--muted);font-weight:600}
.encb.want{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.strip{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:5px 10px;font-size:12px;text-align:left;min-height:28px}
.strip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .bar{flex:1;min-width:40px;height:8px}
.strip.go{background:var(--sun);color:#3A2A00;font-weight:800;justify-content:center;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.coach{box-shadow:inset 0 0 0 2px var(--sun)}
.coach .zs{font-size:24px;line-height:1}
.tutglow{animation:tutglow 1s ease-in-out infinite;position:relative;z-index:1}
@keyframes tutglow{50%{box-shadow:0 0 0 4px var(--sun);transform:scale(1.05)}}
.encb.chama{animation:tutglow 1s ease-in-out infinite;border-color:var(--sun)}
.pulahint{margin-top:18px;font-size:12px;color:var(--muted);opacity:.8}
.ver{color:var(--muted);font-size:12px;text-align:center;padding:8px;width:100%}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:22%;background:var(--hole);position:relative;display:grid;place-items:center}
.cell.has{background:var(--cell);box-shadow:0 3px 0 var(--lc,var(--line))}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.drag{opacity:.3}
.cell.trail{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.08)}
.cell.hint{animation:hint .9s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.1);outline:2px solid var(--gold)}}
.cell .em{font-size:calc(var(--cs)*.54);line-height:1}
.cell .lv{position:absolute;right:4%;bottom:4%;min-width:calc(var(--cs)*.34);height:calc(var(--cs)*.34);border-radius:99px;background:var(--lc,var(--accent));color:#fff;font-size:calc(var(--cs)*.22);font-weight:800;display:grid;place-items:center}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fx{position:fixed;z-index:16;pointer-events:none;font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);transform:translate(-50%,-50%);animation:fx .9s ease-out forwards;white-space:nowrap}
@keyframes fx{to{transform:translate(-50%,-260%);opacity:0}}
@media (prefers-reduced-motion: reduce){.cell.pop,.cell.hint,.tutglow,.encb.chama,.strip.go,.floaty i,.node .ring{animation:none!important}.fx{animation-duration:.01s}}
.ii{width:1.12em;height:1.12em;object-fit:contain;vertical-align:-.2em;pointer-events:none;-webkit-user-drag:none}
.ghost{position:fixed;z-index:15;pointer-events:none;font-size:40px;line-height:1;transform:translate(-50%,-70%)}
.info{min-height:42px;background:var(--panel);border-radius:14px;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.info p{margin:0;flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.btn{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:99px;padding:8px 14px;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn.ghosty{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.baskets{display:flex;gap:4px}
.basket{flex:1 1 0;min-width:0;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--lc,var(--line));border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.basket:active{transform:translateY(2px)}
.basket .em{font-size:21px;line-height:1.1}
.basket b{font-family:var(--display);font-size:14px;line-height:1.1;font-variant-numeric:tabular-nums}
.basket small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.basket.ad{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.basket.ad small{color:var(--on-accent)}
.basket.bo{flex:.75 1 0}.basket.bo .em{font-size:20px;line-height:1.32}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.nav button{background:var(--panel);border-radius:12px;padding:6px 2px;font-weight:800;font-size:11px;min-width:0;position:relative;line-height:1.2}
.nav button span{display:block;font-size:17px}
.albl{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;font-size:14px} .albl span{color:var(--muted);font-size:12px;font-weight:800}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ing{background:var(--panel);border-radius:12px;padding:6px 3px 5px;text-align:center;position:relative;box-shadow:inset 0 -3px 0 var(--lc);min-width:0}
.ing .e{display:block;font-size:30px;line-height:1.15;height:36px} .ing .e .ii{vertical-align:0}
.ing small{display:block;font-size:10.5px;line-height:1.2;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing i{position:absolute;top:3px;left:5px;font:800 10px var(--text);font-style:normal;color:var(--muted)}
.ing em{position:absolute;top:-5px;right:-3px;background:var(--sun);color:#3a2a00;font:800 9px var(--text);font-style:normal;border-radius:99px;padding:1px 5px}
/* Pop-up de detalhes (Caderno de Receitas e Turma da Feira): toque num ingrediente, receita ou personagem */
.toque{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}.toque:active{transform:scale(.96)}
.info{display:flex;flex-direction:column;gap:10px;text-align:left}
.ihead{display:flex;align-items:center;gap:12px}.ihead h2{margin:0;font-size:20px;line-height:1.15}.ihead p{color:var(--muted);font-size:13px;margin:2px 0 0}
.ibig{flex:0 0 auto;width:76px;height:76px;border-radius:18px;background:var(--bg);display:grid;place-items:center;font-size:50px;line-height:1;box-shadow:inset 0 -4px 0 var(--lc,var(--line))}
.ibig .ii{vertical-align:0}.ibig .pf{width:68px;height:68px;vertical-align:0}.ibig.duo{font-size:28px;display:flex;justify-content:center;gap:1px}.ibig.duo b{font-size:14px;color:var(--muted)}
.itxt{font-size:15px;line-height:1.45}.info .q{font-style:italic;color:var(--muted)}
.cadeia{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px 2px;font-size:21px;line-height:1.2;background:var(--bg);border-radius:12px;padding:6px 8px}
.cadeia span{opacity:.7}.cadeia span.on{opacity:1;transform:scale(1.3);margin:0 3px}.cadeia span.no{opacity:.4;filter:grayscale(1);font-size:15px}.cadeia i{font-style:normal;color:var(--muted);font-size:11px}
.idet{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0;font-size:13.5px;line-height:1.35}.idet dt{font-weight:800}.idet dd{margin:0;color:var(--muted)}
.idet .pf{width:1.4em;height:1.4em}
@media (prefers-reduced-motion: reduce){.toque{transition:none}}
.ing.no{opacity:.55} .ing.no .e{filter:grayscale(1)} .ing.new{box-shadow:inset 0 -3px 0 var(--lc),0 0 0 2px var(--sun)}
.xcode{width:100%;font:12px/1.35 ui-monospace,monospace;border-radius:10px;border:2px solid var(--line);padding:8px;background:var(--cell);color:var(--ink);resize:none;word-break:break-all}
.card h3{margin:4px 0 0;font-size:14px}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:2px}
.dot{position:absolute;top:4px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.sheet,.over,.home{position:fixed;inset:0}
.home{z-index:18;background:var(--bg);overflow:auto;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex}
.homein{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:8px;align-items:stretch;text-align:center;position:relative}
.logo{font-family:var(--display);font-weight:800;line-height:.9}
.logo b{display:block;font-size:clamp(34px,6.4vh,52px);color:var(--accent);letter-spacing:-1px}
.logo small{display:block;font-family:var(--text);font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.floaty{position:relative;height:0}
.floaty i{position:absolute;font-style:normal;font-size:24px}
.homein{height:100%}
.stall{background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--line);flex:1 1 0;max-height:calc(min(100vw - 32px,420px) * 1.12 + 62px);display:flex;flex-direction:column}
/* Banca da tela inicial: cena quadrada que ocupa o espaço que sobra; caixotes enchem com os itens descobertos */
/* A banca ocupa só a altura que sobra (mín. 170 px); a cena mantém a proporção e encolhe junto, encostada embaixo */
.banca{flex:1 1 0;min-height:170px;max-height:calc(min(100vw - 32px,420px) * 1.12);container-type:size;position:relative;overflow:hidden;background:linear-gradient(#E4F4EB,#CFE8DC 70%)}
/* Banca da tela inicial vista de cima, inclinada: x em % da largura, y em % da altura (ver bancaHtml) */
.cena{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100cqw,100cqh / 1.12);aspect-ratio:1/1.12}
.cena>*{position:absolute}
.cena img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.chao{left:calc(50% - 50cqw);right:calc(50% - 50cqw);bottom:0;height:25%;background:linear-gradient(#0000 0 30%,#D9876533 30% 31%,#0000 31% 62%,#D9876544 62% 63.5%,#0000 63.5%),repeating-linear-gradient(90deg,#ECA98A 0 9.6%,#D98765 9.6% 10%);box-shadow:inset 0 2px 0 #C97758}
.poste{top:9%;bottom:30%;width:3%;background:linear-gradient(90deg,#8A5A33,#C08A55 45%,#8A5A33);box-shadow:inset 0 0 0 1px #6E4524}
.tampo{left:0;right:0;top:31%;height:40%;clip-path:polygon(13% 0,87% 0,97% 100%,3% 100%);
  background:repeating-linear-gradient(#0000 0 15.5%,#5E3A1C22 15.5% 16.5%),linear-gradient(#A26D3B,#D7A56E)}
.borda{left:12.5%;right:12.5%;top:29.6%;height:2.2%;border-radius:2px;background:linear-gradient(#C99460,#8E5E35);box-shadow:inset 0 0 0 1px #6E4524}
.frente{left:2%;right:2%;top:71%;bottom:13%;border-radius:2px;background:repeating-linear-gradient(90deg,#B57E4A 0 7.6%,#94623A 7.6% 8%);box-shadow:inset 0 -5px 0 #0002,inset 0 0 0 1px #6E4524}
.frente::before{content:'';position:absolute;left:-1%;right:-1%;top:-1px;height:16%;border-radius:2px;background:linear-gradient(#DDAA72,#A9743F);box-shadow:inset 0 0 0 1px #6E4524}
.toldo{left:calc(50% - 50cqw - 1px);right:calc(50% - 50cqw - 1px);top:0;height:14%;z-index:30;background:linear-gradient(90deg,#E0503C 50%,#FFF4E2 50%) 0 0/calc(100%/7) 100%;box-shadow:inset 0 -2px 0 #0002}
.toldo::after{content:'';position:absolute;left:0;right:0;top:100%;height:32%;filter:drop-shadow(0 3px 1px #0002);
  background:radial-gradient(25% 100% at 25% 0,#E0503C 96%,#0000 100%) 0 0/calc(100%/7) 100%,radial-gradient(25% 100% at 75% 0,#FFF4E2 96%,#0000 100%) 0 0/calc(100%/7) 100%}  /* listras e franjas no mesmo ladrilho (1/7 da largura): uma franja por listra, sempre alinhadas */
.viga{left:4%;right:4%;top:8%;height:3%;z-index:29;background:linear-gradient(#C99460,#8E5E35);box-shadow:inset 0 0 0 1px #6E4524}
.varal{left:2%;right:2%;display:flex;z-index:28}
.varal img{width:33.4%}
.it{z-index:10}
.it img{filter:drop-shadow(0 2px 1px #3B220F55)}
.vazia{left:18%;right:18%;top:45%;z-index:9;font-size:12px;color:#FFF3E2;text-align:center;font-style:italic;text-shadow:0 1px 1px #0005}
.pf{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.3em;pointer-events:none;-webkit-user-drag:none}
.face .pf,.keeper .pf{width:1.5em;height:1.5em}
.keeper{display:flex;align-items:center;gap:8px;padding:6px 10px 8px;height:62px;flex:none;text-align:left}
.keeper span{font-size:30px;line-height:1}
.keeper p{margin:0;background:var(--bg);border-radius:14px 14px 14px 4px;padding:5px 10px;font-size:12.5px;line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.play{font-family:var(--display);font-weight:800;font-size:24px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:9px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.where{background:var(--panel);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.where small{color:var(--muted)}
.where.art{background:linear-gradient(to top,rgba(20,24,20,.82),rgba(20,24,20,.35) 55%,rgba(20,24,20,0) 85%),var(--art) center 40%/cover,var(--panel);color:#fff;min-height:84px;justify-content:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.where.art small{color:rgba(255,255,255,.88)}
.hnav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.hnav button{background:var(--panel);border-radius:12px;padding:7px 1px;font-weight:800;font-size:10px;position:relative;min-width:0;overflow:hidden;white-space:nowrap}
.hnav span{display:block;font-size:19px}
.gift{background:var(--sun);color:#3A2A00;font-weight:800;border-radius:14px;padding:8px}
.sheet{z-index:20;background:var(--bg);overflow:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));

// Curiosidades dos ingredientes (pop-up do Caderno de Receitas). Chave: linha + nível. [português, inglês]
const INFO={
 fr1:['O limão mais vendido no Brasil é o taiti, verde e sem sementes. É ele que vai na caipirinha e no peixe.','Brazil’s best-selling lime is the seedless green Tahiti lime. It goes into caipirinhas and on fish.'],
 fr2:['O Brasil é o maior produtor de suco de laranja do mundo, e a maior parte vem de São Paulo.','Brazil is the world’s largest producer of orange juice, and most of it comes from São Paulo state.'],
 fr3:['Banana nasce em cachos, e cada “mão” do cacho tem várias pencas. Prata, nanica, maçã e da terra são as mais comuns na feira.','Bananas grow in bunches made of several “hands”. Prata, nanica, maçã and da terra are the most common kinds at the market.'],
 fr4:['A manga chegou da Ásia com os portugueses e se deu tão bem que hoje o Vale do São Francisco exporta manga para o mundo todo.','Mangoes came from Asia with the Portuguese and thrived so well that the São Francisco Valley now ships them all over the world.'],
 fr5:['O abacaxi é nativo da América do Sul. A coroa de folhas pode ser plantada e vira um pé novo.','The pineapple is native to South America. Its leafy crown can be planted to grow a new plant.'],
 fr6:['A parte suculenta do caju não é o fruto: o fruto de verdade é a castanha, que fica pendurada embaixo.','The juicy part of the cashew is not the real fruit: the true fruit is the nut hanging underneath.'],
 fr7:['A jabuticaba nasce grudada no tronco da árvore. É nativa da Mata Atlântica e estraga rápido depois de colhida, por isso é fruta de época.','Jabuticabas grow right on the tree trunk. Native to the Atlantic Forest, they spoil quickly after picking, so they are a seasonal treat.'],
 fr8:['No Pará, o açaí é comido no almoço com peixe frito e farinha. No resto do Brasil virou sobremesa gelada, com banana e granola.','In Pará, açaí is eaten at lunch with fried fish and cassava flour. In the rest of Brazil it became a frozen dessert with banana and granola.'],
 ve1:['Cheiro-verde é o maço de salsinha com cebolinha. Vai em quase toda comida brasileira, do feijão ao peixe.','Cheiro-verde is a bunch of parsley and green onion. It goes into almost every Brazilian dish, from beans to fish.'],
 ve2:['Couve cortada bem fininha e refogada no alho é a companheira certa da feijoada.','Collard greens sliced very thin and sautéed with garlic are the classic partner of feijoada.'],
 ve3:['A cor laranja da cenoura vem do betacaroteno, que o corpo transforma em vitamina A.','The carrot’s orange color comes from beta-carotene, which the body turns into vitamin A.'],
 ve4:['Para a botânica, o tomate é uma fruta. Ele veio dos Andes e hoje é base do molho, da salada e do vinagrete.','Botanically, the tomato is a fruit. It came from the Andes and is now the base of sauces, salads and vinaigrette.'],
 ve5:['Milho é a estrela das festas juninas: vira pamonha, curau, canjica, pipoca e milho cozido na palha.','Corn is the star of the June festivals: it becomes pamonha, curau, canjica, popcorn and corn boiled in the husk.'],
 ve6:['A mandioca é nativa da Amazônia e tem muitos nomes: aipim, macaxeira, maniva. Dela saem farinha, tapioca e tucupi.','Cassava is native to the Amazon and has many names: aipim, macaxeira, maniva. It gives us flour, tapioca and tucupi.'],
 ve7:['No Nordeste, a abóbora se chama jerimum. Com carne-seca, é prato de domingo.','In the Northeast, pumpkin is called jerimum. Cooked with dried beef, it’s a Sunday dish.'],
 ve8:['A salada junta o que a banca tem de mais fresco: folhas, tomate, cenoura e um fio de azeite.','A salad brings together the freshest things on the stall: greens, tomato, carrot and a drizzle of oil.'],
 pe1:['Na Bahia, o camarão também é vendido seco e salgado. Assim ele dura dias e dá sabor ao acarajé e ao vatapá.','In Bahia, shrimp is also sold dried and salted. That way it keeps for days and flavors acarajé and vatapá.'],
 pe2:['A sardinha anda em cardumes enormes e é um dos peixes mais pescados do Sudeste e do Sul. Frita e crocante, é petisco barato e querido.','Sardines swim in huge schools and are among the most fished species in southern Brazil. Fried until crisp, they are a cheap, beloved snack.'],
 pe3:['O Brasil tem um litoral enorme e a maior bacia de rios do mundo, a Amazônica. Peixe de mar e de rio não falta na feira.','Brazil has a huge coastline and the world’s largest river basin, the Amazon. Sea and river fish are never in short supply.'],
 pe4:['O caranguejo-uçá vive no mangue. Em Fortaleza, quinta-feira é dia de comer caranguejo com martelinho.','The uçá crab lives in the mangroves. In Fortaleza, Thursday is crab night, cracked open with a little wooden mallet.'],
 pe5:['Em Santa Catarina, a pesca da tainha vai de maio a julho. Olheiros no alto do morro avisam quando o cardume chega à praia.','In Santa Catarina, mullet season runs from May to July. Lookouts on the hills shout when a school of fish reaches the beach.'],
 pe6:['A lagosta é pescada no litoral do Nordeste, sobretudo no Ceará. Na época de reprodução, a pesca é proibida para proteger a espécie.','Lobster is caught along the Northeast coast, especially in Ceará. Fishing is banned during breeding season to protect the species.'],
 pe7:['O pirarucu é um dos maiores peixes de escama de rio do mundo e pode passar de 2 metros. Ele sobe à superfície para respirar ar.','The pirarucu is one of the largest scaled river fish in the world and can grow longer than 2 meters. It comes up to the surface to breathe air.'],
 pe8:['A moqueca baiana leva dendê e leite de coco. A capixaba, do Espírito Santo, leva urucum e é feita em panela de barro.','Bahian moqueca uses dendê oil and coconut milk. The capixaba version, from Espírito Santo, uses annatto and is cooked in a clay pot.'],
 te1:['Quase todo o sal marinho do Brasil vem do Rio Grande do Norte, onde o sol forte seca a água do mar nas salinas.','Almost all of Brazil’s sea salt comes from Rio Grande do Norte, where the strong sun dries seawater in salt pans.'],
 te2:['Alho e cebola dourando na panela é o cheiro da cozinha brasileira: quase todo refogado começa assim.','Garlic and onion browning in a pan is the smell of Brazilian cooking: almost every dish starts this way.'],
 te3:['A cebola faz chorar porque, ao ser cortada, solta um gás que irrita os olhos.','Onions make you cry because, when cut, they release a gas that stings the eyes.'],
 te4:['A malagueta é pequena e muito ardida. Na Bahia, vai no molho do acarajé e da moqueca.','The malagueta is small and very hot. In Bahia, it goes into the sauce for acarajé and moqueca.'],
 te5:['Em geral, o pimentão verde é o mesmo fruto do vermelho, só que colhido antes de amadurecer.','Usually, a green bell pepper is the same fruit as the red one, just picked before it ripens.'],
 te6:['O dendê vem do fruto de uma palmeira trazida da África. É ele que dá a cor laranja e o sabor da comida baiana.','Dendê oil comes from the fruit of a palm tree brought from Africa. It gives Bahian food its orange color and flavor.'],
 te7:['Além das abelhas comuns, o Brasil tem abelhas sem ferrão, como a jataí, que fazem um mel mais líquido e azedinho.','Besides common honeybees, Brazil has stingless bees, like the jataí, which make a runnier, slightly tangy honey.'],
 te8:['Tomate, cebola e temperos cozidos devagar viram o molho do macarrão de domingo, costume trazido pelos imigrantes italianos.','Tomato, onion and seasoning simmered slowly become the Sunday pasta sauce, a habit brought by Italian immigrants.'],
 be1:['O Brasil guarda uma das maiores reservas de água doce do planeta. Na feira, um copo d’água fresca é o primeiro pedido do dia.','Brazil holds one of the largest freshwater reserves on the planet. At the market, a glass of cool water is the first order of the day.'],
 be2:['A água de coco vem do coco verde, ainda jovem. Na praia, é bebida direto da casca, com canudo.','Coconut water comes from young green coconuts. At the beach, people drink it straight from the shell with a straw.'],
 be3:['Suco natural é feito na hora com a fruta da estação: maracujá, acerola, cajá, goiaba ou caju.','Fresh juice is made to order with the fruit in season: passion fruit, acerola, cajá, guava or cashew fruit.'],
 be4:['O Brasil é o maior produtor e exportador de café do mundo há mais de 150 anos. O cafezinho é oferecido como gesto de boas-vindas.','Brazil has been the world’s largest coffee producer and exporter for more than 150 years. A cafezinho is offered as a gesture of welcome.'],
 be5:['O caldo de cana, ou garapa, é moído na hora na máquina da banca. Com limão e um pastel, é o lanche clássico da feira.','Sugarcane juice, or garapa, is pressed to order at the stall. With a squeeze of lime and a pastel, it’s the classic market snack.'],
 be6:['O chimarrão é erva-mate com água quente, tomado numa cuia com bomba. No Sul, a roda de chimarrão é sinal de amizade.','Chimarrão is yerba mate with hot water, sipped from a gourd through a metal straw. In the South, sharing it in a circle is a sign of friendship.'],
 be7:['O guaraná é um fruto da Amazônia que parece um olhinho. Ele vem de Maués, no Amazonas, e tem bastante cafeína.','Guaraná is an Amazon fruit that looks like a little eye. It comes from Maués, in Amazonas, and is packed with caffeine.'],
 be8:['A cajuína é suco de caju clarificado e cozido até ficar dourado. A produção tradicional do Piauí é patrimônio cultural do Brasil.','Cajuína is cashew-fruit juice clarified and cooked until golden. Its traditional production in Piauí is part of Brazil’s cultural heritage.'],
 ar1:['Com linha, agulha e paciência nascem os bordados e as rendas que enfeitam as bancas de artesanato.','With thread, a needle and patience come the embroidery and lace that decorate the craft stalls.'],
 ar2:['O novelo é a matéria-prima do crochê e do tricô, feitos à mão por artesãs em todo o Brasil.','A ball of yarn is the raw material for crochet and knitting, made by hand by artisans all over Brazil.'],
 ar3:['A Fita do Bonfim vem da igreja do Senhor do Bonfim, em Salvador. Amarra-se no pulso com três nós e três pedidos, e não se corta: espera-se que ela arrebente sozinha.','The Bonfim ribbon comes from the Senhor do Bonfim church in Salvador. You tie it on your wrist with three knots and three wishes, and never cut it: you wait for it to break on its own.'],
 ar4:['A renda de bilro é feita no Ceará e em Florianópolis; a renda renascença, em Pernambuco e na Paraíba. Uma peça grande pode levar meses.','Bobbin lace is made in Ceará and Florianópolis; renascença lace in Pernambuco and Paraíba. A large piece can take months.'],
 ar5:['O chapéu de palha protege do sol na roça e é obrigatório nas festas juninas. No Nordeste, muitos são trançados com palha de carnaúba.','Straw hats shade farmers from the sun and are a must at June festivals. In the Northeast, many are woven from carnaúba palm straw.'],
 ar6:['Os cestos trançados são herança dos povos indígenas. Na Amazônia, usa-se o arumã, uma fibra forte e flexível.','Woven baskets are a legacy of Indigenous peoples. In the Amazon, they use arumã, a strong and flexible reed.'],
 ar7:['Os bonecos de barro de Caruaru, em Pernambuco, retratam a vida do sertão. Ficaram famosos com o Mestre Vitalino.','The clay figurines of Caruaru, in Pernambuco, portray life in the backlands. They became famous thanks to Mestre Vitalino.'],
 ar8:['A viola caipira tem 10 cordas, em 5 pares. É o som da música caipira e das folias de reis do interior.','The viola caipira has 10 strings in 5 pairs. It’s the sound of country music and of the Folia de Reis processions.'],
 gr1:['O amendoim é nativo da América do Sul e não pode faltar na festa junina: vira paçoca, pé de moleque e amendoim cozido.','Peanuts are native to South America and a must at June festivals: they become paçoca, pé de moleque and boiled peanuts.'],
 gr2:['A castanheira pode passar de 50 metros de altura. Cada ouriço que cai do alto guarda de 10 a 25 castanhas.','The Brazil-nut tree can grow taller than 50 meters. Each hard pod that falls from the top holds 10 to 25 nuts.'],
 gr3:['O milho de pipoca estoura porque a água de dentro do grão vira vapor e rompe a casca. O pipoqueiro de carrinho é figura de toda praça.','Popcorn pops because the water inside each kernel turns to steam and bursts the shell. The popcorn cart is a fixture of every town square.'],
 gr4:['Arroz com feijão é a dupla do prato brasileiro: juntos, formam uma refeição completa e barata.','Rice and beans are the pair on every Brazilian plate: together they make a complete, affordable meal.'],
 gr5:['A farinha de mandioca é feita nas casas de farinha. Cada lugar tem a sua: a farinha d’água do Pará, a copioba da Bahia.','Cassava flour is made in “flour houses”. Each region has its own: farinha d’água from Pará, copioba from Bahia.'],
 gr6:['Cada região tem seu feijão: o preto no Rio e no Sul, o carioca no Sudeste, o de corda no Nordeste.','Each region has its bean: black beans in Rio and the South, carioca beans in the Southeast, cowpeas in the Northeast.'],
 gr7:['O cuscuz nordestino é feito com flocos de milho no vapor da cuscuzeira e comido no café da manhã, com manteiga ou ovo.','Northeastern cuscuz is made from corn flakes steamed in a special pot and eaten for breakfast with butter or egg.'],
 gr8:['O baião de dois junta arroz, feijão de corda e queijo coalho na mesma panela. O nome lembra o baião, ritmo de Luiz Gonzaga.','Baião de dois cooks rice, cowpeas and queijo coalho in the same pot. The name recalls baião, the rhythm made famous by Luiz Gonzaga.'],
 do1:['A rapadura é caldo de cana fervido até endurecer em blocos. Durava semanas sem estragar e alimentava os vaqueiros do sertão.','Rapadura is sugarcane juice boiled until it hardens into blocks. It kept for weeks and fed the cowboys of the backlands.'],
 do2:['A paçoca doce é amendoim moído com açúcar e farinha. Esfarela na mão e é doce típico de festa junina.','Sweet paçoca is ground peanuts with sugar and flour. It crumbles in your hand and is a classic June festival sweet.'],
 do3:['O chocolate nasce do cacau. No Brasil, o cacau é plantado principalmente no Pará e no sul da Bahia, na sombra da mata.','Chocolate starts as cacao. In Brazil, cacao grows mostly in Pará and southern Bahia, in the shade of the forest.'],
 do4:['A cocada é coco ralado cozido com açúcar. Tem a branca e a queimada, mais escura, e é vendida no tabuleiro das baianas.','Cocada is grated coconut cooked with sugar. There’s a white version and a darker toasted one, sold on the baianas’ trays.'],
 do5:['O quindim é feito de gema, açúcar e coco. Herdou dos doces de convento portugueses o gosto pelas gemas.','Quindim is made with egg yolks, sugar and coconut. Its love of yolks comes from Portuguese convent sweets.'],
 do6:['O sonho veio de Portugal e virou estrela da padaria brasileira: massa frita, recheio de creme e açúcar por cima.','The sonho came from Portugal and became a star of Brazilian bakeries: fried dough, cream filling and a dusting of sugar.'],
 do7:['A goiabada é goiaba cozida com açúcar no tacho por horas. A goiabada cascão, com pedaços da fruta, é a mais rústica.','Goiabada is guava cooked with sugar in a copper pot for hours. The rustic “cascão” version keeps chunks of fruit.'],
 do8:['O bolo de rolo tem camadas fininhas enroladas com goiabada. É patrimônio cultural de Pernambuco.','Bolo de rolo has paper-thin layers rolled up with guava paste. It’s part of Pernambuco’s cultural heritage.'],
 ca1:['O ovo caipira vem de galinhas criadas soltas no quintal e costuma ter a gema mais alaranjada.','Free-range eggs come from hens that roam the backyard and often have deeper orange yolks.'],
 ca2:['O Brasil é o maior exportador de carne de frango do mundo. Na mesa, o frango assado de domingo é tradição.','Brazil is the world’s largest exporter of chicken. At home, Sunday roast chicken is a tradition.'],
 ca3:['O torresmo é pele de porco frita até estufar e ficar crocante. Em Minas, acompanha feijão, couve e tutu.','Torresmo is pork skin fried until it puffs up and turns crunchy. In Minas, it goes with beans, collard greens and tutu.'],
 ca4:['Cada região tem sua linguiça. A de Maracaju, em Mato Grosso do Sul, é feita com carne bovina picada na faca.','Each region has its own sausage. The one from Maracaju, in Mato Grosso do Sul, is made with knife-chopped beef.'],
 ca5:['Apesar do nome, a carne de sol seca ao vento, na sombra. No Nordeste, é servida com macaxeira e manteiga de garrafa.','Despite its name, carne de sol is dried by the wind, in the shade. In the Northeast, it’s served with cassava and bottled butter.'],
 ca6:['No Rio Grande do Sul, a costela fogo de chão assa por horas em espetos fincados no chão, perto das brasas.','In Rio Grande do Sul, “fogo de chão” ribs roast for hours on skewers stuck in the ground beside the embers.'],
 ca7:['O espetinho é o churrasco de rua: assado na hora numa churrasqueira de carvão, na porta do estádio ou da feira.','The espetinho is street churrasco: grilled to order over charcoal outside the stadium or the market.'],
 ca8:['A feijoada leva feijão-preto e carnes de porco. Vem com arroz, couve, farofa e laranja, e no Rio é prato de quarta e de sábado.','Feijoada combines black beans with pork. It comes with rice, collard greens, farofa and orange, and in Rio it’s a Wednesday and Saturday dish.'],
 la1:['Minas Gerais é o estado que mais produz leite no Brasil.','Minas Gerais produces more milk than any other Brazilian state.'],
 la2:['No Nordeste existe a manteiga de garrafa, líquida e dourada, que vai na carne de sol e no cuscuz.','The Northeast has manteiga de garrafa, a golden liquid butter poured over carne de sol and cuscuz.'],
 la3:['O queijo minas frescal é branco, macio e levemente salgado. O modo artesanal de fazer queijo de Minas é patrimônio cultural do Brasil.','Fresh queijo minas is white, soft and lightly salty. The traditional way of making Minas cheese is part of Brazil’s cultural heritage.'],
 la4:['O requeijão cremoso de copo é bem brasileiro. Depois de vazio, o copo vira copo de suco em muitas casas.','Creamy requeijão in a glass jar is very Brazilian. Once empty, the jar becomes a juice glass in many homes.'],
 la5:['O queijo coalho é assado na brasa, no espeto, e vendido nas praias do Nordeste, às vezes com melaço por cima.','Queijo coalho is grilled on a stick over coals and sold on Northeastern beaches, sometimes drizzled with molasses.'],
 la6:['O doce de leite é leite com açúcar mexido no tacho por horas, até ficar cor de caramelo. Minas é famosa pelo seu.','Doce de leite is milk and sugar stirred in a pot for hours until caramel-colored. Minas Gerais is famous for it.'],
 la7:['Romeu e Julieta é queijo com goiabada: o salgado e o doce juntos, como o casal da peça de Shakespeare.','Romeu e Julieta is cheese with guava paste: salty and sweet together, like the couple in Shakespeare’s play.'],
 la8:['O pudim brasileiro é feito com leite condensado e calda de caramelo. É sobremesa de festa e de almoço de domingo.','Brazilian pudim is made with condensed milk and caramel sauce. It’s the dessert for parties and Sunday lunch.'],
 ln1:['O pastel de feira é frito na hora, com recheio de carne, queijo ou palmito. Dizem que foi popularizado por imigrantes chineses e japoneses em São Paulo.','The market pastel is fried to order, filled with meat, cheese or palm heart. It’s said to have been popularized by Chinese and Japanese immigrants in São Paulo.'],
 ln2:['A tapioca é a goma da mandioca espalhada na frigideira quente, sem óleo. É uma herança dos povos indígenas.','Tapioca is cassava starch spread on a hot pan without oil. It’s a legacy of Brazil’s Indigenous peoples.'],
 ln3:['O sanduíche de mortadela do Mercadão de São Paulo leva uma pilha enorme de mortadela fatiada. É difícil comer sem sujar a mão.','The mortadella sandwich at São Paulo’s Mercadão comes with a towering stack of sliced mortadella. It’s hard to eat without getting messy.'],
 ln4:['A coxinha tem o formato de uma coxa de frango e é recheada de frango desfiado. É o salgado mais pedido das lanchonetes.','The coxinha is shaped like a chicken drumstick and filled with shredded chicken. It’s the most ordered snack in Brazilian lanchonetes.'],
 ln5:['O acarajé é bolinho de feijão-fradinho frito no dendê, recheado com vatapá e camarão. A receita veio da África com os iorubás.','Acarajé is a black-eyed pea fritter fried in dendê oil and filled with vatapá and shrimp. The recipe came from Africa with the Yoruba people.'],
 ln6:['O “X” do X-tudo vem de “cheese”, que em português soa como “xis”. O X-tudo leva de tudo um pouco: ovo, bacon, presunto, milho e batata palha.','The “X” in X-tudo comes from “cheese”, which sounds like “xis” in Portuguese. It has a bit of everything: egg, bacon, ham, corn and shoestring potatoes.'],
 ln7:['A tapioca recheada pode ser salgada ou doce: queijo coalho, carne de sol, coco, banana com canela.','Filled tapioca can be savory or sweet: queijo coalho, carne de sol, coconut, banana with cinnamon.'],
 ln8:['Marmita era o nome da panela de metal em que se levava a comida para o trabalho. Hoje é o almoço caseiro que viaja na bolsa.','A marmita used to be the metal pot people carried food to work in. Today it’s the home-cooked lunch that travels in a bag.'],
 pa1:['O Paraná e o Rio Grande do Sul produzem a maior parte do trigo brasileiro, usado no pão, no macarrão e no bolo.','Paraná and Rio Grande do Sul grow most of Brazil’s wheat, used for bread, pasta and cake.'],
 pa2:['O pão de forma é assado numa forma retangular com tampa, por isso sai certinho e macio para o sanduíche.','The sandwich loaf bakes in a rectangular pan with a lid, so it comes out even and soft for sandwiches.'],
 pa3:['O pão francês é brasileiro, apesar do nome. Tem apelido em cada canto: cacetinho no Sul, pão de sal em Minas, carioquinha no Ceará.','Despite its name, pão francês is Brazilian. It has a nickname everywhere: cacetinho in the South, pão de sal in Minas, carioquinha in Ceará.'],
 pa4:['O pão de queijo é feito com polvilho, da mandioca, e queijo, sem farinha de trigo. É o orgulho de Minas Gerais.','Pão de queijo is made with cassava starch and cheese, with no wheat flour. It’s the pride of Minas Gerais.'],
 pa5:['A rosca doce é trançada e coberta de coco ou açúcar. Cheirando no forno, chama a família para o café da tarde.','The sweet bread ring is braided and topped with coconut or sugar. Its smell from the oven calls the family to afternoon coffee.'],
 pa6:['O fubá é farinha de milho. O bolo de fubá, às vezes com erva-doce, é o bolo do café da tarde na roça.','Fubá is cornmeal. Cornmeal cake, sometimes with fennel seed, is the afternoon-coffee cake of the countryside.'],
 pa7:['O empadão é uma torta salgada recheada de frango, palmito ou legumes. Em Goiás, o empadão goiano é prato típico.','Empadão is a savory pie filled with chicken, palm heart or vegetables. In Goiás, the empadão goiano is a regional classic.'],
 pa8:['Festa de aniversário no Brasil tem bolo recheado, brigadeiro e o “Parabéns pra você” cantado bem alto.','A Brazilian birthday party means a layered cake, brigadeiros and “Parabéns pra você” sung at the top of your lungs.'],
 fl1:['Uma muda é a planta ainda pequena, pronta para ir para o vaso ou para a terra. Na feira, muita gente leva ervas para plantar em casa.','A seedling is a young plant ready for a pot or the ground. At the market, many people take home herbs to plant.'],
 fl2:['A margarida é a flor do “bem-me-quer, mal-me-quer”: tira-se uma pétala de cada vez para descobrir a resposta.','The daisy is the “loves me, loves me not” flower: you pull one petal at a time to find the answer.'],
 fl3:['O Brasil tem mais de 2 mil espécies de orquídeas nativas. Muitas vivem penduradas nos galhos das árvores.','Brazil has more than 2,000 native orchid species. Many live clinging to tree branches.'],
 fl4:['O girassol novo acompanha o sol ao longo do dia. Quando a flor amadurece, fica virada para o leste.','A young sunflower follows the sun through the day. When the flower matures, it stays facing east.'],
 fl5:['A bromélia guarda água entre as folhas, e ali vivem pererecas e insetos. O abacaxi também é uma bromélia.','The bromeliad holds water between its leaves, where tree frogs and insects live. The pineapple is a bromeliad too.'],
 fl6:['Muitas flores de hibisco duram um dia só: abrem de manhã e murcham à noite. As pétalas secas viram chá.','Many hibiscus flowers last just one day: they open in the morning and wilt at night. The dried petals make tea.'],
 fl7:['O ipê-amarelo floresce no fim do inverno, depois de perder as folhas. A árvore inteira fica amarela.','The yellow ipê blooms at the end of winter, after dropping its leaves. The whole tree turns yellow.'],
 fl8:['O buquê tropical junta flores do Brasil, como helicônias, alpínias e antúrios, de cores fortes e que duram muitos dias.','A tropical bouquet brings together Brazilian flowers like heliconias, alpinias and anthuriums, bright and long-lasting.']
};

// Fichas dos personagens (pop-up do álbum): o que a profissão faz e uma curiosidade. Mesmo texto nos dois jogos.
const BIO={
 ze:['Feirante monta a banca ainda de madrugada, arruma as frutas em pirâmide e conhece cada freguês pelo nome. Seu Zé viaja com você e ensina os segredos de cada mercado.','Market vendors set up their stalls before dawn, stack fruit into pyramids and know every customer by name. Seu Zé travels with you and shares the secrets of each market.'],
 bia:['Aprendiz é quem começa ajudando: pesa as frutas, dá o troco e aprende a escolher o melhor produto. Muita banca de feira passa de pai para filho assim.','An apprentice starts by helping out: weighing fruit, giving change and learning to pick the best produce. Many market stalls pass from parent to child this way.'],
 mingau:['Gato de quitanda é tradição: ele afasta ratos dos sacos de grãos e vira o mascote da freguesia. Mingau dorme nas caixas vazias e acorda quando sente cheiro de peixe.','A shop cat is a tradition: it keeps mice away from the grain sacks and becomes everyone’s mascot. Mingau naps in empty crates and wakes up at the smell of fish.'],
 tonho:['O caminhoneiro leva frutas e verduras da roça até os mercados, muitas vezes rodando a noite inteira. No Brasil, a maior parte da comida viaja de caminhão.','Truck drivers carry fruit and vegetables from the farms to the markets, often driving all night. In Brazil, most food travels by truck.'],
 naza:['Tacacazeira é quem prepara e vende o tacacá: tucupi quente, goma, jambu e camarão, servidos numa cuia. Em Belém, a fila na banca dela começa no fim da tarde.','A tacacazeira makes and sells tacacá: hot tucupi broth, tapioca starch, jambu and shrimp, served in a gourd bowl. In Belém, the line at her stall starts in the late afternoon.'],
 raimundo:['O pescador sai de barco antes do sol nascer. No Ver-o-Peso, os barcos descarregam o peixe de madrugada na Pedra do Peixe, e ele já chega vendido.','Fishermen head out by boat before sunrise. At Ver-o-Peso, boats unload their catch before dawn at the Pedra do Peixe, and much of it is sold on arrival.'],
 iara:['A artesã trança fibras da floresta, como o arumã e a palha de tucumã, em cestos, peneiras e bolsas. Muitas dessas técnicas vêm dos povos indígenas da Amazônia.','The artisan weaves forest fibers, like arumã reed and tucumã palm straw, into baskets, sieves and bags. Many of these techniques come from the Indigenous peoples of the Amazon.'],
 chico:['Ribeirinho é quem vive à beira dos rios da Amazônia, em casas de madeira sobre palafitas. A vida acompanha a cheia e a vazante, e o barco é o carro da família.','Ribeirinhos live along the Amazon rivers in wooden houses on stilts. Life follows the rise and fall of the water, and the boat is the family car.'],
 dada:['A baiana de tabuleiro vende acarajé, abará e cocada, vestida de branco, com turbante e colares. O ofício das baianas de acarajé é patrimônio cultural do Brasil.','The baiana de tabuleiro sells acarajé, abará and cocada, dressed in white with a turban and beads. The craft of the acarajé baianas is part of Brazil’s official cultural heritage.'],
 jorginho:['O percussionista toca tambores como o atabaque, o timbal e o surdo. Em Salvador, os blocos afro ensaiam na rua e o som dos tambores atravessa o Pelourinho.','Percussionists play drums like the atabaque, the timbal and the surdo. In Salvador, Afro-Brazilian carnival groups rehearse in the streets, and the drums echo across the Pelourinho.'],
 biu:['O ceramista molda o barro com as mãos e queima as peças no forno. Em Pernambuco, os bonecos de barro do Alto do Moura, em Caruaru, ficaram famosos com o Mestre Vitalino.','A potter shapes clay by hand and fires the pieces in a kiln. In Pernambuco, the clay figurines of Alto do Moura, in Caruaru, became famous thanks to Mestre Vitalino.'],
 flor:['A rendeira faz renda ponto a ponto, com agulha ou bilros. Uma toalha de renda renascença pode levar meses, e o desenho passa de mãe para filha.','A lacemaker builds lace stitch by stitch, with a needle or bobbins. A single renascença lace tablecloth can take months, and the patterns pass from mother to daughter.'],
 cicero:['O vendedor de frutas sabe quando cada uma está no ponto só pelo cheiro e pelo aperto. No Ceará, a banca dele tem caju, seriguela, cajá e graviola.','A fruit seller can tell when fruit is ripe just by smell and touch. In Ceará, his stall has cashew fruit, seriguela, cajá and soursop.'],
 rosinha:['Rosinha aprende com a avó a renda de bilro: dezenas de bilros de madeira trocando de lugar sobre uma almofada. No Ceará, esse saber passa de geração em geração.','Rosinha is learning bobbin lace from her grandmother: dozens of wooden bobbins crossing over a cushion. In Ceará, this skill passes from one generation to the next.'],
 keiko:['A cozinheira de sobá prepara o macarrão em caldo trazido por imigrantes de Okinawa, no Japão. Em Campo Grande, o sobá da Feira Central virou patrimônio cultural da cidade.','The sobá cook makes the noodle soup brought by immigrants from Okinawa, Japan. In Campo Grande, the sobá of the Feira Central became part of the city’s cultural heritage.'],
 antenor:['O peão pantaneiro cuida do gado a cavalo no Pantanal e conduz comitivas por dias pelos campos alagados. Na pausa, toma tereré, o mate com água gelada.','The Pantanal cowboy herds cattle on horseback and leads drives for days across flooded plains. On breaks, he drinks tereré, yerba mate with ice-cold water.'],
 giuseppe:['O dono da lanchonete passa o dia na chapa, montando sanduíches e pastéis. Como muitos paulistanos, Seu Giuseppe é neto de imigrantes italianos.','The snack bar owner spends the day at the griddle, building sandwiches and pastéis. Like many people in São Paulo, Seu Giuseppe is the grandson of Italian immigrants.'],
 paula:['Paula trabalha num escritório no centro de São Paulo e aproveita o almoço para passar no Mercadão. Ela é o retrato do ritmo da maior cidade do Brasil.','Paula works in an office in downtown São Paulo and uses her lunch break to stop by the Mercadão. She is a picture of the pace of Brazil’s largest city.'],
 geralda:['Em Minas, “quitanda” são os biscoitos, broas, roscas e pães caseiros do café da tarde. A quitandeira é quem faz essas delícias no forno a lenha.','In Minas Gerais, “quitanda” means the homemade biscuits, cornbreads and sweet breads served with afternoon coffee. The quitandeira bakes these treats in a wood-fired oven.'],
 tiao:['O queijeiro faz o queijo com leite fresco e deixa curar em prateleiras de madeira, virando cada peça todo dia. O modo artesanal de fazer queijo de Minas é patrimônio cultural do Brasil.','The cheesemaker turns fresh milk into cheese and ages it on wooden shelves, flipping each wheel every day. The traditional way of making Minas cheese is part of Brazil’s cultural heritage.'],
 jacinto:['O sanfoneiro comanda o forró pé de serra, ao lado da zabumba e do triângulo. A Feira de São Cristóvão nasceu do encontro de nordestinos que se mudaram para o Rio.','The accordion player leads traditional forró, together with the zabumba drum and the triangle. The Feira de São Cristóvão began as a gathering of Northeasterners who had moved to Rio.'],
 dandara:['A cozinheira prepara os pratos do Nordeste na Feira de São Cristóvão: baião de dois, carne de sol e sarapatel. A panela dela começa a ferver logo cedo.','This cook makes Northeastern dishes at the Feira de São Cristóvão: baião de dois, carne de sol and sarapatel. Her pots start bubbling early in the morning.'],
 gaudencio:['O assador cuida do churrasco gaúcho: carne com sal grosso, assada devagar no fogo de chão ou na churrasqueira. Para ele, o segredo é a paciência com a brasa.','The grill master runs the gaúcho churrasco: meat with coarse salt, roasted slowly over a ground fire or a grill. For him, the secret is patience with the embers.'],
 livia:['No Sul, quem prepara o chimarrão toma o primeiro gole, o mais amargo, e depois passa a cuia na roda. Lívia cuida da erva, da água quente e da conversa.','In southern Brazil, whoever prepares the chimarrão drinks the first, most bitter sip, then passes the gourd around the circle. Lívia looks after the yerba, the hot water and the conversation.'],
 dico:['O pescador artesanal de Florianópolis segue uma tradição trazida pelos açorianos. Na época da tainha, os olheiros avisam do alto do morro quando o cardume chega.','The artisanal fishermen of Florianópolis keep a tradition brought by settlers from the Azores. In mullet season, lookouts on the hills signal when a school of fish arrives.'],

const isAdj=(x,y,cols)=>{ const d=Math.abs(x-y); return d===cols||(d===1&&Math.floor(x/cols)===Math.floor(y/cols)); };
function doMerge(b,cols,rows,from,to,via){
  const a=b[from],t=b[to];
  if(!a||!t||from===to||a.l!==t.l||a.n!==t.n||a.n>=MAX) return null;
  let n=a.n+1, third=-1;
  // Fusão tripla só com intenção: via = item igual, vizinho do destino, por cima do qual o dedo passou.
  if(via!=null&&via>=0&&via!==from&&via!==to&&a.n+2<=MAX&&b[via]&&b[via].l===a.l&&b[via].n===a.n&&isAdj(via,to,cols)) third=via;
  if(third>=0){b[third]=null;n=a.n+2;}
  b[from]=null; b[to]={l:a.l,n}; return {n,third};
}
function fillBoard(s){ const ls=linesAt(s.stop);
  s.board=s.board.map(x=>{ if(x) return x; const r=Math.random(); return {l:pick(ls),n:r<.5?1:r<.8?2:r<.95?3:4}; }); }
function newMission(s,slot){
  const used=s.missions.filter((m,i)=>m&&i!==slot).map(m=>m.t), t=pick(Object.keys(MTYPES).filter(k=>!used.includes(k))), tier=s.missTier++;
  return {t,goal:Math.round(MTYPES[t][1]*(1+.5*Math.floor(tier/3))),p:0,co:Math.min(300,30+10*tier),xp:20+5*tier};
}

function newOrder(){
  const ls=lines(), cast=castAt(S.stop), loc=cast.filter(x=>x.at>=0), c=pick(Math.random()<.6?loc:cast), o={id:S.nextId++,who:c.id,items:[]};
  if(S.level>=2&&Math.random()<.22) o.rush=Date.now()+75000;
  if(S.level>=3&&Math.random()<.25){
    let rs=RECIPES.map((r,i)=>i).filter(i=>RECIPES[i].it.every(x=>ls.includes(x[0])));
    const fr=rs.filter(i=>!S.recipes.includes(i)); if(fr.length) rs=fr;
    if(rs.length){ o.rec=pick(rs); o.items=RECIPES[o.rec].it.map(([l,n])=>({l,n,done:false})); return o; }
  }
  const lo=Math.min(4,2+Math.floor(S.level/20)), hi=Math.min(MAX,3+Math.floor(S.level/6)), count=Math.random()<.55?1:2;
  for(let i=0;i<count;i++){
    const l=i===0&&ls.includes(c.fav)&&Math.random()<.6?c.fav:pick(ls);
    o.items.push({l,n:lo+Math.floor((hi-lo+1)*Math.pow(Math.random(),2.2)),done:false}); }
  return o;
}
function tickBaskets(){
  const now=Date.now(), p=period(), C=cap();
  for(const k of lines()){
    const b=S.baskets[k]||(S.baskets[k]={c:C,t:now});
    if(b.c>=C){b.t=now;continue;}
    const g=Math.floor((now-b.t)/p); if(g>0){ b.c=Math.min(C,b.c+g); b.t+=g*p; if(b.c>=C)b.t=now; }
  }
}
function refill(n){ for(const k of lines()){ const b=S.baskets[k]; b.c=n==null?Math.max(b.c,cap()):Math.min(cap()+10,b.c+n); } }

// Volumes de Ajustes (0 a 1): sons (toques, moedas, canto) e música, cada um com a sua barra.
const vSom=()=>S.opts.vSom==null?1:S.opts.vSom, vMus=()=>S.opts.vMus==null?1:S.opts.vMus;
const Sfx={buf:{},p:{},
  carregar(k){ if(this.p[k]||!audio) return this.p[k]; try{ const s=atob(SFX_B64[k]), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
    this.p[k]=new Promise((ok,no)=>audio.decodeAudioData(u.buffer,ok,no)).then(b=>(this.buf[k]=b)).catch(()=>null); }catch(e){ this.p[k]=Promise.resolve(null); } return this.p[k]; },
  tocar(k,vol){ if(!S.opts.sound) return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); }catch(e){ return; }
    const go=b=>{ if(!b) return; const s=audio.createBufferSource(), g=audio.createGain(); g.gain.value=(vol||.9)*vSom(); s.buffer=b; s.connect(g); g.connect(audio.destination); s.start(audio.currentTime+.01); };
    if(this.buf[k]) go(this.buf[k]); else { const p=this.carregar(k); if(p) p.then(go); } } };

function beep(f,d){ if(!S.opts.sound) return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain(), t0=audio.currentTime+(d||0);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(Math.max(.0011,.08*vSom()),t0); g.gain.exponentialRampToValueAtTime(.001,t0+.25);

/* ===================== COMPRAS (mesmo código nos dois jogos) =====================
   Motor de compras com dinheiro real pela Google Play. O lado nativo é o plugin "Compras"
   (ComprasPlugin.java, em android/app/src/main/java/com/feiraviva/compras/ dos dois apps; Google Play Billing 8).
   PAGAMENTO='simulado': a confirmação é do próprio jogo e nada é cobrado (navegador e APKs de teste).
   PAGAMENTO='play': o copy-web.js troca a linha quando roda com COMPRAS=play. Sem o plugin (navegador), continua simulado.
   Regras:
   - cada compra tem um token da Google Play; o jogo guarda os já entregues (S.iap.tok) e nunca entrega duas vezes;
   - primeiro entrega e salva, depois avisa a Google Play (consumir ou reconhecer). Se o app fechar no meio,

   - consumíveis (moedas, ferramentas, kits) são consumidos e podem ser comprados de novo;
   - permanentes (remover anúncios, kits de "só 1 vez") são só reconhecidos; numa reinstalação ou em outro aparelho
     voltam sozinhos, sem repetir as moedas do kit;
   - pagamento pendente (boleto, Pix por código, dinheiro na loja): o jogo avisa e entrega quando a Google Play confirmar;

  // texto do botão: preço da Google Play na moeda do jogador (ou o US$ de referência no modo simulado)

const Avisos=(()=>{
  const C=window.Capacitor, P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications; if(!P) return null;
  const ID=1, ok=r=>!!(r&&r.display==='granted');
  return {
    pedir(){ return P.checkPermissions().then(r=>ok(r)?true:P.requestPermissions().then(ok)).catch(()=>false); },
    async agendar(){
      try{ await P.cancel({notifications:[{id:ID}]}); }catch(e){}
      if(!S||!S.opts.notif) return; const ms=msCheios(); if(ms<6e4) return;   // já cheios (ou quase): não precisa avisar
      try{ if(!ok(await P.checkPermissions())) return;
        await P.schedule({notifications:[{id:ID,title:t('nTitle'),body:t('nBody'),schedule:{at:new Date(Date.now()+ms),allowWhileIdle:true},smallIcon:'ic_stat_quitanda',iconColor:'#3E9B5F'}]}); }catch(e){}
    },
    cancelar(){ P.cancel({notifications:[{id:ID}]}).catch(()=>{}); }
  };
})();

// Banca da tela inicial, vista de cima como uma banca inclinada. Cada linha com item descoberto (S.seen) ocupa um
// lugar no tampo, da frente para o fundo (as do fundo menores, pela perspectiva); arranjoBanca decide quantas por
// fileira e a fundura do tampo. Com a balança, as duas fileiras da frente deixam a ponta esquerda livre. As decorações ficam no lugar e no tamanho
// proporcional (1 m ≈ 22% da largura), sem sombra: x e largura em % da largura, base em % da altura; "v" é a folga
// transparente embaixo da imagem; "s" fica no tampo; "z" força a camada (o rádio fica na frente do banco).
const DECOR_POS={1:{x:0,w:10,b:5,v:.125},2:{x:8,w:26,b:1,v:.102},11:{x:34,w:13,b:1,v:.148},3:{x:46,w:13,b:5,v:.039},
  8:{x:58,w:11,b:4,v:.039},7:{x:69,w:31,b:1.5,v:.078},4:{x:5,w:10,b:29.6,v:.062,s:1},6:{x:17,w:8,b:9.8,v:.055,z:41},9:{x:86,w:9,t:30}};
// Arranjo dinâmico da banca (igual nos dois jogos): com qualquer número de linhas, escolhe quantas ficam lado a lado
// em cada fileira (2 a 6) e quão fundo é o tampo (topo entre 31% e 23% da cena) para tudo caber com os maiores itens
// possíveis. Prefere o visual de sempre (2 por fileira, tampo raso) e só muda quando isso ganha bastante tamanho.
// qtd = nº de itens de cada linha; hw = altura/largura da cena; teto = onde acaba o toldo (% da altura);
// res = folga à esquerda nas 2 fileiras da frente (balança); passoMax = distância máxima entre fileiras. Devolve o topo do tampo (T) e o lugar de cada linha.
function arranjoBanca(qtd,{hw,teto,wMax=12,res=0,passoMax=12}){
  const N=qtd.length, FR=69, ESC=.27, CURV=.15; let best=null;
  if(!N) return {T:31,linhas:[]};
  for(const T of [31,29,27,25,23]) for(let por=2;por<=Math.min(6,Math.max(2,N));por++){
    const n=Math.ceil(N/por), dt=n>1?1/(n-1):0, span=Math.min(FR-T-3,passoMax*(n-1)), linhas=[];   // poucas fileiras ficam juntas, na frente
    const yb=r=>{ const t=r*dt; return FR-span*(t*(1+CURV)-CURV*t*t); };
    let w=n>1?Math.min(wMax,1.2*(yb(0)-yb(1))*hw):wMax;                 // fileiras não se cobrem demais
    for(let k=0;k<N;k++){
      const r=Math.floor(k/por), c=k%por, y=yb(r), L=13-10*(y-T)/(71-T), rs=r<2?res:0, larg=(97-2*L-rs-2*(por-1))/por;
      const a=L+1.5+rs+c*(larg+2), z=a+larg, s=1-ESC*r*dt, m=Math.max(1,qtd[k]);
      w=Math.min(w,(z-a)/((m-1)*.4+1)/s,(y-teto)/(1/hw-.17)/s);          // cabe na largura e não entra no toldo
      linhas.push({r,y,a,z,s,m});
    }
    const nota=w*(1-.08*(por-2))*(1-.02*(31-T));                   // cada coluna a mais ou tampo mais fundo precisa compensar
    if(!best||nota>best.nota) best={nota,T,w,linhas};
  }
  return {T:best.T,linhas:best.linhas.map(o=>{ const wi=best.w*o.s, passo=o.m>1?Math.min((o.z-o.a-wi)/(o.m-1),wi*.8):0;
    return {wi,passo,x0:(o.a+o.z)/2-passo*(o.m-1)/2,y:o.y,z:Math.max(1,20-o.r)}; })};
}

     +evCfgRow()+vol('sound','vSom',t('oSound'))+vol('music','vMus',t('oMusic'))+(Avisos?tg('notif',t('oNotif')):'')
     +(S.opts.dev?tg('noAds',t('oNoAds'))+tg('test',t('oTest'))+`<h2>${t('panel')}</h2><div class="stats" id="stats">${statsHtml()}</div><p class="note">${t('panelNote')}</p>`:'')
     +`<div class="row"><div><b>${t('priv')[0]}</b><p>${t('priv')[1]}</p></div><a class="btn ghosty" href="${PUB.priv}" target="_blank" rel="noopener">${t('privB')}</a></div>`
     +(AdNet&&AdNet.privReq()?`<div class="row"><div><b>${t('adPriv')[0]}</b><p>${t('adPriv')[1]}</p></div><button class="btn ghosty" data-act="adpriv">${t('adPrivB')}</button></div>`:'')

/* ===================== ANIMAÇÕES DAS FERRAMENTAS ===================== */
// Camada de efeitos por cima do jogo (Web Animations API). Com "reduzir movimento" ligado, os efeitos são pulados.
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=(x,y,s,r)=>`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})${r!=null?` rotate(${r}deg)`:''}`;
const ctr=r=>[r.left+r.width/2,r.top+r.height/2];
const cellEl=i=>$('board')&&$('board').querySelector(`[data-cell="${i}"]`);
function fxEl(html,x,y,cls,size){ const d=document.createElement('div'); d.className='fxe'+(cls?' '+cls:''); d.innerHTML=html; d.style.left=x+'px'; d.style.top=y+'px'; if(size) d.style.fontSize=size+'px'; document.body.appendChild(d); return d; }
function anim(el,kf,dur,ease,delay){ const a=el.animate(kf,{duration:dur,easing:ease||'ease-out',delay:delay||0,fill:'both'}); a.onfinish=()=>el.remove(); return a; }
function bumpEl(el,kf,dur,delay){ if(el) el.animate(kf,{duration:dur,delay:delay||0,easing:'ease-out'}); }
function floatTxt(t,x,y,delay){ anim(fxEl(t,x,y,'txt'),[{transform:T(0,0,.6),opacity:0},{transform:T(0,-12,1.15),opacity:1,offset:.25},{transform:T(0,-56,1),opacity:0}],1000,'ease-out',delay); }
function shake(el,amp){ bumpEl(el,[0,1,2,3,4,5].map(k=>({transform:`translate(${k===5?0:(k%2?-1:1)*(amp||4)*(1-k/5)}px,0)`})),300); }
// Junta-tudo: o ímã aparece no centro do tabuleiro e puxa cada par; os itens voam até a casa onde se juntam.
function fxMagnet(moves){
  const b=$('board'); if(!b||RM()||!moves.length) return; const [bx,by]=ctr(b.getBoundingClientRect()), mv=moves.slice(0,40), st=Math.min(60,900/mv.length);
  anim(fxEl('🧲',bx,by,'',72),[{transform:T(0,0,.2,-30),opacity:0},{transform:T(0,0,1.2,10),opacity:1,offset:.15},{transform:T(0,0,1,-8),offset:.3},{transform:T(0,0,1.05,8),offset:.5},{transform:T(0,0,1,0),opacity:1,offset:.8},{transform:T(0,0,.3,0),opacity:0}],600+mv.length*st+500);
  for(let k=0;k<3;k++) anim(fxEl('',bx,by,'ring'),[{transform:T(0,0,.3),opacity:.9},{transform:T(0,0,4.5),opacity:0}],900,'ease-out',k*250);
  mv.forEach(([f,to,em],k)=>{ const a=cellEl(f), c=cellEl(to); if(!a||!c) return; const ra=a.getBoundingClientRect(), [x0,y0]=ctr(ra), [x1,y1]=ctr(c.getBoundingClientRect()), d=250+k*st;
    anim(fxEl(em,x0,y0,'',ra.width*.54),[{transform:T(0,0,1),opacity:1},{transform:T((x1-x0)*.5+(bx-x0)*.25,(y1-y0)*.5+(by-y0)*.25,1.15),offset:.5},{transform:T(x1-x0,y1-y0,.7),opacity:.3}],420,'ease-in',d);
    bumpEl(c,[{transform:'scale(1)'},{transform:'scale(1)',offset:.55},{transform:'scale(1.3)',filter:'brightness(1.4)',offset:.75},{transform:'scale(1)'}],560,d); });
}
// Recarga: um raio corre pelos cestos, que acendem um a um e mostram as cargas ganhas.
function fxCharge(label){
  if(homeOn||RM()) return; const bs=[...document.querySelectorAll('[data-act^="basket:"]')]; if(!bs.length) return;
  const pts=bs.map(x=>ctr(x.getBoundingClientRect())), [x0,y0]=pts[0], last=pts[pts.length-1];
  const kf=[{transform:T(-60,-40,.4,-20),opacity:0}]; pts.forEach(([x,y],k)=>kf.push({transform:T(x-x0,y-y0-(k%2?14:-6),1.2,k%2?15:-15),opacity:1,offset:(k+1)/(pts.length+1)})); kf.push({transform:T(last[0]-x0+50,last[1]-y0-30,.4,20),opacity:0});
  anim(fxEl('⚡',x0,y0,'',44),kf,300+pts.length*160,'linear');
  bs.forEach((x,k)=>{ const d=Math.round(300+pts.length*160)*(k+1)/(pts.length+1);
    bumpEl(x,[{transform:'scale(1)',filter:'none'},{transform:'scale(1.12)',filter:'brightness(1.35) drop-shadow(0 0 10px #F7C51E)',offset:.35},{transform:'scale(1)',filter:'none'}],520,d);
    floatTxt(label,pts[k][0],pts[k][1]-30,d); });
  setTimeout(()=>beep(1180),150);
}

  if(a){ const [k,v]=a.dataset.act.split(':');
    if(k==='intro'){ introTap(); return; }

    else if(k==='magnet') magnet();
    else if(k==='recharge') recharge();
    else if(k==='adcharge'){ if(S.daily.adCharge<AD_MAX) showAd('rew',()=>{ S.daily.adCharge++; const g=Math.round(AD_CHARGE*bonus()); refill(g); toast(t('adCharge',g)); setTimeout(()=>fxCharge('+'+g),80); }); else toast(t('adLimit')); }
    else if(k==='userec'){ closeModal(); recharge(); }
    else if(k==='shop'&&!PUB.loja){ $('toast').hidden=true; closeModal(); empilha('up'); sheetName='up'; $('sheet').hidden=false; renderSheet(); }
    else if(k==='shop'){ $('toast').hidden=true; closeModal(); empilha('shop'); sheetName='shop'; $('sheet').hidden=false; renderSheet(); $('sheet').scrollTop=0; }
    else if(k==='iap'&&PUB.loja) iapAsk(v);
    else if(k==='iapok'&&PUB.loja) iapBuy(v);
    else if(k==='restaurar') Compras.restaurar();
    else if(k==='adpriv'){ if(AdNet) AdNet.privacy(); }
    else if(k==='tripskip') endTrip();
    else if(k==='tripdouble'){ const v=tripBonus; tripBonus=0; if(v) showAd('rew',()=>{ S.coins+=v; toast(t('tripDoubled',v)); }); }
    else if(k==='arrive'){ closeModal(); render(); maybeInter(); pedirAvisos(); }
    else if(k==='deliver'){ if(sel!=null) deliver(sel); }
    else if(k==='enc'){ if(sel!=null) deliverEnc(sel); }
    else if(k==='sell'){ if(sel!=null) sell(sel); }
    else if(k==='sort') sortBoard();
    else if(k==='swap') swapOrder(+v);
    else if(k==='double'){ const o=offer; if(o&&S.daily.adDouble<DOUBLE_MAX){ offer=null; showAd('rew',()=>{ S.daily.adDouble++; const x=gain(o.xp*bonus(),Math.round(o.co*bonus())); toast(t('doubled',x)); }); } }
    else if(k==='nav'){ $('toast').hidden=true; empilha(v==='shop'&&!PUB.loja?'up':v); sheetName=v==='shop'&&!PUB.loja?'up':v; if(v==='rec'&&Object.values(S.seen).includes(1)) recTab='ing'; $('sheet').hidden=false; renderSheet(); $('sheet').scrollTop=0; }
    else if(k==='close'){ sheetName=null; sheetPilha=[]; $('sheet').hidden=true; render(); }
    else if(k==='vering') verIng(v.slice(0,2),+v.slice(2));
    else if(k==='verrec') verRec(+v);
    else if(k==='vercast') verCast(v);
    else if(k==='claim'){ const m=S.missions[+v]; if(m&&m.p>=m.goal){ S.missions[+v]=newMission(S,+v); S.coins+=m.co; const x=gain(m.xp,0); beep(880); toast(t('missDone',m.co,x)); render(); } }
    else if(k==='chest'){ if(S.daily.chest<CHEST_MAX) showAd('rew',()=>{ S.daily.chest++; S.coins+=Math.round(80*bonus()); S.boost.mag++; Sfx.tocar('premio'); }); }
    else if(k==='buyexp') expand();
    else if(k==='buyup'){ const c=upCost(v); if(S.up[v]<UPS[v].max&&S.coins>=c){ S.coins-=c; S.up[v]++; beep(820); render(); pulsaSaldo(); } }
    else if(k==='buydeco'){ const i=+v; if(!S.decor.includes(i)&&S.level>=6&&S.coins>=DECOR[i][2]){ S.coins-=DECOR[i][2]; S.decor.push(i); beep(820); render(); } }
    else if(k==='ver'&&PUB.dev){ verTaps=(verTaps||0)+1; if(verTaps>=5){ verTaps=0; S.opts.dev=!S.opts.dev; toast(t(S.opts.dev?'devOn':'devOff')); render(); } }
    else if(k==='opt'&&v==='notif'){ S.opts.notif=!S.opts.notif; if(S.opts.notif&&Avisos) Avisos.pedir(); render(); }
    else if(k==='opt'){ S.opts[v]=!S.opts[v]; if(v==='music'||v==='sound') Musica.ligar(); for(const x of lines()) S.baskets[x].t=Date.now(); render(); }
    else if(k==='travelask'){ closeModal(); travelAsk(); }
    else if(k==='travel'){ closeModal(); travel(); }
    else if(k==='evento') evPopup();
    else if(k==='mclose'){ closeModal(); render(); }
    else if(k==='xfer') transferModal();
    else if(k==='xcopy'){ const el=$('xcode'); if(!el||!el.value) return; const ok=()=>toast(t('xferCopied'));
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(ok,()=>{ el.select(); try{ document.execCommand('copy'); ok(); }catch(e){} });
      else { el.select(); try{ document.execCommand('copy'); ok(); }catch(e){} } }
    else if(k==='xload'){ const el=$('xin'); readCode(el?el.value:'').then(d=>{ xferNew=d;
        $('card').innerHTML=`<div class="big">📲</div><h2>${t('xferQ')}</h2><p>${t('xferQP',d.level||1,d.stop||0,fmt(d.coins||0))}</p><button class="btn" data-act="xyes">${t('xferYes')}</button><button class="btn ghosty" data-act="mclose">${t('cancel')}</button>`; })
        .catch(()=>toast(t('xferBad'))); }
    else if(k==='xyes'){ if(!xferNew) return; try{ localStorage.setItem(KEY,JSON.stringify(xferNew)); }catch(e){ toast(t('xferBad')); return; } location.reload(); }
    else if(k==='reset') modal(`<h2>${t('resetQ')}</h2><p>${t('resetQP')}</p><button class="btn" data-act="resetyes">${t('resetYes')}</button><button class="btn ghosty" data-act="mclose">${t('cancel')}</button>`);
    else if(k==='resetyes'){ try{ localStorage.removeItem('quitanda-zen-v1'); }catch(e){} const ev0=S.ev; S=fresh(); S.ev=ev0; sel=null; selOrder=null; offer=null; modalQ=[]; closeModal(); sheetName=null; $('sheet').hidden=true; homeOn=true; render(); }
    else if(k==='lvlok'){ closeModal(); render(); }
    return;
  }
  if(noClick) return;
  const o=e.target.closest('[data-order]');
  if(o){ const id=+o.dataset.order, ord=S.orders.find(x=>x.id===id); if(!ord) return;
    if(sel!=null){ deliver(sel,id); return; }
    const i=S.board.findIndex(x=>x&&matches(ord,x));
    if(i>=0) deliver(i,id); else { selOrder=selOrder===id?null:id; render(); }
    return; }
  if(e.target.closest('[data-enc]')){ if(sel!=null) deliverEnc(sel); else toast(t('encHint',ENC_N,encLvl())); return; }
  const c=e.target.closest('[data-cell]'); if(!c) return;
  const i=+c.dataset.cell, it=S.board[i]; selOrder=null;
  if(sel!=null&&sel!==i){ const a=S.board[sel];
    if(!it||(a&&it.l===a.l&&it.n===a.n&&it.n<MAX)){ drop(sel,i); return; }
    sel=i;
  } else if(sel===i) sel=null; else if(it) sel=i;
  render();
});
// Barras de volume: mudam na hora, sem redesenhar a tela (para não soltar o dedo da barra); ao soltar, salva e toca uma amostra.
document.addEventListener('input',e=>{ const r=e.target.closest&&e.target.closest('[data-vol]'); if(!r) return; const k=r.dataset.vol;
  S.opts[k]=+r.value/100; const o=$('vo-'+k); if(o) o.textContent=r.value+'%'; if(k==='vMus') Musica.volume(); });
document.addEventListener('change',e=>{ const r=e.target.closest&&e.target.closest('[data-vol]'); if(!r) return; save(); if(r.dataset.vol==='vSom') Sfx.tocar('pedido'); });
$('board').addEventListener('pointerdown',e=>{ lastAct=Date.now(); const c=e.target.closest('[data-cell]'); if(!c) return; const i=+c.dataset.cell; if(!S.board[i]) return; drag={i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,g:null,cur:-1,prev:-1}; });
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){ drag.on=true; const it=S.board[drag.i]; drag.g=document.createElement('div'); drag.g.className='ghost'; drag.g.innerHTML=item(it.l,it.n)[0]; document.body.appendChild(drag.g);
    const c=$('board').querySelector(`[data-cell="${drag.i}"]`); if(c)c.classList.add('drag'); }
  if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px';
    // Guarda o último item igual por onde o dedo passou; ele só entra na fusão se for vizinho do destino.
    const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('#board [data-cell]'), k=c?+c.dataset.cell:-1;
    if(k>=0&&k!==drag.cur){ const it=S.board[drag.i], same=j=>j>=0&&j!==drag.i&&S.board[j]&&S.board[j].l===it.l&&S.board[j].n===it.n;
      drag.prev=same(k)&&same(drag.cur)?drag.cur:same(k)&&same(drag.prev)&&isAdj(k,drag.prev,S.cols)?drag.prev:-1; drag.cur=k;
      $('board').querySelectorAll('.trail').forEach(x=>x.classList.remove('trail'));
      if(drag.prev>=0&&it.n+2<=MAX&&isAdj(k,drag.prev,S.cols)) [k,drag.prev].forEach(j=>$('board').querySelector(`[data-cell="${j}"]`).classList.add('trail')); } }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; if(!d.on) return;
  d.g.remove(); noClick=true; setTimeout(()=>noClick=false,60); lastAct=Date.now();
  const el=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest('[data-cell]'), o=el&&el.closest('[data-order]'), en=el&&el.closest('[data-enc]');
  if(c) drop(d.i,+c.dataset.cell,d.prev); else if(o) deliver(d.i,+o.dataset.order); else if(en) deliverEnc(d.i); else render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));
