/* Vinheta Bentevi Apps: o bem-te-vi chega voando batendo as asas, freia, pousa no galho e canta o próprio nome.
   Arte do Nano Banana (docs/arte/vinheta/), recortada e embutida em VINHETA_IMG. Toda a animação sai de vinheta.quadro(t),
   com t em segundos desde o início: 0 a 1,42 s voo, até 1,86 s freada, 2,05 s canto (sílabas no tempo do CALL), 3,8 s "apps".
   Uso: vinheta.montar(palco, raiz) uma vez; depois vinheta.quadro(t) a cada quadro (requestAnimationFrame). */
const vinheta=(()=>{
  const W=300, SB=150/427, SG=290/820, KC=SB*1.08, KP=SB*1.22;      // escalas: pousado, galho, voo e freada (px de tela por px da arte)
  const TAM={galho:[820,850],pousado:[350,427],cantando:[304,422],v2_corpo:[438,313],v2_asacima:[297,387],v2_asabaixo:[426,347],v2_pouso:[439,467]};
  const PE={x:194,y:378}, PEC={x:204,y:262}, PEF={x:277,y:432};      // pés: pousado, corpo em voo, freada
  const OMB={x:185,y:100}, PC={x:268,y:322}, PB={x:345,y:45};        // ombro no corpo; ombro nas asas de cima e de baixo
  const ALVO={x:530*SG,y:567*SG}, CANTO=2.05, TF=1.42, TP=1.86, FLAP=7/1.42;
  const SILABAS=[[.03,.1],[.34,.13],[.565,.21]];                     // mesmo tempo do canto gravado (CALL)
  const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,k)=>a+(b-a)*k, seg=(t,a,b)=>cl((t-a)/(b-a)), sm=x=>x*x*(3-2*x);
  const bez=(x1,y1,x2,y2)=>t=>{ let u=t; for(let i=0;i<8;i++){ const x=3*(1-u)**2*u*x1+3*(1-u)*u*u*x2+u**3-t, d=3*(1-u)**2*x1+6*(1-u)*u*(x2-x1)+3*u*u*(1-x2); if(Math.abs(d)<1e-6) break; u=cl(u-x/d); } return 3*(1-u)**2*u*y1+3*(1-u)*u*u*y2+u**3; };
  const eOut=bez(0,0,.58,1), back=bez(.3,1.5,.5,1), eV=bez(.32,.1,.25,1);
  const cub=(a,b,c,d,u)=>(1-u)**3*a+3*(1-u)**2*u*b+3*(1-u)*u*u*c+u**3*d;
  const PATH=[[-300,-260],[-200,10],[-90,-10],[0,0]];
  const pos=k=>{ const u=eV(cl(k)); return [ALVO.x+cub(...PATH.map(p=>p[0]),u), ALVO.y+cub(...PATH.map(p=>p[1]),u)]; };
  let E=null;
  function img(n,k,extra){ const i=document.createElement('img'); i.src=VINHETA_IMG[n]; i.alt=''; i.draggable=false;
    i.style.cssText=`position:absolute;left:0;top:0;width:${TAM[n][0]*k}px;height:${TAM[n][1]*k}px;max-width:none;will-change:transform,opacity;${extra||''}`; return i; }
  function caixa(){ const d=document.createElement('div'); d.style.cssText='position:absolute;left:0;top:0;will-change:transform,opacity'; return d; }
  function montar(palco,raiz){
    palco.textContent=''; palco.style.cssText=`position:relative;width:${W}px;height:${W}px;flex:none`;
    const galho=caixa(); galho.style.width=galho.style.height=W+'px'; galho.style.transformOrigin='14px 297px';
    galho.append(img('galho',SG));
    const voo=caixa(), esc='filter:brightness(.72) saturate(.9)';
    const a2c=img('v2_asacima',KC,esc), a2b=img('v2_asabaixo',KC,esc), corpo=img('v2_corpo',KC), a1c=img('v2_asacima',KC), a1b=img('v2_asabaixo',KC);
    voo.append(a2c,a2b,corpo,a1c,a1b);
    const freio=caixa(); freio.append(img('v2_pouso',KP));
    const pouso=caixa(), parado=img('pousado',SB), canta=img('cantando',SB,`left:${9*SB}px;top:${4*SB}px;opacity:0`);
    pouso.append(parado,canta);
    galho.append(voo,freio,pouso); palco.append(galho);
    const wm=raiz.querySelector('.wm,.vn-wm');
    E={raiz,galho,voo,a1c,a1b,a2c,a2b,freio,pouso,parado,canta,sil:wm?[...wm.querySelectorAll('span')]:[],sub:wm&&wm.querySelector('i'),ws:raiz.querySelector('.wsub,.vn-sub')};
    a1c.style.transformOrigin=a2c.style.transformOrigin=`${PC.x*KC}px ${PC.y*KC}px`;
    a1b.style.transformOrigin=a2b.style.transformOrigin=`${PB.x*KC}px ${PB.y*KC}px`;
    voo.style.transformOrigin=`${PEC.x*KC}px ${PEC.y*KC}px`; freio.style.transformOrigin=`${PEF.x*KP}px ${PEF.y*KP}px`; pouso.style.transformOrigin=`${PE.x*SB}px ${PE.y*SB}px`;
    const larg=Math.min(window.innerWidth||360,560); palco.style.zoom='';                 // cabe em telas estreitas
    palco.style.transform=larg<W/.86?`scale(${larg*.86/W})`:''; palco.style.transformOrigin='50% 100%';
    quadro(0);
  }
  function asa(c,b,p,ox,oy,e){                     // p: 0 = asa no alto, 1 = asa embaixo
    const mix=sm(seg(p,.42,.58)), rc=lerp(0,-42,sm(cl(p/.6))), sc=lerp(1,.8,cl(p/.6)), rb=lerp(32,0,sm(seg(p,.4,1))), sb=lerp(.8,1,seg(p,.4,1));
    c.style.transform=`translate(${ox-PC.x*KC}px,${oy-PC.y*KC}px) rotate(${rc}deg) scale(${e},${sc*e})`;
    b.style.transform=`translate(${ox-PB.x*KC}px,${oy-PB.y*KC}px) rotate(${rb}deg) scale(${e},${sb*e})`;
    c.style.opacity=1-mix; b.style.opacity=mix;
  }
  const bate=c=>c<.42?sm(c/.42):1-sm((c-.42)/.58);   // a asa desce mais rápido do que sobe
  function quadro(t){
    if(!E) return;
    const z=eOut(seg(t,0,6)); E.raiz.style.transform=`scale(${1+.035*z})`;
    // voo
    const [fx,fy]=pos(seg(t,0,TP)), [fx2,fy2]=pos(seg(t,0,TP)+.004);
    const ang=cl(Math.atan2(fy2-fy,fx2-fx)*90/Math.PI,-20,20);
    const amt=1-sm(seg(t,TF-.12,TF)), c=(FLAP*t)%1, bob=-Math.sin(2*Math.PI*(c-.1))*3*amt;
    E.voo.style.transform=`translate(${fx-PEC.x*KC}px,${fy-PEC.y*KC+bob}px) rotate(${ang}deg)`;
    asa(E.a1c,E.a1b,bate(c)*amt,OMB.x*KC,OMB.y*KC,1);
    asa(E.a2c,E.a2b,bate((c+.94)%1)*amt,(OMB.x+16)*KC,(OMB.y-8)*KC,.9);
    const tf=sm(seg(t,TF-.05,TF+.07)), troca=seg(t,TP-.02,TP+.03);
    E.voo.style.opacity=Math.min(seg(t,0,.2),1-tf);
    // freada
    const fk=seg(t,TF-.05,TP), tremor=Math.sin(t*2*Math.PI*9)*1.2*(1-fk);
    E.freio.style.transform=`translate(${fx-PEF.x*KP}px,${fy-PEF.y*KP}px) rotate(${lerp(ang,-4,sm(fk))+tremor}deg) scale(${1+.03*Math.sin(Math.PI*fk)})`;
    E.freio.style.opacity=Math.min(tf,1-troca);
    // pousado: amortece, respira e canta
    const q=seg(t,TP,TP+.5);
    const sy0=q<.3?lerp(1,.93,eOut(q/.3)):q<.65?lerp(.93,1.025,eOut((q-.3)/.35)):lerp(1.025,1,eOut((q-.65)/.35));

let cantoBuf=null, cantoP=null;
function loadCanto(){ if(cantoP||!audio) return cantoP; try{ const s=atob(CANTO), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
  cantoP=new Promise((ok,no)=>audio.decodeAudioData(u.buffer,ok,no)).then(b=>(cantoBuf=b)).catch(()=>null); }catch(e){ cantoP=Promise.resolve(null); } return cantoP; }
function birdCall(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const toca=b=>{ if(!b) return birdSynth(); const s=audio.createBufferSource(), g=audio.createGain(); g.gain.value=.6*vSom(); s.buffer=b; s.connect(g); g.connect(audio.destination); s.start(audio.currentTime+.01); };
  if(cantoBuf) toca(cantoBuf); else { const p=loadCanto(); if(p) p.then(toca); else birdSynth(); }
}
function birdSynth(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const c=audio, t0=c.currentTime+.04;
    const out=c.createGain(); out.gain.value=.3; out.connect(c.destination);
    CALL.forEach(([at,d,fr],n)=>{ const g=c.createGain(), t=t0+at; g.connect(out);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.035); g.gain.setValueAtTime(1,t+d*.6); g.gain.exponentialRampToValueAtTime(.001,t+d);
      [[1,.8],[2,.16],[3,.05]].forEach(([h,v])=>{ const o=c.createOscillator(), og=c.createGain(); o.type='sine'; og.gain.value=v;
        o.frequency.setValueCurveAtTime(new Float32Array(fr.map(f=>f*h)),t,d);
        if(n===2){ const lf=c.createOscillator(), lg=c.createGain(); lf.frequency.value=26; lg.gain.value=22*h; lf.connect(lg); lg.connect(o.frequency); lf.start(t); lf.stop(t+d); }
        o.connect(og); og.connect(g); o.start(t); o.stop(t+d+.02); }); });
  }catch(e){}
}
function sing(){
  if(!introState) return;
  introState.tms.push(setTimeout(endIntro,3300));   // a imagem sai de vinheta.quadro(); aqui só o som e o fim
  if(!S.opts.sound) return;
  if(audio&&audio.state==='running') birdCall();
  else { const late=()=>{ if(introState){ try{ audio.resume().then(birdCall); }catch(e){} } }; window.addEventListener('pointerdown',late,{once:true,capture:true}); }   // navegador bloqueou o som: canta no primeiro toque
}
function endIntro(){
  if(!introState) return; introState.tms.forEach(clearTimeout); cancelAnimationFrame(introState.raf); introState=null;
  $('intro').classList.add('out'); setTimeout(()=>{ $('intro').hidden=true; boasVindas(); },520);
}
function intro(){
  const el=$('intro'), curta=S.introDay===today(); S.introDay=today(); save();
  el.hidden=false; introState={t0:Date.now(),tms:[]}; $('pulahint').textContent=t('tapSkip');
  vinheta.montar($('vpalco'),el.querySelector('.introin'));
  if(curta){   // já viu hoje: só o pássaro pousado e o nome, por 1,5 s
    el.classList.add('curta'); vinheta.quadro(vinheta.FINAL); introState.tms.push(setTimeout(endIntro,1500)); return; }
  if(S.opts.sound){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); loadCanto(); }catch(e){} }
  const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(quieto) vinheta.quadro(vinheta.FINAL);
  else { const t0=performance.now(), passo=n=>{ if(!introState) return; vinheta.quadro((n-t0)/1000); introState.raf=requestAnimationFrame(passo); }; introState.raf=requestAnimationFrame(passo); }
  introState.tms.push(setTimeout(sing,quieto?300:2050));   // pousou, cantou
}
function introTap(){ endIntro(); }
/* Botão voltar do Android: fecha a camada da frente (vinheta, viagem, aviso, painel), volta para o painel de onde
   a pessoa veio (pilha sheetPilha), volta do tabuleiro para a tela inicial e só sai do app na tela inicial, no
   segundo toque em até 2 s. Nunca sai de outra tela. */
let backAt=0, sheetPilha=[];
// Guarda o painel aberto antes de abrir outro por cima, para o voltar retornar a ele.
function empilha(novo){ if($('sheet').hidden||!sheetName) sheetPilha=[]; else if(sheetName!==novo) sheetPilha.push(sheetName); }
function voltar(){
  const C=window.Capacitor, P=C&&C.Plugins&&C.Plugins.App;
  if(!$('intro').hidden){ endIntro(); return; }
  if(!$('trip').hidden){ endTrip(); return; }
  if(!$('over').hidden){
    const ad=$('adclose'); if(ad){ if(!ad.disabled) ad.click(); return; }   // anúncio: só fecha quando a contagem acaba
    const b=$('card').querySelector('[data-act="mclose"],[data-act="lvlok"],[data-act="arrive"],[data-act^="dayok"],[data-act="iapno"]'); if(b) b.click(); return; }
  if(drag) return;
  if(sheetName&&!$('sheet').hidden){
    if(sheetPilha.length){ sheetName=sheetPilha.pop(); renderSheet(); $('sheet').scrollTop=0; return; }
    sheetName=null; $('sheet').hidden=true; render(); return; }
  if(!homeOn){ homeOn=true; tip=Math.floor(Math.random()*TIPS.length); sel=null; selOrder=null; render(); return; }
  if(Date.now()-backAt<2000){ save(); if(P&&P.exitApp) P.exitApp(); return; }
  backAt=Date.now(); toast(t('backExit'));
}
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });   // toque pelo teclado nos itens do álbum
(()=>{ const C=window.Capacitor, P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.App;
  if(P&&P.addListener) P.addListener('backButton',voltar); })();
function start(d){
  LANG=detectLang(); S=(d&&d.v===2&&Array.isArray(d.board))?d:load();
  let q=null; try{ q=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(q==='en'||q==='pt') S.opts.lang=q; LANG=S.opts.lang||LANG; S.opts.lang=LANG;
  S.iap=S.iap||{n:0,usd:0,once:[]}; if(S.tut==null) S.tut=(S.stats.merges||S.stats.orders)?4:0; if(S.opts.music==null) S.opts.music=true; if(S.opts.notif==null) S.opts.notif=true;
  if(!S.seen){ S.seen={}; S.board.forEach(x=>{ if(x) S.seen[x.l+x.n]=2; }); }   // Álbum de ingredientes: 1 = novo, 2 = já visto
  S.albumDone=S.albumDone||[]; S.ev=S.ev||EV_NEW(); S.ev.got=S.ev.got||[]; S.ev.prog=S.ev.prog||{}; S.ev.seen=S.ev.seen||{};
  if(!PUB.dev){ S.opts.dev=false; S.opts.test=false; }
  Compras.init({prefixo:'qz', dar:iapDar, salvar:save, aviso:toast, pronto:iapFesta, mudou:()=>{ if(sheetName==='shop') renderSheet(); },
    produtos:[...SHOP.packs.map(p=>({key:'pack-'+p.id,tipo:p.once?'permanente':'consumivel'})),...SHOP.coins.map(c=>({key:'coins-'+c[0],tipo:'consumivel'})),
              ...SHOP.items.map(c=>({key:'item-'+c[0],tipo:'consumivel'})),{key:'noads-0',tipo:'permanente'}]});
  applyLang(); render(); setInterval(tick,1000); setInterval(evTick,1000); evTick();
  let q2=null; try{ q2=new URLSearchParams(location.search).get('intro'); }catch(e){} if(q2!=='0') intro(); else boasVindas();
  (()=>{ const C=window.Capacitor, A=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.App;   // no app, pause/resume também avisam
    if(A&&A.addListener){ A.addListener('pause',saiu); A.addListener('resume',voltou); } })();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
