<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quitanda Zen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Telas: inicial (home), jogo (app), folhas (mapa, turma, missões, receitas, melhorias, ajustes) e cartões modais. */
:root{
  --bg:#DCEFE4; --panel:#F6FBF8; --cell:#FFFFFF; --hole:#C6E2D3; --ink:#1D4A3F; --muted:#557A6E;
  --accent:#2A8F63; --on-accent:#FFFFFF; --gold:#B87A00; --line:#B5D6C5; --scrim:rgba(16,40,33,.82); --warn:#B4472E;
  --sun:#F2B33D; --land:#BFE3CF; --stripe:#E4573D;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-weight:600;font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px}
.icon{background:var(--panel);border-radius:12px;width:38px;height:38px;font-size:18px;flex:0 0 auto}
.lvl{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 10px;white-space:nowrap}
.xp{flex:1;min-width:0}
.xp small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:5px;background:var(--hole);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.coins{font-family:var(--display);font-weight:800;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.orders{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.order{min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.order.ready{border-color:var(--accent);background:var(--cell)}
.order.want,.order.osel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.order.rush .who{color:var(--warn);font-weight:800}
.order .who{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.need{display:flex;gap:3px;font-size:18px;line-height:1.15}
.need sub{font-size:10px;font-weight:800;color:var(--ink);vertical-align:baseline}
.need .ok{opacity:.3}
.strip{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:5px 10px;font-size:12px;text-align:left;min-height:28px}
.strip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .bar{flex:1;min-width:40px;height:8px}
.strip.go{background:var(--sun);color:#3A2A00;font-weight:800;justify-content:center;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:22%;background:var(--hole);position:relative;display:grid;place-items:center}
.cell.has{background:var(--cell);box-shadow:0 3px 0 var(--lc,var(--line))}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.drag{opacity:.3}
.cell.hint{animation:hint .9s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.1);outline:2px solid var(--gold)}}
.cell .em{font-size:calc(var(--cs)*.54);line-height:1}
.cell .lv{position:absolute;right:4%;bottom:4%;min-width:calc(var(--cs)*.34);height:calc(var(--cs)*.34);border-radius:99px;background:var(--lc,var(--accent));color:#fff;font-size:calc(var(--cs)*.22);font-weight:800;display:grid;place-items:center}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fx{position:fixed;z-index:16;pointer-events:none;font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);transform:translate(-50%,-50%);animation:fx .9s ease-out forwards;white-space:nowrap}
@keyframes fx{to{transform:translate(-50%,-260%);opacity:0}}
@media (prefers-reduced-motion: reduce){.cell.pop,.cell.hint,.strip.go,.floaty i,.node.cur{animation:none!important}.fx{animation-duration:.01s}}
.ghost{position:fixed;z-index:15;pointer-events:none;font-size:40px;line-height:1;transform:translate(-50%,-70%)}
.info{min-height:42px;background:var(--panel);border-radius:14px;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.info p{margin:0;flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.btn{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:99px;padding:8px 14px;white-space:nowrap}
.btn.ghosty{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.baskets{display:flex;gap:4px}
.basket{flex:1 1 0;min-width:0;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--lc,var(--line));border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.basket:active{transform:translateY(2px)}
.basket .em{font-size:21px;line-height:1.1}
.basket b{font-family:var(--display);font-size:14px;line-height:1.1;font-variant-numeric:tabular-nums}
.basket small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.basket.ad{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.basket.ad small{color:var(--on-accent)}
.basket.bo{flex:.75 1 0}.basket.bo .em{font-size:20px;line-height:1.32}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.nav button{background:var(--panel);border-radius:12px;padding:6px 2px;font-weight:800;font-size:11px;min-width:0;position:relative;line-height:1.2}
.nav button span{display:block;font-size:17px}
.dot{position:absolute;top:4px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.sheet,.over,.home{position:fixed;inset:0}
.home{z-index:18;background:var(--bg);overflow:auto;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex}
.homein{max-width:420px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;position:relative}
.logo{font-family:var(--display);font-weight:800;line-height:.9}
.logo b{display:block;font-size:52px;color:var(--accent);letter-spacing:-1px}
.logo small{display:block;font-family:var(--text);font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.floaty{position:relative;height:0}
.floaty i{position:absolute;font-style:normal;font-size:26px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.stall{background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.awning{height:30px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,#FFF6E8 28px 56px);border-bottom-left-radius:14px 10px;border-bottom-right-radius:14px 10px}
.shelf{display:flex;justify-content:center;gap:4px;font-size:26px;padding:10px 8px 4px;flex-wrap:wrap}
.deco{font-size:18px;min-height:8px;letter-spacing:4px}
.keeper{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;text-align:left}
.keeper span{font-size:40px;line-height:1}
.keeper p{margin:0;background:var(--bg);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13px;flex:1}
.play{font-family:var(--display);font-weight:800;font-size:26px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.where{background:var(--panel);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.where small{color:var(--muted)}
.hnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hnav button{background:var(--panel);border-radius:14px;padding:10px 2px;font-weight:800;font-size:12px;position:relative}
.hnav span{display:block;font-size:22px}
.gift{background:var(--sun);color:#3A2A00;font-weight:800;border-radius:14px;padding:10px}
.sheet{z-index:20;background:var(--bg);overflow:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet>div{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.1} h2{font-size:18px;margin-top:6px}
.row{background:var(--panel);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.row>div{flex:1;min-width:0}
.row p{margin:2px 0 0;color:var(--muted);font-size:13px}
.row b{font-weight:800}
.row.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.row.lock{opacity:.6}
.row .face{font-size:34px;line-height:1;flex:0 0 auto;width:44px;text-align:center}
.row .bar{margin-top:6px;height:8px}
.note{color:var(--muted);font-size:13px;margin:0;max-width:60ch}
.map{background:var(--panel);border-radius:20px;padding:8px}
.map svg{display:block;width:100%;height:auto;max-height:46vh}
.map .land{fill:var(--land);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.map .route{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
.map .route.done{stroke:var(--accent);stroke-dasharray:none;stroke-width:2.5}
.node circle{fill:var(--hole);stroke:var(--muted);stroke-width:1.5}
.node text{font:800 9px var(--text);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.node.done circle{fill:var(--accent);stroke:var(--panel)} .node.done text{fill:var(--on-accent)}
.node.cur circle{fill:var(--sun);stroke:var(--ink);stroke-width:2} .node.cur text{fill:#3A2A00}
.node.cur{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--panel);border-radius:14px;padding:12px;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){font-weight:800;text-align:right}
.over{z-index:30;background:var(--scrim);display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border-radius:20px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90vh;overflow:auto}
.card p{margin:0}
.card .big{font-size:48px;line-height:1}
.card ul{margin:0;padding-left:18px;text-align:left}
.adbox{border:2px dashed var(--line);border-radius:14px;padding:24px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-weight:800;max-width:calc(100% - 32px);text-align:center}
.warn{color:var(--warn)}
.logo .say{font-family:var(--text);font-weight:600;font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.3}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{background:var(--panel);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.info i{color:var(--muted);font-size:12px}
</style>
</head>

<script>
/* ===================== IDIOMA ===================== */

const t=(k,...a)=>{ const v=(UI[LANG]&&UI[LANG][k]!=null)?UI[LANG][k]:UI.pt[k]; return typeof v==='function'?v(...a):v; };
function detectLang(){
  try{ const q=new URLSearchParams(location.search).get('lang'); if(q==='en'||q==='pt') return q; }catch(e){}
  return /^pt/i.test(navigator.language||'pt')?'pt':'en';
}
function applyLang(){
  document.documentElement.lang=LANG==='en'?'en':'pt-BR';
  document.title=t('docTitle');
  $('homebtn').setAttribute('aria-label',t('home'));
}

function doMerge(b,cols,rows,from,to){
  const a=b[from],t=b[to];
  if(!a||!t||from===to||a.l!==t.l||a.n!==t.n||a.n>=MAX) return null;
  let n=a.n+1, third=-1;
  if(a.n+2<=MAX){ const r=Math.floor(to/cols),c=to%cols;
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){ const rr=r+dr,cc=c+dc;
      if(rr<0||cc<0||rr>=rows||cc>=cols) continue; const k=rr*cols+cc;
      if(k!==from&&b[k]&&b[k].l===a.l&&b[k].n===a.n){third=k;break;} } }
  if(third>=0){b[third]=null;n=a.n+2;}
  b[from]=null; b[to]={l:a.l,n}; return {n,third};
}

function newOrder(){
  const ls=lines(), cast=castAt(S.stop), loc=cast.filter(x=>x.at>=0), c=pick(Math.random()<.6?loc:cast), o={id:S.nextId++,who:c.id,items:[]};
  if(S.level>=2&&Math.random()<.22) o.rush=Date.now()+75000;
  if(S.level>=3&&Math.random()<.25){
    let rs=RECIPES.map((r,i)=>i).filter(i=>RECIPES[i].it.every(x=>ls.includes(x[0])));
    const fr=rs.filter(i=>!S.recipes.includes(i)); if(fr.length) rs=fr;
    if(rs.length){ o.rec=pick(rs); o.items=RECIPES[o.rec].it.map(([l,n])=>({l,n,done:false})); return o; }
  }
  const lo=Math.min(4,2+Math.floor(S.level/20)), hi=Math.min(MAX,3+Math.floor(S.level/6)), count=Math.random()<.55?1:2;
  for(let i=0;i<count;i++){
    const l=i===0&&ls.includes(c.fav)&&Math.random()<.6?c.fav:pick(ls);

}
function tickBaskets(){
  const now=Date.now(), p=period(), C=cap();
  for(const k of lines()){
    const b=S.baskets[k]||(S.baskets[k]={c:C,t:now});
    if(b.c>=C){b.t=now;continue;}
    const g=Math.floor((now-b.t)/p); if(g>0){ b.c=Math.min(C,b.c+g); b.t+=g*p; if(b.c>=C)b.t=now; }
  }
}

  o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0+.26);}catch(e){} }

  xp=Math.round(xp*(1+S.decor.length/100)*lapBonus()); co=Math.round(co*lapBonus()); S.xp+=xp; S.coins+=co; S.stats.xp+=xp;
  const ups=[]; while(S.xp>=need(S.level)){ S.xp-=need(S.level); S.level++; ups.push(S.level); }
  if(ups.length) levelUp(ups); return xp;
}
function levelUp(ups){
  const news=[]; let co=0;
  for(const n of ups){ co+=20+5*n;
    if(n===2) news.push(t('uRush'));
    if(n===3) news.push(t('uRec'));
    if(n===6) news.push(t('uDeco'));
    EXPS.forEach((e,i)=>{ if(e.lvl===n) news.push(t('uExp',i+1)); });
    if(n%6===0&&n<=30) news.push(t('uHarder'));
    if(n%5===0){ S.boost.mag++; S.boost.rec++; news.push(t('uGift')); }
  }
  S.coins+=co; refill(); beep(660); beep(880,.12); beep(1100,.24);
  modal(`<div class="big">🎉</div><h1>${t('lvlTitle',S.level)}</h1><p>${t('lvlP',fmt(co))}</p>${news.length?'<ul>'+news.map(x=>`<li>${x}</li>`).join('')+'</ul>':''}<button class="btn" data-act="lvlok">${t('cont')}</button>`);
}

function merge(from,to,quiet){

function travel(){
  if(S.served<goal(S.stop)) return;

  const ls=lines(), now=Date.now(), f=feira(S.stop); let sold=0;
  S.board=S.board.map(x=>{ if(x&&!ls.includes(x.l)){ sold+=COV[x.n]; return null; } return x; });
  S.baskets={}; ls.forEach(k=>S.baskets[k]={c:cap(),t:now}); S.orders=[]; fillBoard(S);
  const rew=Math.min(500,50+25*old); S.coins+=sold+rew; S.boost.mag++; sel=null; selOrder=null; offer=null;
  sheetName=null; $('sheet').hidden=true; homeOn=false; beep(520); beep(660,.12); beep(880,.24);

  const co=20*Math.min(S.streak,7); S.coins+=co; const wk=S.streak%7===0; if(wk){ S.boost.mag+=2; S.boost.rec+=2; }

  } else {
    const tg=(k,[a,b])=>`<div class="row"><div><b>${a}</b><p>${b}</p></div><button class="btn${S.opts[k]?'':' ghosty'}" data-act="opt:${k}" aria-pressed="${S.opts[k]}">${S.opts[k]?t('on'):t('off')}</button></div>`;
    h=`<div class="row"><div><b>${t('lang')}</b><p>${t('langP')}</p></div><div class="seg"><button data-act="lang:pt" aria-pressed="${LANG==='pt'}">Português</button><button data-act="lang:en" aria-pressed="${LANG==='en'}">English</button></div></div>`
     +tg('sound',t('oSound'))+tg('noAds',t('oNoAds'))+tg('test',t('oTest'))
     +`<h2>${t('panel')}</h2><div class="stats" id="stats">${statsHtml()}</div><p class="note">${t('panelNote')}</p>`
     +`<div class="row"><div><b>${t('reset')}</b><p class="warn">${t('resetP')}</p></div><button class="btn ghosty" data-act="reset">${t('resetB')}</button></div>`;
  }
  $('sheetin').innerHTML=`<header><h1>${T[sheetName]}</h1><button class="btn ghosty" data-act="close">${t('close')}</button></header>${h}`;
}

/* ===================== ENTRADA ===================== */
document.addEventListener('click',e=>{
  lastAct=Date.now();
  const a=e.target.closest('[data-act]');
  if(a){ const [k,v]=a.dataset.act.split(':');
    if(k==='basket') spawn(v);
    else if(k==='play'){ homeOn=false; render(); }
    else if(k==='home'){ homeOn=true; tip=Math.floor(Math.random()*TIPS.length); sel=null; selOrder=null; render(); }
    else if(k==='lang') setLang(v);
    else if(k==='gift') claimGift();
    else if(k==='magnet') magnet();
    else if(k==='recharge') recharge();
    else if(k==='adcharge'){ if(S.daily.adCharge<6) showAd('rew',()=>{ S.daily.adCharge++; const g=Math.round(10*bonus()); refill(g); toast(t('adCharge',g)); }); }
    else if(k==='deliver'){ if(sel!=null) deliver(sel); }
    else if(k==='enc'){ if(sel!=null) deliverEnc(sel); }
    else if(k==='sell'){ if(sel!=null) sell(sel); }
    else if(k==='sort') sortBoard();
    else if(k==='swap') swapOrder(+v);
    else if(k==='double'){ const o=offer; if(o&&S.daily.adDouble<10){ offer=null; showAd('rew',()=>{ S.daily.adDouble++; const x=gain(o.xp*bonus(),Math.round(o.co*bonus())); toast(t('doubled',x)); }); } }
    else if(k==='nav'){ sheetName=v; $('sheet').hidden=false; renderSheet(); $('sheet').scrollTop=0; }
    else if(k==='close'){ sheetName=null; $('sheet').hidden=true; render(); }
    else if(k==='claim'){ const m=S.missions[+v]; if(m&&m.p>=m.goal){ S.missions[+v]=newMission(S,+v); S.coins+=m.co; const x=gain(m.xp,0); beep(880); toast(t('missDone',m.co,x)); render(); } }
    else if(k==='chest'){ if(S.daily.chest<3) showAd('rew',()=>{ S.daily.chest++; S.coins+=Math.round(80*bonus()); S.boost.mag++; }); }
    else if(k==='buyexp') expand();
    else if(k==='buyup'){ const c=upCost(v); if(S.up[v]<UPS[v].max&&S.coins>=c){ S.coins-=c; S.up[v]++; if(v==='cap') refill(); beep(820); render(); } }
    else if(k==='buydeco'){ const i=+v; if(!S.decor.includes(i)&&S.level>=6&&S.coins>=DECOR[i][2]){ S.coins-=DECOR[i][2]; S.decor.push(i); beep(820); render(); } }
    else if(k==='opt'){ S.opts[v]=!S.opts[v]; for(const x of lines()) S.baskets[x].t=Date.now(); render(); }
    else if(k==='travelask'){ closeModal(); travelAsk(); }
    else if(k==='travel'){ closeModal(); travel(); }
    else if(k==='mclose'){ closeModal(); render(); }
    else if(k==='reset') modal(`<h2>${t('resetQ')}</h2><p>${t('resetQP')}</p><button class="btn" data-act="resetyes">${t('resetYes')}</button><button class="btn ghosty" data-act="mclose">${t('cancel')}</button>`);
    else if(k==='resetyes'){ try{ localStorage.removeItem('quitanda-zen-v1'); }catch(e){} S=fresh(); sel=null; selOrder=null; offer=null; modalQ=[]; closeModal(); sheetName=null; $('sheet').hidden=true; homeOn=true; render(); }
    else if(k==='lvlok'){ closeModal(); render(); maybeInter(); }
    return;
  }
  if(noClick) return;
  const o=e.target.closest('[data-order]');
  if(o){ const id=+o.dataset.order, ord=S.orders.find(x=>x.id===id); if(!ord) return;
    if(sel!=null){ deliver(sel,id); return; }
    const i=S.board.findIndex(x=>x&&matches(ord,x));
    if(i>=0) deliver(i,id); else { selOrder=selOrder===id?null:id; render(); }
    return; }
  if(e.target.closest('[data-enc]')){ if(sel!=null) deliverEnc(sel); else toast(t('encHint',ENC_N,encLvl())); return; }
  const c=e.target.closest('[data-cell]'); if(!c) return;
  const i=+c.dataset.cell, it=S.board[i]; selOrder=null;
  if(sel!=null&&sel!==i){ const a=S.board[sel];
    if(!it||(a&&it.l===a.l&&it.n===a.n&&it.n<MAX)){ drop(sel,i); return; }
    sel=i;
  } else if(sel===i) sel=null; else if(it) sel=i;
  render();
});
$('board').addEventListener('pointerdown',e=>{ lastAct=Date.now(); const c=e.target.closest('[data-cell]'); if(!c) return; const i=+c.dataset.cell; if(!S.board[i]) return; drag={i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,g:null}; });
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){ drag.on=true; const it=S.board[drag.i]; drag.g=document.createElement('div'); drag.g.className='ghost'; drag.g.textContent=item(it.l,it.n)[0]; document.body.appendChild(drag.g);
    const c=$('board').querySelector(`[data-cell="${drag.i}"]`); if(c)c.classList.add('drag'); }
  if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px'; }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; if(!d.on) return;
  d.g.remove(); noClick=true; setTimeout(()=>noClick=false,60); lastAct=Date.now();
  const el=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest('[data-cell]'), o=el&&el.closest('[data-order]'), en=el&&el.closest('[data-enc]');
  if(c) drop(d.i,+c.dataset.cell); else if(o) deliver(d.i,+o.dataset.order); else if(en) deliverEnc(d.i); else render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));
new ResizeObserver(()=>{ if(S) fit(); }).observe($('wrap'));

function start(d){
  LANG=detectLang(); S=(d&&d.v===2&&Array.isArray(d.board))?d:load();
  let q=null; try{ q=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(q==='en'||q==='pt') S.opts.lang=q; LANG=S.opts.lang||LANG; S.opts.lang=LANG;
  applyLang(); render(); setInterval(tick,1000);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
