<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quitanda Zen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Telas: inicial (home), jogo (app), folhas (mapa, turma, missões, receitas, melhorias, ajustes) e cartões modais. */
:root{
  --introbg:#FFF6D9; --introedge:transparent;
  --r0:#9FD5B4; --r1:#F4C98E; --r2:#E6DA86; --r3:#A9C8EC; --r4:#C9B5E6;
  --bg:#DCEFE4; --panel:#F6FBF8; --cell:#FFFFFF; --hole:#C6E2D3; --ink:#1D4A3F; --muted:#557A6E;
  --accent:#2A8F63; --on-accent:#FFFFFF; --gold:#B87A00; --line:#B5D6C5; --scrim:rgba(16,40,33,.82); --warn:#B4472E;
  --sun:#F2B33D; --land:#BFE3CF; --stripe:#E4573D;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --text:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350 } }
:root[data-theme="dark"]{
  --bg:#11231E; --panel:#1A332C; --cell:#27473D; --hole:#172E28; --ink:#E3F2EB; --muted:#9BBBAF;
  --accent:#4CC38A; --on-accent:#0B1F18; --gold:#F0C04A; --line:#2F5347; --scrim:rgba(5,14,11,.86); --warn:#F08A6E;
  --sun:#F0C04A; --land:#21443A; --stripe:#D9604A; color-scheme:dark;
  --r0:#2F6A4E; --r1:#7A5A2E; --r2:#6A6230; --r3:#2F5579; --r4:#584575; --introbg:#1C1A12; --introedge:#6B6350 }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-weight:600;font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px}
.icon{background:var(--panel);border-radius:12px;width:38px;height:38px;font-size:18px;flex:0 0 auto}
.lvl{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 10px;white-space:nowrap}
.xp{flex:1;min-width:0}
.xp small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:5px;background:var(--hole);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.coins{font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--panel);border-radius:12px;padding:6px 8px}
.coins b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 14px/1 var(--text);margin-left:4px;vertical-align:1px}
.orders{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:4px}
.order{min-width:0;background:var(--cell);border:2.5px solid var(--line);border-radius:16px;padding:5px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;box-shadow:0 3px 0 var(--line);position:relative}
.order.ready{border-color:var(--accent);box-shadow:0 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--cell))}
.order.ready::after{content:"✓";position:absolute;top:-8px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:800 12px/20px var(--text);text-align:center}
.order.rush{border-color:var(--warn)}
.order.want,.order.osel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.order .who{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:3px;line-height:1.2}
.order .pay{font:800 11px/1 var(--text);color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:99px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.order .pay.x2{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.order .who i{font-style:normal;font-size:17px;line-height:1}
.order.rush .who{color:var(--warn)}
.need{display:flex;gap:9px;font-size:26px;line-height:1.1}
.need span{position:relative}
.need sub{position:absolute;right:-7px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:99px;background:var(--lc,var(--accent));color:#fff;font:800 11px/17px var(--text);text-align:center;box-shadow:0 0 0 1.5px var(--cell)}
.need .ok{opacity:.3}
.striprow{display:flex;gap:6px}
.striprow .strip{flex:1;min-width:0}
.encb{flex:0 0 auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:3px 8px;font-size:12px;white-space:nowrap;font-weight:800}
.encb small{color:var(--muted);font-weight:600}
.encb.want{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.strip{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:5px 10px;font-size:12px;text-align:left;min-height:28px}
.strip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .bar{flex:1;min-width:40px;height:8px}
.strip.go{background:var(--sun);color:#3A2A00;font-weight:800;justify-content:center;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.coach{box-shadow:inset 0 0 0 2px var(--sun)}
.coach .zs{font-size:24px;line-height:1}
.tutglow{animation:tutglow 1s ease-in-out infinite;position:relative;z-index:1}
@keyframes tutglow{50%{box-shadow:0 0 0 4px var(--sun);transform:scale(1.05)}}
.encb.chama{animation:tutglow 1s ease-in-out infinite;border-color:var(--sun)}
.pulahint{margin-top:18px;font-size:12px;color:var(--muted);opacity:.8}
.intro.curta g{animation-duration:.01s!important;animation-delay:0s!important}
.ver{color:var(--muted);font-size:12px;text-align:center;padding:8px;width:100%}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:22%;background:var(--hole);position:relative;display:grid;place-items:center}
.cell.has{background:var(--cell);box-shadow:0 3px 0 var(--lc,var(--line))}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.drag{opacity:.3}
.cell.trail{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.08)}
.cell.hint{animation:hint .9s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.1);outline:2px solid var(--gold)}}
.cell .em{font-size:calc(var(--cs)*.54);line-height:1}
.cell .lv{position:absolute;right:4%;bottom:4%;min-width:calc(var(--cs)*.34);height:calc(var(--cs)*.34);border-radius:99px;background:var(--lc,var(--accent));color:#fff;font-size:calc(var(--cs)*.22);font-weight:800;display:grid;place-items:center}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fx{position:fixed;z-index:16;pointer-events:none;font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);transform:translate(-50%,-50%);animation:fx .9s ease-out forwards;white-space:nowrap}
@keyframes fx{to{transform:translate(-50%,-260%);opacity:0}}
@media (prefers-reduced-motion: reduce){.cell.pop,.cell.hint,.tutglow,.encb.chama,.strip.go,.floaty i,.node .ring{animation:none!important}.fx{animation-duration:.01s}}
.ii{width:1.12em;height:1.12em;object-fit:contain;vertical-align:-.2em;pointer-events:none;-webkit-user-drag:none}
.ghost{position:fixed;z-index:15;pointer-events:none;font-size:40px;line-height:1;transform:translate(-50%,-70%)}
.info{min-height:42px;background:var(--panel);border-radius:14px;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.info p{margin:0;flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.btn{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:99px;padding:8px 14px;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn.ghosty{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.baskets{display:flex;gap:4px}
.basket{flex:1 1 0;min-width:0;background:var(--panel);border:2px solid var(--line);border-bottom:4px solid var(--lc,var(--line));border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.basket:active{transform:translateY(2px)}
.basket .em{font-size:21px;line-height:1.1}
.basket b{font-family:var(--display);font-size:14px;line-height:1.1;font-variant-numeric:tabular-nums}
.basket small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.basket.ad{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.basket.ad small{color:var(--on-accent)}
.basket.bo{flex:.75 1 0}.basket.bo .em{font-size:20px;line-height:1.32}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.nav button{background:var(--panel);border-radius:12px;padding:6px 2px;font-weight:800;font-size:11px;min-width:0;position:relative;line-height:1.2}
.nav button span{display:block;font-size:17px}
.albl{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px;font-size:14px} .albl span{color:var(--muted);font-size:12px;font-weight:800}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ing{background:var(--panel);border-radius:12px;padding:6px 3px 5px;text-align:center;position:relative;box-shadow:inset 0 -3px 0 var(--lc);min-width:0}
.ing .e{display:block;font-size:30px;line-height:1.15;height:36px} .ing .e .ii{vertical-align:0}
.ing small{display:block;font-size:10.5px;line-height:1.2;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing i{position:absolute;top:3px;left:5px;font:800 10px var(--text);font-style:normal;color:var(--muted)}
.ing em{position:absolute;top:-5px;right:-3px;background:var(--sun);color:#3a2a00;font:800 9px var(--text);font-style:normal;border-radius:99px;padding:1px 5px}
.ing.no{opacity:.55} .ing.no .e{filter:grayscale(1)} .ing.new{box-shadow:inset 0 -3px 0 var(--lc),0 0 0 2px var(--sun)}
.xcode{width:100%;font:12px/1.35 ui-monospace,monospace;border-radius:10px;border:2px solid var(--line);padding:8px;background:var(--cell);color:var(--ink);resize:none;word-break:break-all}
.card h3{margin:4px 0 0;font-size:14px}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:2px}
.dot{position:absolute;top:4px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.sheet,.over,.home{position:fixed;inset:0}
.home{z-index:18;background:var(--bg);overflow:auto;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-inline:16px;display:flex}
.homein{max-width:420px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;position:relative}
.logo{font-family:var(--display);font-weight:800;line-height:.9}
.logo b{display:block;font-size:52px;color:var(--accent);letter-spacing:-1px}
.logo small{display:block;font-family:var(--text);font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.floaty{position:relative;height:0}
.floaty i{position:absolute;font-style:normal;font-size:26px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.stall{background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.awning{height:30px;background:repeating-linear-gradient(90deg,var(--stripe) 0 28px,#FFF6E8 28px 56px);border-bottom-left-radius:14px 10px;border-bottom-right-radius:14px 10px}
.shelf{display:flex;justify-content:center;gap:4px;font-size:26px;padding:10px 8px 4px;flex-wrap:wrap}
.deco{font-size:18px;min-height:8px;letter-spacing:4px}
.keeper{display:flex;align-items:center;gap:10px;padding:8px 12px 12px;text-align:left}
.keeper span{font-size:40px;line-height:1}
.keeper p{margin:0;background:var(--bg);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13px;flex:1}
.play{font-family:var(--display);font-weight:800;font-size:26px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.where{background:var(--panel);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.where small{color:var(--muted)}
.where.art{background:linear-gradient(to top,rgba(20,24,20,.82),rgba(20,24,20,.35) 55%,rgba(20,24,20,0) 85%),var(--art) center 40%/cover,var(--panel);color:#fff;min-height:132px;justify-content:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.where.art small{color:rgba(255,255,255,.88)}
.hnav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.hnav button{background:var(--panel);border-radius:12px;padding:7px 1px;font-weight:800;font-size:10px;position:relative;min-width:0;overflow:hidden;white-space:nowrap}
.hnav span{display:block;font-size:19px}
.gift{background:var(--sun);color:#3A2A00;font-weight:800;border-radius:14px;padding:10px}
.sheet{z-index:20;background:var(--bg);overflow:auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet>div{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.1} h2{font-size:18px;margin-top:6px}
.row{background:var(--panel);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.row>div{flex:1;min-width:0}
.row p{margin:2px 0 0;color:var(--muted);font-size:13px}
.row b{font-weight:800}
.row.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.row.lock{opacity:.6}
.row .face{font-size:34px;line-height:1;flex:0 0 auto;width:44px;text-align:center}
.row .bar{margin-top:6px;height:8px}
.note{color:var(--muted);font-size:13px;margin:0;max-width:60ch}
.map{background:var(--panel);border-radius:20px;padding:8px}
.map svg{display:block;width:100%;height:auto;max-height:52vh}
.uf{stroke:var(--panel);stroke-width:1.6;stroke-linejoin:round}
.r0{fill:var(--r0)} .r1{fill:var(--r1)} .r2{fill:var(--r2)} .r3{fill:var(--r3)} .r4{fill:var(--r4)}
.uflab{font:800 13px var(--text);fill:var(--ink);opacity:.5;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.uflab.s{font-size:9px}
.route{fill:none;stroke:var(--ink);opacity:.35;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
.route.done{stroke:var(--accent);opacity:1;stroke-dasharray:none;stroke-width:4}
.trippath{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round}
.node circle{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.node text,.veh{text-anchor:middle;dominant-baseline:central;font-size:20px}
.node.done circle{stroke:var(--accent);stroke-width:3}
.node .ok{fill:var(--accent);stroke:var(--panel);stroke-width:2} .node .okt{font:800 10px var(--text);fill:var(--on-accent)}
.node.cur circle{stroke:var(--sun);stroke-width:4}
.node .ring{fill:none;stroke:var(--sun);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.node.lock{opacity:.75} .node.lock image{filter:grayscale(1)}
.veh{font-size:40px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);padding:6px 0 2px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.trip{position:fixed;inset:0;z-index:32;background:var(--scrim);display:grid;place-items:center;padding:16px}
.tripin{background:var(--panel);border-radius:20px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:center}
.tripin .map{padding:0}
.tripin p{margin:0;color:var(--muted)}
.thumb{flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:30px;line-height:1;position:relative}
.thumb b{position:absolute;right:-5px;bottom:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:800 12px var(--text);display:grid;place-items:center}
.thumb svg{width:44px;height:44px}
.thumb .gc{fill:var(--line)} .thumb .gn{fill:var(--gold)}
.nn{color:var(--accent);font-weight:800}
.btn.buy{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 12px}
.btn.buy small{font-size:12px}
.help .thumb{font-size:26px}
.card .btn{white-space:normal}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--panel);border-radius:14px;padding:12px;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){font-weight:800;text-align:right}
.over{z-index:30;background:var(--scrim);display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border-radius:20px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90vh;overflow:auto}
.card p{margin:0}
.card .big{font-size:48px;line-height:1}
.card .hero{margin:-20px -20px 2px;aspect-ratio:16/9;overflow:hidden;border-radius:20px 20px 0 0;flex:0 0 auto;background:var(--bg)}
.card .hero.inline{margin:0;border-radius:12px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.mtile{flex:0 0 auto;width:56px;height:56px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--bg);position:relative}
.mtile img{width:100%;height:100%;object-fit:cover;display:block}
.mtile.lock img{filter:grayscale(1) blur(1.5px);opacity:.6}
.mtile.lock::after{content:'🔒';position:absolute;font-size:22px}
.mtile.xs{width:22px;height:22px;border-radius:6px;font-size:15px}
.card ul{margin:0;padding-left:18px;text-align:left}
.adbox{border:2px dashed var(--line);border-radius:14px;padding:24px 12px;color:var(--muted)}
.intro{position:fixed;inset:0;z-index:40;background:var(--introbg);display:grid;place-items:center;cursor:pointer;transition:opacity .5s}
.headc{stroke:var(--introedge);stroke-width:2}
.intro.out{opacity:0;pointer-events:none}
.introin{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.introin svg{width:min(70vw,300px);height:auto;overflow:visible}
.intro g{transform-origin:0 0}
.bdx{animation:bdx 1.9s cubic-bezier(.25,.55,.3,1) both}
.bdy{animation:bdy 1.9s cubic-bezier(.45,0,.25,1) both}
.btilt{animation:btilt 1.9s ease-in-out both}
@keyframes bdx{from{transform:translateX(-150px)}}
@keyframes bdy{from{transform:translateY(-120px);opacity:0}15%{opacity:1}}
@keyframes btilt{0%{transform:rotate(-6deg)}70%{transform:rotate(-20deg)}100%{transform:none}}
.flap{animation:flap 1.9s ease-in-out both}
@keyframes flap{0%{transform:rotate(-12deg)}11%{transform:rotate(24deg)}23%{transform:rotate(-14deg)}36%{transform:rotate(22deg)}50%{transform:rotate(-12deg)}64%{transform:rotate(18deg)}80%{transform:rotate(-6deg)}100%{transform:rotate(12deg)}}
.flap2{animation-name:flap2}
@keyframes flap2{0%{transform:rotate(-8deg)}11%{transform:rotate(26deg)}23%{transform:rotate(-10deg)}36%{transform:rotate(24deg)}50%{transform:rotate(-8deg)}64%{transform:rotate(20deg)}80%{transform:rotate(-2deg)}100%{transform:rotate(14deg)}}
.fold{animation:fold .7s 1.85s cubic-bezier(.4,0,.2,1) both}
@keyframes fold{to{transform:rotate(58deg) scale(.3,.42);opacity:0}}
.wingf{animation:wingf .5s 2.15s ease-out both}
@keyframes wingf{from{opacity:0}}
.tailg{animation:tailg .7s 1.85s ease-in-out both}
@keyframes tailg{from{transform:scaleY(1.9) rotate(-8deg)}}
.perch{animation:dip 1.1s 1.82s cubic-bezier(.3,0,.3,1) both}
@keyframes dip{0%{transform:none}30%{transform:rotate(4.5deg)}62%{transform:rotate(-1.2deg)}100%{transform:none}}
.bill{transition:transform .09s ease-out}
.bill.open{transform:rotate(24deg)}
.wm{font:800 clamp(44px,13vw,64px)/1 var(--display);color:var(--ink);letter-spacing:-1px;position:relative;margin-top:6px}
.wm span{display:inline-block;opacity:0;transform:translateY(10px) scale(.9);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.wm span.on{opacity:1;transform:none}
.wm .y{color:#E0A800}
.wm::after{content:"";position:absolute;left:4%;right:4%;bottom:-6px;height:7px;border-radius:7px;background:#F7C51E;transform-origin:left;transform:scaleX(0);transition:transform .5s ease-out}
.wm.done::after{transform:scaleX(1)}
.wsub{font:800 13px var(--text);letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin-top:12px;opacity:0;transition:opacity .5s}
.wsub.on{opacity:1}
@media (prefers-reduced-motion: reduce){.intro g{animation-duration:.01s!important;animation-delay:0s!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-weight:800;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.tag{display:inline-block;background:var(--sun);color:#3A2A00;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:800}
.fxe{position:fixed;left:0;top:0;z-index:17;pointer-events:none;transform:translate(-50%,-50%);line-height:1;will-change:transform,opacity}
.fxe.chip{width:8px;height:8px;border-radius:2px}
.fxe.bub{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px #7FB9E6}
.fxe.ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--gold)}
.fxe.txt{font:800 22px var(--display);color:var(--gold);text-shadow:0 2px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel);white-space:nowrap}
.warn{color:var(--warn)}
.logo .say{font-family:var(--text);font-weight:600;font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.3}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{background:var(--panel);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.info i{color:var(--muted);font-size:12px}
</style>

const $=id=>document.getElementById(id), fmt=n=>Math.round(n).toLocaleString(LANG==='en'?'en-US':'pt-BR');
const dstr=t=>new Date(t).toLocaleDateString('sv'), today=()=>dstr(Date.now());
const pick=a=>a[Math.floor(Math.random()*a.length)];
// Arte dos itens (pasta itens/, nome = código da lista de arte, ex.: fr-1). Sem arte, fica o emoji.
const ITEM_ART=new Set(['fr','pe','ve','te','be','ar'].flatMap(l=>[1,2,3,4,5,6,7,8].map(n=>l+'-'+n)).concat(['ca-2','gr-1','gr-2','gr-3','gr-4','gr-6','gr-7','gr-8','do-1','do-2']));
const ie=(l,n)=>ITEM_ART.has(l+'-'+n)?`<img class="ii" src="itens/${l}-${n}.webp" alt="" draggable="false">`:LINES[l].it[n-1][0];
const item=(l,n)=>{ const x=LINES[l].it[n-1]; return [ie(l,n),LANG==='en'?x[2]:x[1]]; };
const gloss=(l,n)=>LANG==='en'?GLOSS[l+n]:null;
const lname=l=>tx(LINES[l].name);
const lc=l=>`hsl(${LINES[l].hue} 62% 46%)`;
const feira=s=>FEIRAS[s%FEIRAS.length], lap=s=>Math.floor(s/FEIRAS.length)+1;
// Arte dos mercados (pasta mercados/). Sem arte, fica o emoji do mercado.
const artUrl=f=>f.img?`mercados/${f.img}.webp`:'';
const heroHtml=(f,cls='')=>f.img?`<div class="hero${cls?' '+cls:''}"><img src="${artUrl(f)}" alt="${f.n}, ${f.c}" onerror="this.parentNode.outerHTML='<div class=&quot;big&quot;>${f.ic}</div>'"></div>`:`<div class="big">${f.ic}</div>`;

const isAdj=(x,y,cols)=>{ const d=Math.abs(x-y); return d===cols||(d===1&&Math.floor(x/cols)===Math.floor(y/cols)); };
function doMerge(b,cols,rows,from,to,via){
  const a=b[from],t=b[to];
  if(!a||!t||from===to||a.l!==t.l||a.n!==t.n||a.n>=MAX) return null;
  let n=a.n+1, third=-1;
  // Fusão tripla só com intenção: via = item igual, vizinho do destino, por cima do qual o dedo passou.
  if(via!=null&&via>=0&&via!==from&&via!==to&&a.n+2<=MAX&&b[via]&&b[via].l===a.l&&b[via].n===a.n&&isAdj(via,to,cols)) third=via;
  if(third>=0){b[third]=null;n=a.n+2;}
  b[from]=null; b[to]={l:a.l,n}; return {n,third};
}
function fillBoard(s){ const ls=linesAt(s.stop);
  s.board=s.board.map(x=>{ if(x) return x; const r=Math.random(); return {l:pick(ls),n:r<.5?1:r<.8?2:r<.95?3:4}; }); }
function newMission(s,slot){
  const used=s.missions.filter((m,i)=>m&&i!==slot).map(m=>m.t), t=pick(Object.keys(MTYPES).filter(k=>!used.includes(k))), tier=s.missTier++;
  return {t,goal:Math.round(MTYPES[t][1]*(1+.5*Math.floor(tier/3))),p:0,co:Math.min(300,30+10*tier),xp:20+5*tier};
}

function newOrder(){
  const ls=lines(), cast=castAt(S.stop), loc=cast.filter(x=>x.at>=0), c=pick(Math.random()<.6?loc:cast), o={id:S.nextId++,who:c.id,items:[]};
  if(S.level>=2&&Math.random()<.22) o.rush=Date.now()+75000;
  if(S.level>=3&&Math.random()<.25){
    let rs=RECIPES.map((r,i)=>i).filter(i=>RECIPES[i].it.every(x=>ls.includes(x[0])));
    const fr=rs.filter(i=>!S.recipes.includes(i)); if(fr.length) rs=fr;
    if(rs.length){ o.rec=pick(rs); o.items=RECIPES[o.rec].it.map(([l,n])=>({l,n,done:false})); return o; }
  }
  const lo=Math.min(4,2+Math.floor(S.level/20)), hi=Math.min(MAX,3+Math.floor(S.level/6)), count=Math.random()<.55?1:2;
  for(let i=0;i<count;i++){
    const l=i===0&&ls.includes(c.fav)&&Math.random()<.6?c.fav:pick(ls);
    o.items.push({l,n:lo+Math.floor((hi-lo+1)*Math.pow(Math.random(),2.2)),done:false}); }
  return o;
}
function tickBaskets(){
  const now=Date.now(), p=period(), C=cap();
  for(const k of lines()){
    const b=S.baskets[k]||(S.baskets[k]={c:C,t:now});
    if(b.c>=C){b.t=now;continue;}
    const g=Math.floor((now-b.t)/p); if(g>0){ b.c=Math.min(C,b.c+g); b.t+=g*p; if(b.c>=C)b.t=now; }
  }
}
function refill(n){ for(const k of lines()){ const b=S.baskets[k]; b.c=n==null?Math.max(b.c,cap()):Math.min(cap()+10,b.c+n); } }

  carregar(k){ if(this.p[k]||!audio) return this.p[k]; try{ const s=atob(SFX_B64[k]), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
    this.p[k]=new Promise((ok,no)=>audio.decodeAudioData(u.buffer,ok,no)).then(b=>(this.buf[k]=b)).catch(()=>null); }catch(e){ this.p[k]=Promise.resolve(null); } return this.p[k]; },
  tocar(k,vol){ if(!S.opts.sound) return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); }catch(e){ return; }
    const go=b=>{ if(!b) return; const s=audio.createBufferSource(), g=audio.createGain(); g.gain.value=vol||.9; s.buffer=b; s.connect(g); g.connect(audio.destination); s.start(audio.currentTime+.01); };
    if(this.buf[k]) go(this.buf[k]); else { const p=this.carregar(k); if(p) p.then(go); } } };

function beep(f,d){ if(!S.opts.sound) return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain(), t0=audio.currentTime+(d||0);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.08,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.25);
  o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0+.26);}catch(e){} }
// Música de fundo: melodia calma em escala pentatônica, gerada na hora (sem arquivos). Liga em Ajustes.
/* Música de fundo: cada mercado tem a sua trilha (musica/NN.ogg, NN = número do mercado), com um toque discreto da
   música do lugar (carimbó em Belém, ijexá em Salvador, milonga em Porto Alegre…). Toca em loop e troca com fade ao
   viajar. Se o arquivo não carregar (ex.: jogo aberto direto do disco), volta a melodia gerada na hora. */
const MUS_VOL=.55;
const Musica={ tm:null, i:2, n:0, cur:null, src:null, g:null, buf:{}, falhou:false,
  ligar(){ const on=S.opts.music!==false&&S.opts.sound; if(!on){ this.parar(); return; }
    try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); }catch(e){ return; }
    if(this.falhou){ this.procedural(); return; }
    this.tocar(String(S.stop%FEIRAS.length+1).padStart(2,'0')); },
  carregar(k){ return this.buf[k]||(this.buf[k]=fetch(`musica/${k}.ogg`).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>new Promise((ok,no)=>audio.decodeAudioData(b,ok,no)))); },
  tocar(k){ if(this.cur===k&&this.src) return; this.cur=k;
    this.carregar(k).then(b=>{ if(this.cur!==k||S.opts.music===false||!S.opts.sound) return;
      const src=audio.createBufferSource(), g=audio.createGain(), t0=audio.currentTime; src.buffer=b; src.loop=true;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(MUS_VOL,t0+1.5); src.connect(g); g.connect(audio.destination); src.start(t0);
      this.soltar(); this.src=src; this.g=g; })
    .catch(()=>{ this.falhou=true; this.cur=null; this.procedural(); }); },
  soltar(){ if(!this.src) return; const s=this.src, g=this.g, t0=audio.currentTime; g.gain.cancelScheduledValues(t0); g.gain.setValueAtTime(g.gain.value,t0); g.gain.linearRampToValueAtTime(0,t0+1.2); s.stop(t0+1.3); this.src=null; this.g=null; },
  parar(){ clearInterval(this.tm); this.tm=null; if(audio) this.soltar(); this.cur=null; },
  procedural(){ if(this.tm) return; this.tm=setInterval(()=>this.nota(),720); },
  nota(){ if(document.visibilityState!=='visible'||!audio||audio.state!=='running') return;
    const E=[261.6,293.7,329.6,392,440,523.3,587.3,659.3]; this.n++;
    if(this.n%8===7) return;                                   // respiro
    this.i=Math.max(0,Math.min(E.length-1,this.i+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
    const toca=(f,v,d,tipo)=>{ const o=audio.createOscillator(), g=audio.createGain(), t0=audio.currentTime; o.type=tipo; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.06); g.gain.exponentialRampToValueAtTime(.0008,t0+d); o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0+d+.05); };
    toca(E[this.i],.022,1.5,'sine'); if(this.n%4===0) toca(E[[0,3,4,3][(this.n/4)%4]]/2,.02,2.6,'triangle'); } };
// fora da tela, a música (e o resto do áudio) dorme
document.addEventListener('visibilitychange',()=>{ if(!audio||!Musica.src) return; if(document.visibilityState==='visible') audio.resume&&audio.resume(); else audio.suspend&&audio.suspend(); });
function bump(k,n){ for(const m of S.missions) if(m.t===k) m.p+=n; }
function fx(i,m){ fxQ.push([i,m]); }

// Álbum de ingredientes: tudo que já passou pelo tabuleiro. Linha completa (8 níveis) rende um bônus.
const ALB_XP=100, ALB_CO=150;
function noteSeen(){
  for(const x of S.board) if(x&&!S.seen[x.l+x.n]) S.seen[x.l+x.n]=x.n===1?2:1;
  for(const l of Object.keys(LINES)) if(!S.albumDone.includes(l)&&LINES[l].it.every((_,j)=>S.seen[l+(j+1)])){
    S.albumDone.push(l); setTimeout(()=>{ const x=gain(ALB_XP,ALB_CO); Sfx.tocar('premio'); toast(t('albDone',lname(l),x,Math.round(ALB_CO*lapBonus()))); save(); render(); },300); }

/* ===================== ANIMAÇÕES DAS FERRAMENTAS ===================== */
// Camada de efeitos por cima do jogo (Web Animations API). Com "reduzir movimento" ligado, os efeitos são pulados.
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=(x,y,s,r)=>`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})${r!=null?` rotate(${r}deg)`:''}`;
const ctr=r=>[r.left+r.width/2,r.top+r.height/2];
const cellEl=i=>$('board')&&$('board').querySelector(`[data-cell="${i}"]`);
function fxEl(html,x,y,cls,size){ const d=document.createElement('div'); d.className='fxe'+(cls?' '+cls:''); d.innerHTML=html; d.style.left=x+'px'; d.style.top=y+'px'; if(size) d.style.fontSize=size+'px'; document.body.appendChild(d); return d; }
function anim(el,kf,dur,ease,delay){ const a=el.animate(kf,{duration:dur,easing:ease||'ease-out',delay:delay||0,fill:'both'}); a.onfinish=()=>el.remove(); return a; }
function bumpEl(el,kf,dur,delay){ if(el) el.animate(kf,{duration:dur,delay:delay||0,easing:'ease-out'}); }
function floatTxt(t,x,y,delay){ anim(fxEl(t,x,y,'txt'),[{transform:T(0,0,.6),opacity:0},{transform:T(0,-12,1.15),opacity:1,offset:.25},{transform:T(0,-56,1),opacity:0}],1000,'ease-out',delay); }
function shake(el,amp){ bumpEl(el,[0,1,2,3,4,5].map(k=>({transform:`translate(${k===5?0:(k%2?-1:1)*(amp||4)*(1-k/5)}px,0)`})),300); }
// Junta-tudo: o ímã aparece no centro do tabuleiro e puxa cada par; os itens voam até a casa onde se juntam.
function fxMagnet(moves){
  const b=$('board'); if(!b||RM()||!moves.length) return; const [bx,by]=ctr(b.getBoundingClientRect()), mv=moves.slice(0,40), st=Math.min(60,900/mv.length);
  anim(fxEl('🧲',bx,by,'',72),[{transform:T(0,0,.2,-30),opacity:0},{transform:T(0,0,1.2,10),opacity:1,offset:.15},{transform:T(0,0,1,-8),offset:.3},{transform:T(0,0,1.05,8),offset:.5},{transform:T(0,0,1,0),opacity:1,offset:.8},{transform:T(0,0,.3,0),opacity:0}],600+mv.length*st+500);
  for(let k=0;k<3;k++) anim(fxEl('',bx,by,'ring'),[{transform:T(0,0,.3),opacity:.9},{transform:T(0,0,4.5),opacity:0}],900,'ease-out',k*250);
  mv.forEach(([f,to,em],k)=>{ const a=cellEl(f), c=cellEl(to); if(!a||!c) return; const ra=a.getBoundingClientRect(), [x0,y0]=ctr(ra), [x1,y1]=ctr(c.getBoundingClientRect()), d=250+k*st;
    anim(fxEl(em,x0,y0,'',ra.width*.54),[{transform:T(0,0,1),opacity:1},{transform:T((x1-x0)*.5+(bx-x0)*.25,(y1-y0)*.5+(by-y0)*.25,1.15),offset:.5},{transform:T(x1-x0,y1-y0,.7),opacity:.3}],420,'ease-in',d);
    bumpEl(c,[{transform:'scale(1)'},{transform:'scale(1)',offset:.55},{transform:'scale(1.3)',filter:'brightness(1.4)',offset:.75},{transform:'scale(1)'}],560,d); });
}
// Recarga: um raio corre pelos cestos, que acendem um a um e mostram as cargas ganhas.
function fxCharge(label){
  if(homeOn||RM()) return; const bs=[...document.querySelectorAll('[data-act^="basket:"]')]; if(!bs.length) return;
  const pts=bs.map(x=>ctr(x.getBoundingClientRect())), [x0,y0]=pts[0], last=pts[pts.length-1];
  const kf=[{transform:T(-60,-40,.4,-20),opacity:0}]; pts.forEach(([x,y],k)=>kf.push({transform:T(x-x0,y-y0-(k%2?14:-6),1.2,k%2?15:-15),opacity:1,offset:(k+1)/(pts.length+1)})); kf.push({transform:T(last[0]-x0+50,last[1]-y0-30,.4,20),opacity:0});
  anim(fxEl('⚡',x0,y0,'',44),kf,300+pts.length*160,'linear');
  bs.forEach((x,k)=>{ const d=Math.round(300+pts.length*160)*(k+1)/(pts.length+1);
    bumpEl(x,[{transform:'scale(1)',filter:'none'},{transform:'scale(1.12)',filter:'brightness(1.35) drop-shadow(0 0 10px #F7C51E)',offset:.35},{transform:'scale(1)',filter:'none'}],520,d);
    floatTxt(label,pts[k][0],pts[k][1]-30,d); });
  setTimeout(()=>beep(1180),150);
}

    else if(k==='iap'&&PUB.loja) iapAsk(v);
    else if(k==='iapok'&&PUB.loja) iapBuy(v);
    else if(k==='adpriv'){ if(AdNet) AdNet.privacy(); }
    else if(k==='tripskip') endTrip();
    else if(k==='tripdouble'){ const v=tripBonus; tripBonus=0; if(v) showAd('rew',()=>{ S.coins+=v; toast(t('tripDoubled',v)); }); }
    else if(k==='arrive'){ closeModal(); render(); maybeInter(); }
    else if(k==='deliver'){ if(sel!=null) deliver(sel); }
    else if(k==='enc'){ if(sel!=null) deliverEnc(sel); }
    else if(k==='sell'){ if(sel!=null) sell(sel); }
    else if(k==='sort') sortBoard();
    else if(k==='swap') swapOrder(+v);
    else if(k==='double'){ const o=offer; if(o&&S.daily.adDouble<DOUBLE_MAX){ offer=null; showAd('rew',()=>{ S.daily.adDouble++; const x=gain(o.xp*bonus(),Math.round(o.co*bonus())); toast(t('doubled',x)); }); } }
    else if(k==='nav'){ $('toast').hidden=true; sheetName=v==='shop'&&!PUB.loja?'up':v; if(v==='rec'&&Object.values(S.seen).includes(1)) recTab='ing'; $('sheet').hidden=false; renderSheet(); $('sheet').scrollTop=0; }
    else if(k==='close'){ sheetName=null; $('sheet').hidden=true; render(); }
    else if(k==='claim'){ const m=S.missions[+v]; if(m&&m.p>=m.goal){ S.missions[+v]=newMission(S,+v); S.coins+=m.co; const x=gain(m.xp,0); beep(880); toast(t('missDone',m.co,x)); render(); } }
    else if(k==='chest'){ if(S.daily.chest<CHEST_MAX) showAd('rew',()=>{ S.daily.chest++; S.coins+=Math.round(80*bonus()); S.boost.mag++; Sfx.tocar('premio'); }); }
    else if(k==='buyexp') expand();
    else if(k==='buyup'){ const c=upCost(v); if(S.up[v]<UPS[v].max&&S.coins>=c){ S.coins-=c; S.up[v]++; beep(820); render(); } }
    else if(k==='buydeco'){ const i=+v; if(!S.decor.includes(i)&&S.level>=6&&S.coins>=DECOR[i][2]){ S.coins-=DECOR[i][2]; S.decor.push(i); beep(820); render(); } }
    else if(k==='ver'&&PUB.dev){ verTaps=(verTaps||0)+1; if(verTaps>=5){ verTaps=0; S.opts.dev=!S.opts.dev; toast(t(S.opts.dev?'devOn':'devOff')); render(); } }
    else if(k==='opt'){ S.opts[v]=!S.opts[v]; if(v==='music'||v==='sound') Musica.ligar(); for(const x of lines()) S.baskets[x].t=Date.now(); render(); }
    else if(k==='travelask'){ closeModal(); travelAsk(); }
    else if(k==='travel'){ closeModal(); travel(); }
    else if(k==='mclose'){ closeModal(); render(); }
    else if(k==='xfer') transferModal();
    else if(k==='xcopy'){ const el=$('xcode'); if(!el||!el.value) return; const ok=()=>toast(t('xferCopied'));
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(ok,()=>{ el.select(); try{ document.execCommand('copy'); ok(); }catch(e){} });
      else { el.select(); try{ document.execCommand('copy'); ok(); }catch(e){} } }

        .catch(()=>toast(t('xferBad'))); }

    else if(k==='resetyes'){ try{ localStorage.removeItem('quitanda-zen-v1'); }catch(e){} S=fresh(); sel=null; selOrder=null; offer=null; modalQ=[]; closeModal(); sheetName=null; $('sheet').hidden=true; homeOn=true; render(); }

    const i=S.board.findIndex(x=>x&&matches(ord,x));

    return; }
  if(e.target.closest('[data-enc]')){ if(sel!=null) deliverEnc(sel); else toast(t('encHint',ENC_N,encLvl())); return; }
  const c=e.target.closest('[data-cell]'); if(!c) return;
  const i=+c.dataset.cell, it=S.board[i]; selOrder=null;
  if(sel!=null&&sel!==i){ const a=S.board[sel];
    if(!it||(a&&it.l===a.l&&it.n===a.n&&it.n<MAX)){ drop(sel,i); return; }
    sel=i;
  } else if(sel===i) sel=null; else if(it) sel=i;
  render();
});
$('board').addEventListener('pointerdown',e=>{ lastAct=Date.now(); const c=e.target.closest('[data-cell]'); if(!c) return; const i=+c.dataset.cell; if(!S.board[i]) return; drag={i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,g:null,cur:-1,prev:-1}; });
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){ drag.on=true; const it=S.board[drag.i]; drag.g=document.createElement('div'); drag.g.className='ghost'; drag.g.innerHTML=item(it.l,it.n)[0]; document.body.appendChild(drag.g);
    const c=$('board').querySelector(`[data-cell="${drag.i}"]`); if(c)c.classList.add('drag'); }
  if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px';
    // Guarda o último item igual por onde o dedo passou; ele só entra na fusão se for vizinho do destino.
    const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest('#board [data-cell]'), k=c?+c.dataset.cell:-1;
    if(k>=0&&k!==drag.cur){ const it=S.board[drag.i], same=j=>j>=0&&j!==drag.i&&S.board[j]&&S.board[j].l===it.l&&S.board[j].n===it.n;
      drag.prev=same(k)&&same(drag.cur)?drag.cur:same(k)&&same(drag.prev)&&isAdj(k,drag.prev,S.cols)?drag.prev:-1; drag.cur=k;
      $('board').querySelectorAll('.trail').forEach(x=>x.classList.remove('trail'));
      if(drag.prev>=0&&it.n+2<=MAX&&isAdj(k,drag.prev,S.cols)) [k,drag.prev].forEach(j=>$('board').querySelector(`[data-cell="${j}"]`).classList.add('trail')); } }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id) return; const d=drag; drag=null; if(!d.on) return;
  d.g.remove(); noClick=true; setTimeout(()=>noClick=false,60); lastAct=Date.now();
  const el=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest('[data-cell]'), o=el&&el.closest('[data-order]'), en=el&&el.closest('[data-enc]');
  if(c) drop(d.i,+c.dataset.cell,d.prev); else if(o) deliver(d.i,+o.dataset.order); else if(en) deliverEnc(d.i); else render();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

let cantoBuf=null, cantoP=null;
function loadCanto(){ if(cantoP||!audio) return cantoP; try{ const s=atob(CANTO), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
  cantoP=new Promise((ok,no)=>audio.decodeAudioData(u.buffer,ok,no)).then(b=>(cantoBuf=b)).catch(()=>null); }catch(e){ cantoP=Promise.resolve(null); } return cantoP; }
function birdCall(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const toca=b=>{ if(!b) return birdSynth(); const s=audio.createBufferSource(), g=audio.createGain(); g.gain.value=.6; s.buffer=b; s.connect(g); g.connect(audio.destination); s.start(audio.currentTime+.01); };
  if(cantoBuf) toca(cantoBuf); else { const p=loadCanto(); if(p) p.then(toca); else birdSynth(); }
}
function birdSynth(){
  try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const c=audio, t0=c.currentTime+.04;
    const out=c.createGain(); out.gain.value=.3; out.connect(c.destination);
    CALL.forEach(([at,d,fr],n)=>{ const g=c.createGain(), t=t0+at; g.connect(out);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.035); g.gain.setValueAtTime(1,t+d*.6); g.gain.exponentialRampToValueAtTime(.001,t+d);
      [[1,.8],[2,.16],[3,.05]].forEach(([h,v])=>{ const o=c.createOscillator(), og=c.createGain(); o.type='sine'; og.gain.value=v;
        o.frequency.setValueCurveAtTime(new Float32Array(fr.map(f=>f*h)),t,d);
        if(n===2){ const lf=c.createOscillator(), lg=c.createGain(); lf.frequency.value=26; lg.gain.value=22*h; lf.connect(lg); lg.connect(o.frequency); lf.start(t); lf.stop(t+d); }
        o.connect(og); og.connect(g); o.start(t); o.stop(t+d+.02); }); });
  }catch(e){}
}
function sing(){
  if(!introState) return; const sp=[...$('wm').querySelectorAll('span')], bill=$('bill');
  CALL.forEach(([at,d],i)=>{ introState.tms.push(setTimeout(()=>{ sp[i].classList.add('on'); bill.classList.add('open'); },at*1000), setTimeout(()=>bill.classList.remove('open'),(at+d*.8)*1000)); });
  introState.tms.push(setTimeout(()=>{ $('wm').classList.add('done'); $('wsub').classList.add('on'); },1750), setTimeout(endIntro,3300));
  if(!S.opts.sound) return;
  if(audio&&audio.state==='running') birdCall();
  else { const late=()=>{ if(introState){ try{ audio.resume().then(birdCall); }catch(e){} } }; window.addEventListener('pointerdown',late,{once:true,capture:true}); }   // navegador bloqueou o som: canta no primeiro toque
}
function endIntro(){
  if(!introState) return; introState.tms.forEach(clearTimeout); introState=null;
  $('intro').classList.add('out'); setTimeout(()=>{ $('intro').hidden=true; },520);
}
function intro(){
  const el=$('intro'), curta=S.introDay===today(); S.introDay=today(); save();
  el.hidden=false; introState={t0:Date.now(),tms:[]}; $('pulahint').textContent=t('tapSkip');
  if(curta){   // já viu hoje: só o pássaro pousado e o nome, por 1,5 s
    el.classList.add('curta'); $('wm').querySelectorAll('span').forEach(x=>x.classList.add('on')); $('wm').classList.add('done'); $('wsub').classList.add('on');
    introState.tms.push(setTimeout(endIntro,1500)); return; }
  if(S.opts.sound){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); audio.resume&&audio.resume(); loadCanto(); }catch(e){} }
  introState.tms.push(setTimeout(sing,matchMedia('(prefers-reduced-motion: reduce)').matches?300:2050));   // pousou, cantou
}
function introTap(){ endIntro(); }
/* Botão voltar do Android: fecha a camada da frente (vinheta, aviso, painel), volta do tabuleiro para a tela
   inicial e, na tela inicial, sai do app no segundo toque em até 2 s. */
let backAt=0;
function voltar(){
  const C=window.Capacitor, P=C&&C.Plugins&&C.Plugins.App;
  if(!$('intro').hidden){ endIntro(); return; }
  if(!$('over').hidden){
    const ad=$('adclose'); if(ad){ if(!ad.disabled) ad.click(); return; }   // anúncio: só fecha quando a contagem acaba
    const b=$('card').querySelector('[data-act="mclose"],[data-act="lvlok"],[data-act="arrive"]'); if(b) b.click(); return; }
  if(drag) return;
  if(sheetName){ sheetName=null; $('sheet').hidden=true; render(); return; }
  if(!homeOn){ homeOn=true; tip=Math.floor(Math.random()*TIPS.length); sel=null; selOrder=null; render(); return; }
  if(Date.now()-backAt<2000){ save(); if(P&&P.exitApp) P.exitApp(); return; }
  backAt=Date.now(); toast(t('backExit'));
}
(()=>{ const C=window.Capacitor, P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.App;
  if(P&&P.addListener) P.addListener('backButton',voltar); })();
function start(d){
  LANG=detectLang(); S=(d&&d.v===2&&Array.isArray(d.board))?d:load();
  let q=null; try{ q=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(q==='en'||q==='pt') S.opts.lang=q; LANG=S.opts.lang||LANG; S.opts.lang=LANG;
  S.iap=S.iap||{n:0,usd:0,once:[]}; if(S.tut==null) S.tut=(S.stats.merges||S.stats.orders)?4:0; if(S.opts.music==null) S.opts.music=true;
  if(!S.seen){ S.seen={}; S.board.forEach(x=>{ if(x) S.seen[x.l+x.n]=2; }); }   // Álbum de ingredientes: 1 = novo, 2 = já visto
  S.albumDone=S.albumDone||[];
  if(!PUB.dev){ S.opts.dev=false; S.opts.test=false; }
  applyLang(); render(); setInterval(tick,1000);
  let q2=null; try{ q2=new URLSearchParams(location.search).get('intro'); }catch(e){} if(q2!=='0') intro();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
